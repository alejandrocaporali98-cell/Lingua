    </div>
    <div class="panel"><h2>${t.ladderT}</h2>
      <div class="ladder">${CEFR.map((c, i) => { const k = i === ci ? "now" : i === gi ? "goal" : i < ci ? "done" : (i > ci && i < gi ? "path" : ""); return `<div class="rung ${k}"><div class="bar"></div><b>${c}</b><small>${i === ci ? t.today : i === gi ? t.target : ""}</small></div>`; }).join("")}</div>
      <p class="muted" style="font-size:.85em">${t.totals(total, hours)} ${t.cefr}</p></div>
    <div class="panel"><h2>${t.startT}</h2>
      ${cur ? `<p>${t.placed(fd(D.pd))}${D.pp ? " " + t.partial : ""}</p>
        <div class="secs">${(D.sc || []).map(x => `<span class="sec ${x[1] >= 5 ? "ok" : ""}">${x[0]} · ${x[1]}/8 <span style="font-weight:600">${x[1] >= 5 ? t.passed : t.notPassed}</span></span>`).join("")}</div>` : `<p>${t.pending}</p>`}</div>
    <div class="panel"><h2>${t.routeT}</h2><p class="sub">${t.routeS}</p>
      <div class="route">${phases.map((p, i) => `<div class="ph"><div class="dot"><span>${i + 1}</span><i></i></div><div class="body">
        <span class="when">${t.monthsR(p.a, p.b)}</span><h3>${p.t}</h3><p>${p.d}</p>
        <div class="chips">${p.ls.map(l => `<span class="chip ${l[2] ? "ok" : ""}">${t.lesson} ${esc(l[0])} · ${esc(l[1])}${l[2] ? " · " + t.passedL : ""}</span>`).join("")}${i === 2 || !p.ls.length ? `<span class="chip">${t.extra}</span>` : ""}${i === 2 ? `<span class="chip ms">${t.finalTest}</span>` : ""}</div>
      </div></div>`).join("")}</div></div>
    <div class="panel"><h2>${t.howT}</h2><div class="cards">${t.how.map(h => `<div class="card"><span class="ico">${svg(h[0])}</span><div><b>${h[1]}</b><p>${esc(h[2](D.f, D.mn, (D.it || []).join(", ")))}</p></div></div>`).join("")}</div></div>
    <div class="panel"><h2>${t.measureT}</h2><div class="cards">${t.measure.map(h => `<div class="card"><span class="ico">${svg(h[0])}</span><div><b>${h[1]}</b><p>${h[2]}</p></div></div>`).join("")}</div></div>
    <div class="panel"><h2>${t.commitT}</h2><div class="commit">${t.who.map((w, i) => `<div class="col"><div class="hd"><span class="ico">${svg(w[0])}</span>${w[1]}</div>
      <ul>${t.commits(D.f)[i].map(x => `<li>${svg("check")}<span>${x}</span></li>`).join("")}</ul></div>`).join("")}</div></div>
    ${D.c ? `<div class="panel"><h2>${t.commentT}</h2><div class="comment">${esc(D.c)}</div></div>` : ""}
    <div class="panel"><div class="sign"><div class="line"><b>${esc(G.maestroNombre || G.maestro)}</b><span>${t.role}</span></div>
      <span class="muted" style="font-size:.88em">${t.gen} ${new Date(D.g).toLocaleDateString(loc, { year: "numeric", month: "long", day: "numeric" })}</span></div></div>
    <p class="foot">${t.made}</p>`;
  app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  document.getElementById("pr").onclick = () => window.print();
}
G.ready.then(render);
</script>
</body>
</html>
