    <div class="panel"><h2>${t.topicsT}</h2><p class="sub">${t.topicsS}</p>
      <div class="cards">${tops.map(k => { const x = TOPICS[k][lang]; return `<div class="card"><span class="ico">${svg(TOPICS[k].i)}</span><div style="display:grid;gap:8px"><div><b>${x[0]}</b><p>${x[1]}</p></div>
        <div class="chips">${ex(k).map(e => `<span class="chip">${esc(e)}</span>`).join("")}</div>
        <p class="muted" style="font-size:.84em"><b style="display:inline;color:var(--ink-2)">${t.practice}:</b> ${x[3]}</p></div></div>`; }).join("")}</div></div>
    ${ls.length ? `<div class="panel"><h2>${t.lessonsT}</h2><p class="sub">${t.lessonsS}</p>
      <div class="chips">${ls.map(l => `<span class="chip ${l[2] ? "ok" : ""}">${t.lesson} ${esc(l[0])} · ${esc(l[1])}${l[2] ? " · " + t.passedL : ""}</span>`).join("")}<span class="chip">${t.more}</span></div></div>` : ""}
    <div class="panel"><h2>${t.howT}</h2><div class="cards">${t.how.map(h => `<div class="card"><span class="ico">${svg(h[0])}</span><div><b>${h[1]}</b><p>${esc(h[2](D.f, D.mn, it))}</p></div></div>`).join("")}</div></div>
    <div class="panel"><h2>${t.measureT}</h2><div class="cards">${t.measure.map(h => `<div class="card"><span class="ico">${svg(h[0])}</span><div><b>${h[1]}</b><p>${h[2]}</p></div></div>`).join("")}</div></div>
    <div class="panel"><h2>${t.commitT}</h2><div class="commit">${t.who.map((w, i) => `<div class="col"><div class="hd"><span class="ico">${svg(w[0])}</span>${w[1]}</div>
      <ul>${t.commits(D.f)[i].map(x => `<li>${svg("check")}<span>${x}</span></li>`).join("")}</ul></div>`).join("")}</div></div>
    ${D.c ? `<div class="panel"><h2>${t.commentT}</h2><div class="comment">${esc(D.c)}</div></div>` : ""}
    <div class="panel"><div class="sign"><div class="line"><b>${esc(G.maestroNombre || G.maestro)}</b><span>${t.role}</span></div>
      <span class="muted" style="font-size:.88em">${t.gen} ${new Date(D.g).toLocaleDateString(loc, { year: "numeric", month: "long", day: "numeric" })}</span></div></div>
    <p class="foot">${t.made}</p>`;
  app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  document.getElementById("pr").onclick = () => window.print();
}
G.ready.then(render);
</script>
</body>
</html>
