    missing: "Este enlace no tiene los datos del plan.", days: ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"], and: "y", at: "a las", sched: "Horario" },
  en: { eyebrow: "English learning plan", teacher: "Instructor", start: "Start", print: "Print or save as PDF",
    kStart: "Start date", kCls: "Classes per week", kLen: "Minutes per class", kPr: "Practice days per week",
    startT: "Starting point", placed: (d, l, n) => `In the placement test on ${d} he placed at <b>${l} · ${n}</b>. It is our reference to choose where to begin and to see his progress later on.`,
    partial: "The test is still in progress; the result may change after the remaining sections.",
    pending: "The placement test is taken in the first class and tells us where to begin.", passed: "passed", notPassed: "to strengthen",
    topicsT: "What we will work on", topicsS: "We move at his pace. Every class combines these topics based on what he needs at that moment.", ex: "For example", practice: "How he practices",
    vocabEx: it => it ? it.split(", ") : ["school", "sports", "video games", "music"],
    lessonsT: "Platform lessons", lessonsS: "Each lesson combines vocabulary, verbs, conversation and a final quiz with a diploma.", lesson: "Lesson", passedL: "passed", more: "and new lessons as he progresses",
    howT: "How we work", how: [["users", "Live one-to-one classes", (f, m) => `${f} classes a week, ${m} minutes each, focused on speaking from day one.`],
      ["phone", "Practice between classes", () => "Lingua, his personal platform: vocabulary with audio, exercises, pronunciation with the microphone and mistake review. Goal: 4 days a week."],
      ["task", "Homework after every class", () => "Short activities to reinforce each class. He hands them in on the platform and they are recorded."],
      ["star", "Tailored material", (f, m, it) => it ? `Lessons are built around what he likes (${it}) so he learns with topics he cares about.` : "Lessons are built around his interests so he learns with topics that motivate him."]],
    measureT: "How we measure progress", measure: [["chart", "Monthly report", "Every month the family gets a report with attendance, practice days, lessons passed and class notes."],
      ["award", "Quizzes and diplomas", "Each lesson ends with a 20-question quiz. With 80% or more he earns that lesson’s diploma."],
      ["target", "Placement test", "He retakes it from time to time to compare with his starting point."],
      ["cal", "Attendance and notes", "Every class is recorded with what we covered and the new vocabulary."]],
    commentT: "A note from the instructor", role: "English instructor", gen: "Plan generated on", made: "Lingua · English learning platform.",
    missing: "This link has no plan data.", days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"], and: "and", at: "at", sched: "Schedule" }
};
const LV = { es: { A1: "Principiante", A2: "Elemental", B1: "Intermedio", B2: "Intermedio alto" }, en: { A1: "Beginner", A2: "Elementary", B1: "Intermediate", B2: "Upper intermediate" } };
function decode(s) { try { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); } catch (e) { return null; } }
const D = decode(qp.get("d") || "");
const TCOL = { pron: "#2346d0", verbs: "#6d3fd6", phr: "#be123c", vocab: "#0f766e", conv: "#b45309", listen: "#15803d" };
function lessonOf(l) {
  const all = (G.modulos || []).flatMap(m => m.lecciones);
  const f = all.find(x => x.id === l[0]);
  return f ? { ...f, titulo: l[1] || f.titulo } : { id: l[0], titulo: l[1], color: "#2346d0", icono: "chat", nivel: "" };
}
function render() {
  const t = T[lang], loc = lang === "es" ? "es-MX" : "en-US";
  document.documentElement.lang = lang;
  if (!D) { app.innerHTML = `<div class="panel"><p>${t.missing}</p></div>`; return; }
  const fd = (d, o) => new Date(d + "T12:00").toLocaleDateString(loc, o || { year: "numeric", month: "long", day: "numeric" });
  const cur = D.lv && LV.en[D.lv] ? D.lv : null, it = (D.it || []).join(", ");
  const list = (arr) => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " " + t.and + " " + arr[arr.length - 1];
  const sched = (D.dy || []).length ? `${list(D.dy.map(d => t.days[d]))}${D.tm ? ` ${t.at} ${new Date("2000-01-01T" + D.tm).toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" })}` : ""}` : "";
  const tops = (D.tp && D.tp.length ? D.tp : Object.keys(TOPICS)).filter(k => TOPICS[k]);
  const ex = k => k === "verbs" ? VERBS[lang][cur || "A1"] : k === "vocab" ? t.vocabEx(it) : TOPICS[k][lang][2];
  const ls = D.ls || [], name = (D.n || "").trim();
  const helmet = D.av && D.av.style !== "initial" && G.avatar ? G.avatar.svg(D.av, 118, { label: name }) : `<span class="ini">${esc((name[0] || "?").toUpperCase())}</span>`;
  const secs = D.sc || [], passedN = secs.filter(x => x[1] >= 5).length;
  const st = fd(D.st, { month: "short", day: "numeric" }).replace(".", "");
  let n = 0; const sh = (title) => `<div class="sh"><span class="n">${String(++n).padStart(2, "0")}</span><h2>${title}</h2></div>`;
  app.innerHTML = `
    <section class="cover">
      <div class="ctop"><span class="brand">${G.mark(30)}lingua</span>
        <div class="tools noprint"><div class="lang"><button data-lang="es" class="${lang === "es" ? "on" : ""}">ES</button><button data-lang="en" class="${lang === "en" ? "on" : ""}">EN</button></div>
          <button class="pbtn" id="pr">${t.print}</button></div></div>
      <div class="cmain">
        <div><span class="kick">${t.eyebrow}</span><h1>${esc(name)}</h1>
          <p class="who">${t.teacher}: <b>${esc(G.maestroNombre || G.maestro)}</b>${sched ? `<br>${t.sched}: ${esc(sched)}` : ""}</p></div>
        <div class="helmet">${helmet}</div>
      </div>
      <div class="stats">
        <div class="stat"><span class="v">${esc(st)}</span><span class="l">${t.kStart}</span></div>
        <div class="stat"><span class="v">${D.f}<small>×</small></span><span class="l">${t.kCls}</span></div>
        <div class="stat"><span class="v">${D.mn}<small>min</small></span><span class="l">${t.kLen}</span></div>
        <div class="stat"><span class="v">4<small>${lang === "es" ? "días" : "days"}</small></span><span class="l">${t.kPr}</span></div>
      </div>
    </section>

    <section class="panel">${sh(t.startT)}
      ${cur ? `<div class="start">
        <div class="lvl" style="--p:${secs.length ? Math.round(passedN / 4 * 100) : 25}%"><div><b>${cur}</b><span>${LV[lang][cur]}</span></div></div>
        <div style="display:grid;gap:16px"><p>${t.placed(fd(D.pd), cur, LV[lang][cur])}${D.pp ? " " + t.partial : ""}</p>
          ${secs.length ? `<div class="bars">${secs.map(x => `<div class="brow"><b>${x[0]}</b><div class="lights ${x[1] >= 5 ? "" : "dev"}">${Array.from({ length: 8 }, (_, i) => `<i class="${i < x[1] ? "on" : ""}"></i>`).join("")}</div>
            <span class="tag ${x[1] >= 5 ? "" : "dev"}">${x[1]}/8 · ${x[1] >= 5 ? t.passed : t.notPassed}</span></div>`).join("")}</div>` : ""}</div>
      </div>` : `<div class="start"><div class="lvl" style="--p:0%"><div><b>?</b><span>${lang === "es" ? "Por definir" : "To be set"}</span></div></div><p>${t.pending}</p></div>`}
    </section>

    <section class="panel">${sh(t.topicsT)}<p class="sub">${t.topicsS}</p>
      <div class="topics">${tops.map((k, i) => { const x = TOPICS[k][lang]; return `<div class="topic" style="--c:${TCOL[k]}"><span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="ti">${svg(TOPICS[k].i)}</span><h3>${x[0]}</h3><p>${x[1]}</p>
        <div class="chips">${ex(k).map(e => `<span class="tchip">${esc(e)}</span>`).join("")}</div>
        <p class="how"><b>${t.practice}:</b> ${x[3]}</p></div>`; }).join("")}</div>
    </section>

    ${ls.length ? `<section class="panel">${sh(t.lessonsT)}<p class="sub">${t.lessonsS}</p>
      <div class="lessons">${ls.map(l => `<div class="lt ${l[2] ? "ok" : ""}">${G.thumb(lessonOf(l), lang === "es" ? "LECCIÓN" : "LESSON")}${l[2] ? `<span class="done">${svg("check")}${t.passedL}</span>` : ""}</div>`).join("")}
        <div class="lmore">${t.more}</div></div>
    </section>` : ""}

    <section class="band">${sh(t.howT)}
      <div class="how4">${t.how.map(h => `<div class="hw"><span class="ti">${svg(h[0])}</span><b>${h[1]}</b><p>${esc(h[2](D.f, D.mn, it))}</p></div>`).join("")}</div>
    </section>

    <section class="panel">${sh(t.measureT)}
      <div class="steps">${t.measure.map(h => `<div class="step"><span class="ti">${svg(h[0])}</span><b>${h[1]}</b><p>${h[2]}</p></div>`).join("")}</div>
    </section>

    ${D.c ? `<section class="quote"><p>${esc(D.c)}</p><small>— ${esc(G.maestroNombre || G.maestro)}</small></section>` : ""}

    <section class="sign"><div class="line"><b>${esc(G.maestroNombre || G.maestro)}</b><span>${t.role}</span></div>
      <div class="meta"><span class="brand">${G.mark(22)}lingua</span><span>${t.gen} ${new Date(D.g).toLocaleDateString(loc, { year: "numeric", month: "long", day: "numeric" })}</span></div></section>`;
  app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  document.getElementById("pr").onclick = () => window.print();
}
G.ready.then(render);
</script>
</body>
</html>
