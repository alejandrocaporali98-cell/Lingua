  const sched = (D.dy || []).length ? `${list(D.dy.map(d => t.days[d]))}${D.tm ? ` ${t.at} ${new Date("2000-01-01T" + D.tm).toLocaleTimeString(loc, { hour: "numeric", minute: "2-digit" })}` : ""}` : "";
  const tops = (D.tp && D.tp.length ? D.tp : Object.keys(TOPICS)).filter(k => TOPICS[k]);
  const ex = k => k === "verbs" ? VERBS[lang][cur || "A1"] : k === "vocab" ? t.vocabEx(it) : TOPICS[k][lang][2];
  const ls = D.ls || [], name = (D.n || "").trim(), es = lang === "es";
  const helmet = D.av && D.av.style !== "initial" && G.avatar ? G.avatar.svg(D.av, 84, { label: name, kind: D.ak || "helmet" }) : `<span class="ini">${esc((name[0] || "?").toUpperCase())}</span>`;
  const secs = D.sc || [], passedN = secs.filter(x => x[1] >= 5).length, teacher = esc(G.maestroNombre || G.maestro);
  app.innerHTML = `<article class="doc">
    <header class="head"><span class="brand">${G.mark(24)}lingua</span>
      <div class="tools noprint"><div class="lang"><button data-lang="es" class="${es ? "on" : ""}">ES</button><button data-lang="en" class="${es ? "" : "on"}">EN</button></div>
        <button class="pbtn" id="pr">${t.print}</button></div></header>
    <div class="body">
      <div class="title">
        <div><span class="kick">${t.eyebrow}</span><h1>${esc(name)}</h1>
          <p class="who">${t.teacher}: ${teacher}${sched ? ` · ${t.sched}: ${esc(sched)}` : ""}</p></div>
        <div class="helmet">${helmet}</div>
      </div>
      <div class="facts">
        <div class="fact"><span>${t.kStart}</span><b>${fd(D.st)}</b></div>
        <div class="fact"><span>${t.kCls}</span><b>${D.f}</b></div>
        <div class="fact"><span>${t.kLen}</span><b>${D.mn} min</b></div>
        <div class="fact"><span>${t.kPr}</span><b>4</b></div>
      </div>

      <section class="sec"><h2>${t.startT}</h2>
        ${cur ? `<div class="start">
          <div class="lvl" style="--p:${secs.length ? Math.round(passedN / 4 * 100) : 25}%"><div><b>${cur}</b><span>${LV[lang][cur]}</span></div></div>
          <div style="display:grid;gap:14px"><p>${t.placed(fd(D.pd), cur, LV[lang][cur])}${D.pp ? " " + t.partial : ""}</p>
            ${secs.length ? `<div class="bars">${secs.map(x => `<div class="brow"><b>${x[0]}</b><div class="lights ${x[1] >= 5 ? "" : "dev"}">${Array.from({ length: 8 }, (_, i) => `<i class="${i < x[1] ? "on" : ""}"></i>`).join("")}</div>
              <span class="res ${x[1] >= 5 ? "" : "dev"}">${x[1]}/8 · ${x[1] >= 5 ? t.passed : t.notPassed}</span></div>`).join("")}</div>` : ""}</div>
        </div>` : `<p>${t.pending}</p>`}
      </section>

      <section class="sec"><h2>${t.topicsT}</h2><p class="lead">${t.topicsS}</p>
        <div class="list2">${tops.map(k => { const x = TOPICS[k][lang]; return `<div class="item" style="--c:${TCOL[k]}">${svg(TOPICS[k].i)}<div>
          <b>${x[0]}</b><p>${x[1]}</p>
          <p class="ex"><em>${t.ex}:</em> ${ex(k).map(esc).join(", ")}.</p>
          <p class="ex"><em>${t.practice}:</em> ${x[3]}</p></div></div>`; }).join("")}</div>
      </section>

      ${ls.length ? `<section class="sec"><h2>${t.lessonsT}</h2><p class="lead">${t.lessonsS}</p>
        <div class="lessons">${ls.map(l => `<div class="lt ${l[2] ? "ok" : ""}">${G.thumb(lessonOf(l), es ? "LECCIÓN" : "LESSON")}${l[2] ? `<span class="done">${svg("check")}${t.passedL}</span>` : ""}</div>`).join("")}</div>
        <p class="more">${t.more.charAt(0).toUpperCase() + t.more.slice(1)}.</p>
      </section>` : ""}

      <section class="sec"><h2>${t.howT}</h2>
        <div class="list2">${t.how.map(h => `<div class="item">${svg(h[0])}<div><b>${h[1]}</b><p>${esc(h[2](D.f, D.mn, it))}</p></div></div>`).join("")}</div>
      </section>

      <section class="sec"><h2>${t.measureT}</h2>
        <div class="rows">${t.measure.map(h => `<div class="row"><b>${h[1]}</b><p>${h[2]}</p></div>`).join("")}</div>
      </section>

      ${D.c ? `<section class="sec letter"><h2>${t.commentT}</h2><p>${esc(D.c)}</p></section>` : ""}

      <div class="sign"><div class="line"><b>${teacher}</b><span>${t.role}</span></div>
        <span class="date">${t.gen} ${new Date(D.g).toLocaleDateString(loc, { year: "numeric", month: "long", day: "numeric" })}</span></div>
    </div>
  </article>`;
  app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
  document.getElementById("pr").onclick = () => window.print();
}
G.ready.then(render);
</script>
</body>
</html>
