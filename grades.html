<style>
  .wrap { max-width: 1000px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 20px; }
  .wrap > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 26px; display: grid; gap: 16px; }
  @media (max-width: 560px) { .panel { padding: 18px; } }
  .panel h2 { font-size: 1.15em; font-weight: 800; }
  .page-head h1 { font-size: 2em; font-weight: 800; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { padding: 16px 18px; display: grid; gap: 2px; }
  .kpi .v { font-size: 1.8em; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .82em; color: var(--mute); font-weight: 600; }
  .hrow { display: grid; grid-template-columns: minmax(130px, 220px) minmax(0, 1fr) 70px; gap: 14px; align-items: center; }
  @media (max-width: 600px) { .hrow { grid-template-columns: minmax(0, 1fr) 60px; } .hrow .track { grid-column: 1 / -1; grid-row: 2; } }
  .hrow .nm { font-weight: 700; font-size: .92em; min-width: 0; }
  .hrow .nm small { display: block; color: var(--mute); font-weight: 600; font-size: .85em; }
  .track { position: relative; height: 16px; border-radius: 4px; background: var(--bg); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 3px; }
  .track .last { position: absolute; top: -4px; bottom: -4px; width: 3px; border-radius: 2px; background: var(--ink); }
  .track .pass { position: absolute; top: -4px; bottom: -4px; left: 80%; width: 2px; background: var(--ink); opacity: .35; }
  .hrow .val { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82em; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92em; min-width: 620px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: .74em; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  td.r, th.r { text-align: right; }
  .st { font-size: .75em; font-weight: 800; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .st.good { background: var(--ok-soft); color: var(--ok-ink); }
  .st.dev { background: var(--dev-soft); color: var(--dev); }
  .st.bad { background: var(--bad-soft); color: var(--bad-ink); }
  .st.none { background: var(--bg); color: var(--mute); }
  .lname { display: flex; align-items: center; gap: 12px; }
  .lname .thumb { width: 74px; flex: 0 0 auto; border-radius: 6px; }
  .lname .thumb .tt, .lname .thumb .lv, .lname .thumb .lno { display: none; }
  details { border-top: 1px solid var(--line); padding-top: 12px; }
  details summary { cursor: pointer; font-weight: 700; font-size: .92em; }
  .hist { display: grid; gap: 6px; margin-top: 10px; }
  .hist div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--bg); font-size: .9em; align-items: center; }
  .empty { text-align: center; padding: 26px; color: var(--mute); }
</style>
</head>
<body>
<header class="nav gutter">
  <div class="container nav-in">
    <a class="logo" href="index.html" id="logo"></a>
    <nav class="nav-links"><a href="index.html">My learning</a><a class="on" href="grades.html">Grades</a><a href="diplomas.html">Diplomas</a></nav>
    <span class="spacer"></span>
    <a class="avatar" data-avatar href="perfil.html" aria-label="Your profile"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="6.5" r="3.2"/><path d="M2.8 16c.9-3 3.4-4.6 6.2-4.6s5.3 1.6 6.2 4.6" stroke-linecap="round"/></svg></a>
  </div>
</header>
<main class="gutter"><div class="wrap" id="app"></div></main>
<script>
const G = window.LINGUA;
document.getElementById("logo").innerHTML = G.logo;
const lessons = G.modulos.flatMap(m => m.lecciones);
const pct = s => Math.round(s.ok / s.n * 100);
const status = p => p == null ? ["none", "Not started"] : p >= 80 ? ["good", "Passed"] : p >= 50 ? ["dev", "Keep practicing"] : ["bad", "Needs review"];
const COL = { good: "var(--ok)", dev: "var(--dev)", bad: "var(--bad)", none: "transparent" };
const fmt = d => d ? new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "Earlier";

function data() {
  return lessons.map(l => {
    let tries = G.store.get("attempts." + l.id, []);
    const last = G.store.get("score." + l.id, null);
    if (!tries.length && last) tries = [last]; // results saved before history existed
    const best = tries.length ? tries.reduce((a, b) => (b.ok / b.n > a.ok / a.n ? b : a)) : null;
    return { l, tries, last: tries[tries.length - 1] || null, best, done: G.store.get("done." + l.id, []).length, ready: l.estado === "lista" };
  });
}
function render() {
  const rows = data(), ready = rows.filter(r => r.ready), withScore = ready.filter(r => r.best);
  const avg = withScore.length ? Math.round(withScore.reduce((a, r) => a + pct(r.best), 0) / withScore.length) : null;
  const passed = withScore.filter(r => pct(r.best) >= 80).length;
  const attempts = ready.reduce((a, r) => a + r.tries.length, 0);
  const bestEver = withScore.length ? Math.max(...withScore.map(r => pct(r.best))) : null;
  const pl = G.store.get("placement", null);

  document.getElementById("app").innerHTML = `
  <div class="page-head" style="display:grid;gap:4px"><span class="eyebrow">Progress</span><h1>Grades</h1>
    <p class="muted">Your final quiz results for every lesson. You pass a lesson with 80% or more, and that unlocks its diploma.</p></div>
  <div class="kpis">
    <div class="card kpi"><span class="v">${avg == null ? "—" : avg + "%"}</span><span class="l">Average (best scores)</span></div>
    <div class="card kpi"><span class="v">${passed}<span class="muted" style="font-size:.55em"> / ${ready.length}</span></span><span class="l">Lessons passed</span></div>
    <div class="card kpi"><span class="v">${bestEver == null ? "—" : bestEver + "%"}</span><span class="l">Best score</span></div>
    <div class="card kpi"><span class="v">${attempts}</span><span class="l">Quiz attempts</span></div>
  </div>

  <div class="panel">
    <div><h2>Best score by lesson</h2><p class="muted" style="font-size:.88em">The line marks the pass score (80%). The dark tick is your last attempt.</p></div>
    <div style="display:grid;gap:12px">${ready.map(r => {
      const b = r.best ? pct(r.best) : null, s = status(b), lp = r.last ? pct(r.last) : null;
      return `<div class="hrow"><div class="nm">Lesson ${r.l.id} · ${r.l.titulo}<small>${r.tries.length} attempt${r.tries.length === 1 ? "" : "s"}</small></div>
        <div class="track" role="img" aria-label="Best ${b == null ? "none" : b + "%"}${lp != null ? ", last " + lp + "%" : ""}"><span class="fill" style="width:${b || 0}%;background:${COL[s[0]]}"></span><span class="pass"></span>${lp != null && r.tries.length > 1 ? `<span class="last" style="left:calc(${lp}% - 1px)"></span>` : ""}</div>
        <div class="val">${b == null ? "—" : b + "%"}</div></div>`;
    }).join("")}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>Passed · 80% or more</span><span><i style="background:var(--dev)"></i>Keep practicing · 50–79%</span><span><i style="background:var(--bad)"></i>Needs review · under 50%</span></div>
  </div>

  <div class="panel">
    <h2>All lessons</h2>
    <div class="tbl"><table>
      <thead><tr><th>Lesson</th><th>Sections</th><th class="r">Attempts</th><th class="r">Last</th><th class="r">Best</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r => {
        const b = r.best ? pct(r.best) : null, s = r.ready ? status(b) : ["none", "Coming soon"];
        return `<tr style="${r.ready ? "" : "color:var(--mute)"}">
          <td><div class="lname">${G.thumb(r.l)}<span><b>${r.l.titulo}</b><br><span class="muted" style="font-size:.85em">Lesson ${r.l.id} · ${r.l.nivel}</span></span></div></td>
          <td class="num">${r.ready ? r.done + " / " + (r.l && r.l.secs || 5) : "—"}</td>
          <td class="r num">${r.ready ? r.tries.length : "—"}</td>
          <td class="r num">${r.last ? r.last.ok + "/" + r.last.n : "—"}</td>
          <td class="r num"><b>${b == null ? "—" : b + "%"}</b></td>
          <td><span class="st ${s[0]}">${s[1]}</span>${b != null && b >= 80 ? ` <a href="diplomas.html#d${r.l.id}" style="font-size:.82em;font-weight:700;margin-left:6px">Diploma</a>` : ""}</td></tr>`;
      }).join("")}</tbody>
    </table></div>
    ${ready.some(r => r.tries.length) ? ready.filter(r => r.tries.length).map(r => `
      <details><summary>Attempt history · Lesson ${r.l.id} · ${r.l.titulo}</summary>
        <div class="hist">${[...r.tries].reverse().map((t, i) => `<div><span>${fmt(t.at)}${i === 0 ? ' <span class="muted">· latest</span>' : ""}</span><span class="num muted">${t.ok}/${t.n}</span><b class="num">${pct(t)}%</b></div>`).join("")}</div>
      </details>`).join("") : `<div class="empty">No quiz results yet. Finish a lesson’s final quiz to see your grade here.</div>`}
  </div>

  <div class="panel" style="grid-template-columns:minmax(0,1fr) auto;align-items:center">
    <div><h2>Placement test</h2><p class="muted" style="font-size:.9em">${pl ? `Level <b style="color:var(--ink)">${pl.nivel}</b> · taken ${fmt(pl.fecha + "T12:00")}` : "Not taken yet."}</p></div>
    <a class="btn" href="${pl ? "reporte.html" : "examen.html"}">${pl ? "View report" : "Take the test"}</a>
  </div>`;
}
G.ready.then(render);
</script>
</body>
</html>
