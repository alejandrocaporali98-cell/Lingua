<main class="gutter" id="wait" style="padding-block:60px;text-align:center;color:var(--mute)">Loading the lesson…</main>
<script>
// Lessons made in the lesson builder: load the content, then start the normal lesson player
(function () {
  const G = window.LINGUA, id = new URLSearchParams(location.search).get("id") || "";
  G.ready.then(async () => {
    let C = /^[0-9]{2,3}$/.test(id) ? await G.lessonData(id) : null;
    if (!C && G.isTeacher && G.lessons) { try { const r = (await G.lessons.all()).find(x => x.id === id); if (r) C = { ...r.data, id }; } catch (e) {} }
    if (!C) { document.getElementById("wait").innerHTML = `<h1 style="color:var(--ink)">Lesson not found</h1><p>This lesson isn’t published yet.</p><p><a href="../index.html">Back to My learning</a></p>`; return; }
    window.CLASE = { ...C, id };
    document.title = "Lesson " + id + " · " + (C.titulo || "");
    const s = document.createElement("script"); s.src = "../assets/leccion.js"; document.body.appendChild(s);
  });
})();
</script>
