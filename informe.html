<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink: #111; --mute: #6b6b6b; --line: #e3e3e3; --blue: #2233e6; --amber: #c98a00; --black: #0d0d0d; --good: #0f7a4a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #e9e9ec; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { max-width: 816px; margin: 18px auto 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 12px; }
  .bar button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 8px; border: 1px solid #c9c9cf; background: #fff; cursor: pointer; min-height: 44px; color: var(--ink); }
  .bar button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .lang { display: inline-flex; border: 1px solid #c9c9cf; border-radius: 8px; overflow: hidden; margin-right: auto; }
  .lang button { border: 0; border-radius: 0; min-height: 42px; padding: 8px 14px; }
  .lang button.on { background: var(--black); color: #fff; }
  .sheet { width: 816px; margin: 12px auto 30px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.12); }
  header.big { background: var(--black); color: #fff; padding: 46px 60px 42px; display: flex; justify-content: space-between; gap: 24px; }
  header.big h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
  .kick { font-size: 10.5px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #8f9bff; margin-top: 12px; }
  header.big .r { text-align: right; display: grid; gap: 8px; align-content: start; }
  header.big .date { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lbl { font-size: 9.5px; letter-spacing: 2.5px; text-transform: uppercase; color: #9a9a9a; }
  main { padding: 30px 60px 10px; display: grid; gap: 26px; }
  .intro h2 { font-size: 16px; font-weight: 700; } .intro p { font-size: 11.5px; color: #444; line-height: 1.65; margin-top: 6px; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--line); padding: 14px 0; }
  .facts > div { display: grid; gap: 6px; align-content: start; } .facts b { font-size: 22px; letter-spacing: -.3px; font-variant-numeric: tabular-nums; } .facts b.lv { color: var(--blue); }
  .facts span:last-child { font-size: 10.5px; color: #555; }
  .lab { font-size: 9.5px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mute); }
  .sec { display: grid; gap: 2px; align-content: start; break-inside: avoid; }
  .sh { display: flex; align-items: center; gap: 10px; font-size: 11.5px; font-weight: 800; letter-spacing: 3.5px; text-transform: uppercase; margin-bottom: 6px; }
  .sh .n { color: var(--blue); } .sh::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .row { display: grid; gap: 14px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 11.5px; }
  .row .m { color: #555; line-height: 1.5; }
  .head { padding-top: 0; } .head .lab { font-size: 8.5px; }
  .r-sk { grid-template-columns: 170px 1fr auto; }
  .r-ls { grid-template-columns: minmax(0, 1fr) 120px 62px 90px 96px; align-items: center; }
  .r-cl { grid-template-columns: 62px minmax(0, 1fr); }
  .r-hw { grid-template-columns: minmax(0, 1fr) 70px 100px 44px; }
  .r-rx { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .t { font-variant-numeric: tabular-nums; color: var(--blue); font-weight: 700; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .tag { font-size: 8.5px; letter-spacing: 1.6px; color: #9a9a9a; text-transform: uppercase; white-space: nowrap; font-weight: 700; }
  .tag.b { color: var(--blue); } .tag.g { color: var(--good); } .tag.a { color: var(--amber); }
  .mbar { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; color: #555; }
  .mbar i { display: inline-block; width: 64px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; } .mbar i b { display: block; height: 100%; background: var(--blue); }
  .up { color: var(--good); font-weight: 700; }
  .cl-d { font-variant-numeric: tabular-nums; font-weight: 700; } .cl-d small { display: block; font-weight: 400; color: #9a9a9a; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; margin-top: 3px; }
  .cl-b b { font-size: 12px; } .cl-b .m { display: block; margin-top: 3px; } .cl-b .w { display: block; margin-top: 4px; font-size: 10.5px; color: var(--blue); }
  .ans { font-weight: 700; color: var(--blue); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .dash { display: grid; grid-template-columns: 20px 1fr; font-size: 11.5px; line-height: 1.55; padding: 4px 0; color: #333; } .dash::before { content: "—"; color: var(--blue); font-weight: 800; }
  .dash.o::before { color: var(--amber); }
  .empty { font-size: 11.5px; color: #8a8a8a; padding: 6px 0; }
  .chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .chart .grid { stroke: var(--line); } .chart .pass { stroke: #9a9a9a; stroke-dasharray: 3 4; }
  .chart text { font-family: inherit; font-size: 10px; fill: #8a8a8a; } .chart .val { fill: var(--ink); font-weight: 700; }
  .note { font-size: 10px; color: #8a8a8a; margin-top: 4px; }
  .att { display: grid; gap: 8px; margin-top: 4px; }
  .att .r { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; font-size: 11px; }
  .att .r .m { color: #555; text-transform: capitalize; } .att .b { display: flex; height: 8px; background: #f3f3f3; border-radius: 4px; overflow: hidden; }
  .att .v { font-variant-numeric: tabular-nums; color: #555; }
  .legend { display: flex; gap: 14px; font-size: 10px; color: #777; margin-top: 4px; } .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .msg { margin: 6px 60px 6px; background: var(--black); color: #fff; border-radius: 10px; padding: 22px 24px 18px; display: grid; gap: 10px; break-inside: avoid; }
  .msg .k { font-size: 9px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  .msg p { font-size: 11.5px; line-height: 1.65; color: #e6e6e6; max-width: 600px; white-space: pre-wrap; }
  .msg small { justify-self: end; font-size: 10px; color: #9a9a9a; letter-spacing: .5px; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 60px 26px; font-size: 9.5px; color: #9a9a9a; letter-spacing: .5px; }
  footer .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  /* Summary visuals: verdict, rings, level path, practice calendar, highlights, signature */
  .verdict { display: grid; grid-template-columns: 210px 1fr; gap: 26px; align-items: center; border-left: 4px solid var(--vc, var(--blue)); padding: 4px 0 4px 20px; }
  .verdict .w { display: grid; gap: 6px; } .verdict .w b { font-size: 25px; letter-spacing: -.5px; line-height: 1.05; color: var(--vc, var(--blue)); }
  .verdict .w small { font-size: 10px; color: #8a8a8a; line-height: 1.45; }
  .verdict p { font-size: 11.5px; color: #333; line-height: 1.65; }
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--line); padding: 18px 0 16px; }
  .ring { display: grid; gap: 10px; align-content: start; }
  .ring svg { width: 76px; height: 76px; display: block; } .ring .bg { stroke: #ececf0; } .ring .fg { stroke: var(--rc, var(--blue)); }
  .ring .v { font-size: 13.5px; font-weight: 800; fill: var(--ink); font-family: inherit; letter-spacing: -.3px; } .ring .na { font-size: 14px; fill: #b5b5b5; }
  .ring .rt { display: grid; gap: 4px; } .ring .rt .lab { color: var(--ink); } .ring .rt span:last-child { font-size: 10.5px; color: #666; line-height: 1.4; }
  .path { display: grid; grid-template-columns: 1.35fr 1fr; gap: 34px; align-items: start; }
  .lvl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
  .lvl div { display: grid; gap: 6px; } .lvl i { height: 8px; background: #ececf0; } .lvl div:first-child i { border-radius: 4px 0 0 4px; } .lvl div:last-child i { border-radius: 0 4px 4px 0; }
  .lvl .past i { background: #b9bff7; } .lvl .now i { background: var(--blue); }
  .lvl b { font-size: 12px; } .lvl .now b { color: var(--blue); } .lvl small { font-size: 9px; color: #8a8a8a; line-height: 1.3; }
  .lvl .now small { color: var(--blue); font-weight: 700; }
  .course { display: grid; gap: 8px; margin-top: 6px; } .course .big { font-size: 22px; font-weight: 800; letter-spacing: -.3px; } .course .big small { font-size: 12px; font-weight: 400; color: #666; margin-left: 4px; }
  .course .trk { height: 8px; background: #ececf0; border-radius: 4px; overflow: hidden; } .course .trk i { display: block; height: 100%; background: var(--blue); }
  .course p { font-size: 10.5px; color: #666; line-height: 1.45; }
  .cal-wrap { display: grid; grid-template-columns: auto 1fr; gap: 34px; align-items: start; }
  .cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 13px); gap: 3px; margin-top: 6px; }
  .cal span { width: 13px; height: 13px; border-radius: 2px; background: #f0f0f3; } .cal span.out { background: transparent; }
  .cal span.l1 { background: #c9cdf9; } .cal span.l2 { background: #8f98f2; } .cal span.l3 { background: #4c58ec; } .cal span.l4 { background: var(--blue); }
  .cal-days { display: grid; grid-template-rows: repeat(7, 13px); gap: 3px; margin-top: 6px; font-size: 8.5px; color: #9a9a9a; line-height: 13px; }
  .cal-box { display: flex; gap: 6px; }
  .cal-leg { display: flex; align-items: center; gap: 3px; font-size: 9px; color: #8a8a8a; margin-top: 8px; } .cal-leg span { width: 10px; height: 10px; border-radius: 2px; }
  .hl3 { display: grid; gap: 14px; } .hl3 > div { border-top: 2px solid var(--ink); padding-top: 9px; display: grid; gap: 5px; }
  .hl3 .lab { color: var(--blue); } .hl3 p { font-size: 11.5px; line-height: 1.5; color: #222; }
  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 22px 60px 0; break-inside: avoid; }
  .sign > div { border-top: 1px solid var(--ink); padding-top: 8px; display: grid; gap: 3px; font-size: 11px; } .sign b { font-size: 12px; } .sign span { color: #777; font-size: 10px; letter-spacing: .5px; }
  .folio { font-variant-numeric: tabular-nums; }
  .missing { padding: 60px; font-size: 15px; line-height: 1.6; }
  body.embed .bar { display: none; } body.embed .sheet { margin: 0 auto; box-shadow: none; }
  @media screen and (max-width: 840px) {
    .sheet { width: 100%; margin: 10px 0 20px; }
    header.big { padding: 30px 22px; flex-direction: column; } header.big .r { text-align: left; }
    main { padding: 24px 22px 10px; } .msg { margin: 6px 22px; } footer { padding: 16px 22px 22px; }
    .facts { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; gap: 26px; }
    .verdict { grid-template-columns: 1fr; gap: 10px; } .rings { grid-template-columns: 1fr 1fr; gap: 18px 14px; } .ring svg { width: 64px; height: 64px; }
    .path, .cal-wrap { grid-template-columns: 1fr; gap: 24px; } .lvl small { display: none; } .sign { margin: 22px 22px 0; gap: 20px; }

    .r-sk { grid-template-columns: 1fr auto; } .r-sk .m { grid-column: 1 / -1; order: 3; }
    .r-ls { grid-template-columns: 1fr auto; gap: 6px 14px; } .r-ls.head, .r-ls .tries { display: none; } .r-ls > span:first-child { order: 1; } .r-ls .num { order: 2; } .r-ls .mbar { order: 3; } .r-ls .st { order: 4; justify-self: end; }
    .r-hw { grid-template-columns: 1fr auto; gap: 4px 14px; } .r-hw.head { display: none; } .r-hw .due { order: 3; color: #8a8a8a; } .r-hw .gr { order: 4; text-align: right; }
    .r-rx { grid-template-columns: 1fr; gap: 3px; } .r-rx.head { display: none; }
  }
  @media print {
    html, body { background: #fff; } .bar { display: none; }
    .sheet { width: auto; margin: 0; box-shadow: none; }
    @page { size: letter; margin: 12mm 0; }
    @page :first { margin-top: 0; }
  }
</style>

        ${D.hl ? `<section class="sec">${sh(N(), x.s7)}${D.hl.length ? `<div class="row r-hw head">${x.hh.map((h, i) => `<span class="lab${i === 3 ? " num" : ""}">${h}</span>`).join("")}</div>
          ${D.hl.map(h => `<div class="row r-hw"><span><b>${esc(h[0])}</b>${h[4] ? `<span class="m" style="display:block;margin-top:3px">${x.fb}${esc(h[4])}</span>` : ""}</span>
            <span class="due">${h[1] ? fds(h[1]) : "—"}</span><span class="tag ${hwSt[h[2]]}">${x.hs[h[2]]}</span><span class="num gr">${h[3] == null ? "" : h[3]}</span></div>`).join("")}` : `<p class="empty">${x.noHw}</p>`}</section>` : ""}
        ${(D.rx || []).length ? `<section class="sec">${sh(N(), x.s8)}<div class="row r-rx head"><span class="lab">${x.rh[0]}</span><span class="lab">${x.rh[1]}</span></div>
          ${D.rx.map(q => `<div class="row r-rx"><span class="m">${esc(q[0])}</span><span class="ans">${esc(q[1])}</span></div>`).join("")}</section>` : ""}
        <div class="two">
          <section class="sec">${sh(N(), x.s9)}${bars(D.wk || [], x)}<p class="note">${x.s9n}</p></section>
          <section class="sec">${sh(N(), x.s10)}${attendance(D.att, x)}</section>
        </div>
        <section class="sec">${sh(N(), x.s11)}${steps.map(s => `<div class="dash"><span>${s}</span></div>`).join("")}</section>
      </main>
      ${D.c ? `<div class="msg"><span class="k">${x.msg}</span><p>${esc(D.c)}</p><small>— ${esc(D.te || G.maestroNombre || G.maestro || "")} · ${x.sign}</small></div>` : ""}
      <div class="sign"><div><span>${x.prep}</span><b>${esc(D.te || G.maestroNombre || G.maestro || "")}</b><span>${x.sign} · Lingua</span></div>
        <div><span>${x.issued}</span><b>${fd(String(D.g || "").slice(0, 10) || D.t)}</b><span>${x.folio} ${esc(folio)}</span></div></div>
      <footer><span class="brand">${MARK(20)}Lingua</span><span>${x.foot.toUpperCase()} · ${esc(name.toUpperCase())} · ${x.gen} ${fd(String(D.g || "").slice(0, 10) || D.t)}</span></footer>
    </div>`;
    try { parent !== window && parent.postMessage({ lingua: "informe-height", h: document.documentElement.scrollHeight }, location.origin); } catch (e) {}
  }
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; draw(); });
  document.getElementById("pr").onclick = () => window.print();
  let wNarrow = innerWidth <= 600, rT = null;
  addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if ((innerWidth <= 600) !== wNarrow) { wNarrow = !wNarrow; draw(); } }, 200); });
  draw();
})();
</script>
</body>
</html>
