<html lang="es">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root { --ink: #111; --mute: #6b6b6b; --line: #e3e3e3; --blue: #2346d0; --amber: #c98a00; --black: #0b0f19; --good: #0f7a4a;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #e9e9ec; }
  body { font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .bar { max-width: 816px; margin: 18px auto 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 12px; }

  header.big { background: var(--black); color: #fff; padding: 36px 56px 32px; display: flex; justify-content: space-between; gap: 24px; }

  header.big .r { text-align: right; display: grid; gap: 8px; align-content: start; }

  .calrow { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; }

  .folio { font-variant-numeric: tabular-nums; }
  .how { font-size: 9.5px; color: #8a8a8a; margin-top: -14px; }

  .msg { border-radius: 22px; background: var(--stage); } .msg .k { color: var(--gold); }

  .blk { display: grid; gap: 10px; }

  .hd { display: grid; gap: 3px; } .hd .eb { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }

  function attendance(att, x) {

  // ── Colour palette: one per student style, so each family's report feels made for them ──

  const PAL = {

  function calendar(D, x) {

    let start = mon(start0); const last = mon(end); const weeks = Math.round((last - start) / (7 * 864e5)) + 1;
    if (weeks > 13) { start = new Date(last); start.setDate(start.getDate() - 7 * 12); }
    const key = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

            <div class="road">${(() => { const n = Math.max(2, Math.min(13, k.lessons || 0)), d = Math.min(k.done, n - 1), out = []; for (let i = 0; i < n; i++) out.push(i === n - 1 ? `<span class="flag"></span>` : i < d ? `<span class="done"></span>` : i === d ? `<span class="car">${CAR}</span>` : "<span></span>"); return out.join(""); })()}</div>
            <p>${(D.nx || [])[0] ? x.next + " " + esc(D.nx[0][0] + " · " + D.nx[0][1]) : x.courseDone}</p></div>
        </div>

        <div class="board2">

            <span class="hwd">${h[1] ? fds(h[1]) : ""}</span>${h[3] == null ? "<span></span>" : `<span class="grade">${h[3]}</span>`}</div>`).join("")}</div></section>` : ""}
        ${(D.rx || []).length ? `<section class="blk keep">${hd(x.eR, x.tR2, "var(--jam)")}<div class="rxg">${D.rx.map(q => `<div class="rx"><p>${esc(q[0]).replace(/_{2,}/, `<u>${esc(q[1])}</u>`)}</p></div>`).join("")}</div><p class="note">${x.rxN}</p></section>` : ""}
        ${(D.wk || []).filter(w => w[1]).length >= 2 || (D.att || []).length ? `<section class="blk keep">${hd(x.eP, x.tP2, "var(--whl)")}<div class="pair rh ${(D.wk || []).filter(w => w[1]).length >= 2 ? "" : "solo"}">
          ${(D.wk || []).filter(w => w[1]).length >= 2 ? `<div class="card soft">${bars(D.wk, x)}<p class="note">${x.s9n}</p></div>` : ""}
          ${(D.att || []).length ? `<div class="mt">${D.att.map(a => `<div><small>${new Date(a[0] + "-15").toLocaleDateString(x.locale, { month: "long" })}</small><b>${a[1]}</b><span>${x.attN(a[1])}${a[2] ? ` · ${t.missedN(a[2])}` : ""}</span></div>`).join("")}</div>` : ""}
          </div></section>` : ""}
        <section class="blk keep">${hd(x.eN, x.tN2, "var(--jeo)")}<div class="steps">${steps.map((st, i) => `<div><span class="sn">${i + 1}</span><p>${st}</p></div>`).join("")}</div></section>
      </main>
      ${D.c ? `<div class="msg"><span class="k">${x.msg}</span><p>${esc(D.c)}</p><small>— ${esc(D.te || G.maestroNombre || G.maestro || "")} · ${x.sign}</small></div>` : ""}
      <div class="sign"><div><span>${x.prep}</span><b>${esc(D.te || G.maestroNombre || G.maestro || "")}</b><span>${x.sign} · Lingua</span></div>
        <div><span>${x.issued}</span><b>${fd(String(D.g || "").slice(0, 10) || D.t)}</b><span>${x.folio} ${esc(folio)}</span></div></div>
      <footer><span class="brand">${MARK(20)}Lingua</span><span>${x.foot.toUpperCase()} · ${esc(name.toUpperCase())} · ${x.gen} ${fd(String(D.g || "").slice(0, 10) || D.t)}</span></footer>
    </div>`;
    try { parent !== window && parent.postMessage({ lingua: "informe-height", h: document.documentElement.scrollHeight }, location.origin); } catch (e) {}
  }
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { lang = b.dataset.l; draw(); });
  document.getElementById("pr").onclick = () => window.print();
  let wNarrow = innerWidth <= 600, rT = null;
  addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if ((innerWidth <= 600) !== wNarrow) { wNarrow = !wNarrow; draw(); } }, 200); });
  draw();
})();
</script>
