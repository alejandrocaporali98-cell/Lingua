<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases de Inglés · Reporte de avance</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  /* Family report · editorial look: paper, serif headings, hairlines and one quiet accent colour per student */
  :root { --ink: #1b1a17; --ink2: #3d3a34; --mute: #77716a; --line: #e4dfd5; --line2: #cfc8bb; --paper: #fffdf9; --bg: #ece8e0; --soft: #f6f3ed;
    --acc: #1f3a5f; --acc-soft: #e9edf2; --brass: #a8885a; --good: #2f6b4a; --amber: #a86b12; --bad: #9b2c22;
    --blue: var(--acc); --black: #1b1a17; --stage: #1b1a17; --gold: var(--brass); --jeo: var(--acc); --whl: var(--acc); --jam: var(--acc); --ttt: var(--acc); --race: var(--acc); --tile: var(--acc); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .serif, h1, h2, h3 { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 500; }
  .bar { max-width: 816px; margin: 18px auto 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 0 12px; }
  .bar button { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line2); background: var(--paper); cursor: pointer; min-height: 44px; color: var(--ink); }
  .bar button.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
  .lang { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; margin-right: auto; }
  .lang button { border: 0; border-radius: 0; min-height: 42px; padding: 8px 14px; }
  .lang button.on { background: var(--ink); color: #fff; }
  .sheet { width: 816px; margin: 12px auto 30px; background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(40,30,10,.10); }
  .eyeb, .hd .eb { font-family: "Plus Jakarta Sans", sans-serif; font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }

  /* Letterhead */
  .lh { padding: 34px 60px 0; }
  .lh-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
  .lh-top .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 800; letter-spacing: -.02em; }
  .lh-top .lh-r { font-size: 9.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
  .lh-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 26px 0 22px; border-bottom: 3px double var(--line2); }
  .lh-main h1 { font-size: 40px; line-height: 1.05; letter-spacing: -.015em; margin-top: 8px; }
  .lh-sub { margin-top: 8px; font-size: 12px; color: var(--ink2); }
  .lh-meta { display: grid; grid-auto-flow: column; gap: 28px; text-align: right; }
  .lh-meta dt { font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
  .lh-meta dd { font-family: "Fraunces", Georgia, serif; font-size: 22px; margin-top: 4px; color: var(--acc); }
  main { padding: 26px 60px 8px; display: grid; gap: 28px; }

  /* Overall assessment */
  .verdict { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 30px; align-items: start; }
  .v-word { font-family: "Fraunces", Georgia, serif; font-size: 27px; line-height: 1.1; margin-top: 8px; display: flex; align-items: baseline; gap: 9px; }
  .v-word i { width: 9px; height: 9px; border-radius: 50%; background: var(--vc, var(--acc)); flex: none; transform: translateY(-3px); }
  .v-how { font-size: 9.5px; color: var(--mute); line-height: 1.5; margin-top: 8px; }
  .v-intro { font-size: 12.5px; line-height: 1.75; color: var(--ink2); padding-left: 30px; border-left: 1px solid var(--line); }
  .v-intro b { color: var(--ink); }

  /* Key figures */
  .figs { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); }
  .figs > div { padding: 14px 4px 13px 14px; display: grid; gap: 4px; border-left: 1px solid var(--line); }
  .figs > div:first-child { border-left: 0; padding-left: 0; }
  .figs b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 28px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
  .figs span { font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }

  /* Indicators */
  .ind { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
  .in { display: grid; gap: 7px; align-content: start; }
  .in b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1; font-variant-numeric: lining-nums; }
  .in b em { font-style: normal; font-family: "Plus Jakarta Sans", sans-serif; font-size: 10.5px; font-weight: 700; color: var(--acc); margin-left: 6px; letter-spacing: .02em; vertical-align: 6px; }
  .meter { display: block; height: 3px; background: var(--line); position: relative; }
  .meter s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); text-decoration: none; }
  .in small { font-size: 10.5px; color: var(--ink2); line-height: 1.5; }

  /* Level, course and practice */
  .duo { display: grid; grid-template-columns: 1.25fr 1fr; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .duo > section { padding: 18px 0 18px; display: grid; gap: 12px; align-content: start; }
  .duo > section + section { border-left: 1px solid var(--line); padding-left: 28px; }
  .duo > section:first-child { padding-right: 28px; }
  .lvl { list-style: none; display: grid; grid-template-columns: repeat(6, 1fr); position: relative; margin-top: 4px; }
  .lvl::before { content: ""; position: absolute; left: 8.33%; right: 8.33%; top: 6px; height: 1px; background: var(--line2); }
  .lvl li { display: grid; justify-items: center; gap: 5px; text-align: center; position: relative; }
  .lvl i { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line2); }
  .lvl .past i { background: var(--acc); border-color: var(--acc); opacity: .45; }
  .lvl .now i { background: var(--acc); border-color: var(--acc); box-shadow: 0 0 0 4px var(--acc-soft); }
  .lvl b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 15px; color: var(--mute); }
  .lvl .now b { color: var(--acc); font-weight: 600; }
  .lvl small { font-size: 7.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); line-height: 1.25; max-width: 80px; }
  .lvl .now small { color: var(--ink); }
  .pn { font-size: 11px; color: var(--ink2); line-height: 1.55; }
  .course { display: grid; gap: 6px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .course b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 20px; }
  .course small { font-size: 10.5px; color: var(--ink2); }
  .calrow { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; }
  .cal-n { text-align: right; display: grid; gap: 3px; }
  .cal-n b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1; }
  .cal-n small { font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .cal-box { display: flex; gap: 6px; }
  .cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; }
  .cal span { width: 11px; height: 11px; border-radius: 2px; background: #ece8df; } .cal span.out { background: transparent; }
  .cal span.l1 { background: color-mix(in srgb, var(--acc) 28%, #fff); } .cal span.l2 { background: color-mix(in srgb, var(--acc) 52%, #fff); } .cal span.l3 { background: color-mix(in srgb, var(--acc) 76%, #fff); } .cal span.l4 { background: var(--acc); }
  .cal-days { display: grid; grid-template-rows: repeat(7, 11px); gap: 3px; font-size: 7.5px; color: var(--mute); line-height: 11px; font-weight: 700; }
  .cal-leg { display: flex; align-items: center; gap: 3px; font-size: 8.5px; color: var(--mute); margin-top: 6px; font-weight: 600; } .cal-leg span { width: 9px; height: 9px; border-radius: 2px; }

  /* Highlights */
  .hl3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .hl3 > div { border-top: 2px solid var(--acc); padding-top: 10px; display: grid; gap: 6px; align-content: start; }
  .hl3 .eb { font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
  .hl3 p { font-family: "Fraunces", Georgia, serif; font-size: 14px; line-height: 1.45; color: var(--ink); }

  /* Detail sections */
  .blk { display: grid; gap: 12px; }
  .hd { display: grid; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); break-after: avoid; }
  .hd .eb { color: var(--acc) !important; }
  .hd h3 { font-size: 21px; line-height: 1.15; letter-spacing: -.01em; }
  .qrow, .sk, .pair > *, .lc, .tli, .hwi, .rx, .steps > div, .it, .mt > div, .ci { break-inside: avoid; }
  .card { padding: 2px 0; display: grid; gap: 8px; align-content: start; }
  .card.soft { background: none; }
  .card.tint { background: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
  .pair.rh { grid-template-columns: 1.7fr 1fr; } .pair.rh.solo { grid-template-columns: 1fr; } .pair.rh.solo .mt { grid-auto-flow: column; grid-auto-columns: 1fr; }
  .chart { width: 100%; height: auto; display: block; margin-top: 4px; }
  .chart .grid { stroke: var(--line); } .chart .pass { stroke: var(--line2); stroke-dasharray: 3 4; }
  .chart text { font-family: inherit; font-size: 10px; fill: var(--mute); } .chart .val { fill: var(--ink); font-weight: 700; }
  .note { font-size: 10px; color: var(--mute); margin-top: 4px; }
  .qrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .qt { padding: 12px 12px 10px; display: grid; gap: 3px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .qt .qn { font-size: 9px; font-weight: 700; letter-spacing: .14em; color: var(--mute); } .qt b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 26px; color: var(--amber); }
  .qt.ok b { color: var(--ink); } .qt small { font-size: 10px; color: var(--mute); }
  .sk { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
  .sk > div { padding: 14px 16px 14px 0; display: grid; gap: 3px; border-bottom: 1px solid var(--line); }
  .sk > div:not(:nth-child(3n+1)) { padding-left: 16px; border-left: 1px solid var(--line); }
  .sk b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 28px; line-height: 1.05; color: var(--acc); } .sk span { font-size: 11.5px; font-weight: 700; }
  .sk small { font-size: 10px; color: var(--mute); line-height: 1.4; }
  .sk > div.zero b { color: var(--line2); } .sk > div.zero span { color: var(--mute); }
  .pair > .card > .hd { border-bottom-color: var(--line2); }
  .it { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .it span { display: grid; gap: 2px; min-width: 0; } .it b { font-size: 12px; font-weight: 700; } .it small { font-size: 10px; color: var(--mute); overflow-wrap: anywhere; }
  .it em { font-style: normal; font-family: "Fraunces", Georgia, serif; font-size: 16px; color: var(--acc); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
  .empty { font-size: 11.5px; color: var(--mute); padding: 6px 0; font-style: italic; }
  .lgrid { display: grid; grid-template-columns: 1fr; }
  .lc { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .lc .ln { font-family: "Fraunces", Georgia, serif; font-size: 20px; color: var(--acc); }
  .lc .lb { display: grid; gap: 6px; min-width: 0; } .lc .lb b { font-size: 12.5px; font-weight: 700; } .lc .lb small { font-size: 9.5px; color: var(--mute); }
  .lc .lr { display: grid; gap: 4px; justify-items: end; } .lc .lr b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 17px; font-variant-numeric: lining-nums tabular-nums; }
  .road.sm { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; max-width: 280px; } .road.sm span { height: 3px; background: var(--line); } .road.sm span.done { background: var(--acc); }
  .up { color: var(--good); }
  .chip { font-size: 8.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
  .chip.ok { color: var(--good); } .chip.warn { color: var(--amber); }
  .colp { font-size: 11.5px; color: var(--ink2); line-height: 1.6; }
  .colg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .colg .ci { display: grid; gap: 3px; align-content: start; }
  .colg .ca { background: var(--soft); border: 1px solid var(--line); padding: 12px 8px 6px; display: grid; place-items: center; min-height: 76px; color: #d9d3c7; }
  .colg .ca svg { width: 100%; height: auto; display: block; max-height: 88px; }
  .colg b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 14px; margin-top: 6px; } .colg small { font-size: 9.5px; color: var(--mute); }
  .colg .ci.off b { color: var(--line2); }
  .tl { display: grid; }
  .tli { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tli .dd { display: grid; justify-items: start; gap: 2px; }
  .tli .dd b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 24px; line-height: 1; color: var(--acc); } .tli .dd small { font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  .tli.miss .dd b { color: var(--line2); }
  .tlc { display: grid; gap: 5px; } .tlc b { font-size: 12.5px; font-weight: 700; } .tlc p { font-size: 11.5px; color: var(--ink2); line-height: 1.6; }
  .tli.miss .tlc { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .words { display: flex; flex-wrap: wrap; gap: 4px 12px; } .words i { font-size: 10.5px; color: var(--acc); font-family: "Fraunces", Georgia, serif; }
  .hwl { display: grid; }
  .hwi { display: grid; grid-template-columns: 96px minmax(0, 1fr) 60px 36px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .hwi .chip { justify-self: start; } .hwt { display: grid; gap: 2px; } .hwt b { font-size: 12px; font-weight: 700; } .hwt small { font-size: 10.5px; color: var(--mute); font-style: italic; }
  .hwd { font-size: 10.5px; color: var(--mute); text-align: right; }
  .grade { justify-self: end; font-family: "Fraunces", Georgia, serif; font-size: 20px; color: var(--acc); }
  .rxg { display: grid; grid-template-columns: 1fr 1fr; gap: 0 30px; }
  .rx { padding: 11px 0 11px 14px; border-left: 2px solid var(--acc); margin: 6px 0; }
  .rx p { font-family: "Fraunces", Georgia, serif; font-size: 14px; line-height: 1.45; } .rx u { text-decoration: none; color: var(--acc); border-bottom: 1px solid var(--acc); }
  .mt { display: grid; grid-auto-rows: 1fr; gap: 0; border-top: 1px solid var(--line); }
  .mt > div { padding: 10px 0; display: grid; gap: 2px; align-content: center; border-bottom: 1px solid var(--line); }
  .mt small { font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); } .mt b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 24px; line-height: 1.05; } .mt span { font-size: 10px; color: var(--mute); }
  .att { display: grid; gap: 8px; margin-top: 4px; }
  .att .r { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; font-size: 11px; }
  .att .r .m { color: var(--mute); text-transform: capitalize; } .att .b { display: flex; height: 6px; background: var(--line); overflow: hidden; }
  .att .v { font-variant-numeric: tabular-nums; color: var(--mute); }
  .legend { display: flex; gap: 14px; font-size: 10px; color: var(--mute); margin-top: 4px; } .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: -1px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 26px; }
  .steps > div { display: grid; gap: 8px; align-content: start; }
  .steps .sn { font-family: "Fraunces", Georgia, serif; font-size: 26px; color: var(--acc); line-height: 1; }
  .steps p { font-size: 11.5px; line-height: 1.6; color: var(--ink2); }

  /* Teacher's note, signatures, footer */
  .msg { margin: 30px 60px 6px; background: var(--soft); border-left: 3px solid var(--acc); padding: 22px 26px 18px; display: grid; gap: 10px; break-inside: avoid; }
  .msg .k { font-size: 9px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }
  .msg p { font-family: "Fraunces", Georgia, serif; font-size: 15px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; }
  .msg small { justify-self: end; font-size: 10px; color: var(--mute); letter-spacing: .04em; }
  .sign { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin: 34px 60px 0; break-inside: avoid; }
  .sign > div { border-top: 1px solid var(--ink); padding-top: 8px; display: grid; gap: 3px; font-size: 11px; } .sign b { font-family: "Fraunces", Georgia, serif; font-weight: 500; font-size: 15px; } .sign span { color: var(--mute); font-size: 9.5px; letter-spacing: .06em; }
  .folio { font-variant-numeric: tabular-nums; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 60px 0; padding: 14px 0 26px; border-top: 3px double var(--line2); font-size: 9px; color: var(--mute); letter-spacing: .12em; }
  footer .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
  .missing { padding: 60px; font-size: 15px; line-height: 1.6; }
  body.embed .bar { display: none; } body.embed .sheet { margin: 0 auto; box-shadow: none; }

  @media screen and (max-width: 840px) {
    .sheet { width: 100%; margin: 10px 0 20px; }
    .lh { padding: 24px 20px 0; } main { padding: 22px 20px 8px; gap: 26px; }
    .lh-main { flex-direction: column; align-items: flex-start; } .lh-meta { text-align: left; } .lh-main h1 { font-size: 32px; }
    .lh-top .lh-r { display: none; }
    .verdict { grid-template-columns: 1fr; gap: 12px; } .v-intro { padding-left: 0; border-left: 0; }
    .figs { grid-template-columns: repeat(3, 1fr); } .figs > div:nth-child(4) { border-left: 0; padding-left: 0; } .figs > div:nth-child(-n+3) { border-bottom: 1px solid var(--line); }
    .ind { grid-template-columns: 1fr 1fr; gap: 22px; }
    .duo { grid-template-columns: 1fr; } .duo > section:first-child { padding-right: 0; } .duo > section + section { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
    .lvl small { font-size: 6.5px; }
    .hl3, .pair, .pair.rh, .rxg { grid-template-columns: 1fr; gap: 20px; }
    .sk { grid-template-columns: 1fr 1fr; } .sk > div:not(:nth-child(3n+1)) { padding-left: 0; border-left: 0; } .sk > div:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
    .mt { grid-auto-flow: row; } .qrow { grid-template-columns: repeat(3, 1fr) !important; }
    .colg { grid-template-columns: repeat(2, 1fr); }
    .hwi { grid-template-columns: minmax(0, 1fr) auto; } .hwi .chip { grid-column: 1 / -1; } .hwd { text-align: left; }
    .msg { margin: 26px 20px 6px; } .sign { margin: 28px 20px 0; gap: 20px; } footer { margin: 20px 20px 0; flex-direction: column; align-items: flex-start; }
  }
  @media print {
    html, body { background: #fff; } .bar { display: none; }
    .sheet { width: auto; margin: 0; box-shadow: none; background: #fff; }
    main { display: block; } main > * + * { margin-top: 24px; } .blk { display: block; } .blk > * + * { margin-top: 10px; }
    .hd { break-after: avoid-page; page-break-after: avoid; } .keep { break-inside: avoid-page; page-break-inside: avoid; }
    @page { size: letter; margin: 12mm 0; }
    @page :first { margin-top: 0; }
  }
</style>
</head>

  addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if ((innerWidth <= 600) !== wNarrow) { wNarrow = !wNarrow; draw(); } }, 200); });
  draw();
})();
});
</script>
