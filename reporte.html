<style>
  .wrap { max-width: 980px; margin: 0 auto; padding-block: 28px 64px; display: grid; gap: 20px; }
  .wrap > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 26px; min-width: 0; }
  @media (max-width: 560px) { .panel { padding: 18px; } }
  .panel h2 { font-size: 1.2em; font-weight: 800; }
  .sub { color: var(--mute); font-size: .9em; margin-top: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 7px 12px; font-weight: 700; font-size: .82em; }
  .seg button.on { background: var(--inverse); color: var(--on-inverse); }

  .cert { position: relative; overflow: hidden; border-top: 4px solid var(--brand); display: grid; gap: 22px; }
  .cert::after { content: ""; position: absolute; right: -50px; top: -50px; width: 240px; height: 240px; border-radius: 50%; pointer-events: none; background-image: radial-gradient(color-mix(in srgb, var(--brand) 18%, transparent) 1.2px, transparent 1.5px); background-size: 14px 14px; }
  .cert-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px dashed var(--line-2); position: relative; z-index: 1; }
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; position: relative; z-index: 1; }
  @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
  .lvl { width: 116px; height: 116px; border-radius: 20px; background: var(--fill-brand); color: var(--on-fill); display: grid; place-items: center; font-size: 2.9em; font-weight: 800; letter-spacing: -.04em; }
  .hero h1 { font-size: 1.45em; font-weight: 800; }
  .cefr { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; position: relative; z-index: 1; }
  .cefr span { text-align: center; padding: 7px 0; border-radius: 5px; background: var(--bg); color: var(--mute); font-weight: 700; font-size: .8em; }
  .cefr span.on { background: var(--fill-brand); color: var(--on-fill); }
  .cefr span.past { background: var(--brand-soft); color: var(--brand-dark); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { padding: 16px 18px; display: grid; gap: 4px; }
  .kpi .v { font-size: 1.9em; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .82em; color: var(--mute); font-weight: 600; }

  /* Horizontal bar chart */
  .hbars { display: grid; gap: 10px; margin-top: 16px; }
  .hrow { display: grid; grid-template-columns: minmax(120px, 230px) minmax(0, 1fr) 96px; gap: 14px; align-items: center; }
  @media (max-width: 600px) { .hrow { grid-template-columns: minmax(0, 1fr) 70px; } .hrow .track { grid-column: 1 / -1; grid-row: 2; } }
  .hrow .nm { font-weight: 600; font-size: .92em; min-width: 0; }
  .hrow .nm small { display: block; color: var(--mute); font-weight: 500; font-size: .85em; }
  .track { position: relative; height: 16px; border-radius: 4px; background: var(--bg); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; min-width: 3px; }
  .track .pass { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .5; }
  .track .ticks { position: absolute; inset: 0; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: 25% 100%; border-radius: 4px; pointer-events: none; }
  .hrow .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: .92em; }
  .hrow .val small { display: block; color: var(--mute); font-weight: 600; font-size: .78em; }
  .axis { display: grid; grid-template-columns: minmax(120px, 230px) minmax(0, 1fr) 96px; gap: 14px; font-size: .75em; color: var(--mute); }
  .axis div { display: flex; justify-content: space-between; }
  @media (max-width: 600px) { .axis { display: none; } }
  .tip { position: relative; }
  .tip:hover::after, .tip:focus-visible::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); background: var(--inverse); color: var(--on-inverse); font-size: .8em; font-weight: 600; padding: 6px 10px; border-radius: 6px; white-space: nowrap; z-index: 5; pointer-events: none; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82em; color: var(--ink-2); margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .st { font-size: .72em; font-weight: 800; padding: 2px 7px; border-radius: 999px; letter-spacing: .02em; display: inline-block; }
  .st.good { background: var(--ok-soft); color: var(--ok); }
  .st.dev { background: var(--dev-soft); color: var(--dev); }
  .st.bad { background: var(--bad-soft); color: var(--bad); }

  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  .list { display: grid; gap: 10px; margin-top: 14px; }
  .item { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: var(--r-m); background: var(--bg); }
  .item .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .85em; }
  .item b { display: block; }
  .item p { color: var(--ink-2); font-size: .9em; margin-top: 2px; }
  .item .where { font-size: .8em; color: var(--mute); margin-top: 4px; font-weight: 600; }
  .plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  @media (max-width: 760px) { .plan { grid-template-columns: 1fr; } }
  .plan div { padding: 16px; border-radius: var(--r-m); border: 1px solid var(--line); display: grid; gap: 4px; align-content: start; }
  .plan .wk { font-size: .78em; font-weight: 800; color: var(--brand); letter-spacing: .06em; text-transform: uppercase; }
  .plan p { color: var(--ink-2); font-size: .9em; }

  .tbl { overflow-x: auto; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: .9em; min-width: 640px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .74em; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  td .x { color: var(--bad); text-decoration: line-through; }
  td .y { color: var(--ok); font-weight: 700; }
  .res { font-weight: 800; font-size: .8em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .res.ok { background: var(--ok-soft); color: var(--ok); }
  .res.no { background: var(--bad-soft); color: var(--bad); }
  .note { font-size: .82em; color: var(--mute); }
  .empty { text-align: center; padding: 48px 24px; display: grid; gap: 12px; justify-items: center; }
  @media print { .nav, .noprint { display: none !important; } body { background: #fff; } .panel { break-inside: avoid; } }
</style>

<script>
const G = window.LINGUA, { SEGMENTS, RADIO, PASS, AREAS, LEVELS, ALLQ } = window;
document.getElementById("logo").innerHTML = G.logo;

const T = {
  en: {
    navHome: "My learning", navTest: "Placement test",
    title: "Placement report", subtitle: "Lingua · English placement test",
    instructor: "Instructor", date: "Date",
    summary: (p, lvl, name) => `Overall accuracy of ${p}% on the written sections. Current level: ${lvl} (${name}).`,
    kAcc: "Overall accuracy", kCorrect: "Correct answers", kSections: "Sections passed", kSpeak: "Speaking score",
    secTitle: "Accuracy by section", secSub: "Each section has 8 questions. The line marks the pass score (5 of 8).",
    pass: "Passed", fail: "Below pass", notTaken: "Not taken",
    areaTitle: "Accuracy by skill area", areaSub: "Every written question is tagged with the grammar or vocabulary skill it tests.",
    strong: "Strong", developing: "Developing", focus: "Focus",
    lgStrong: "Strong · 80% or more", lgDev: "Developing · 50–79%", lgFocus: "Focus · under 50%",
    qs: n => `${n} question${n === 1 ? "" : "s"}`,
    spTitle: "Speaking", spSub: "Four questions answered out loud, scored by the teacher (0 = couldn’t, 1 = with help, 2 = good).",
    spScores: ["Couldn’t", "With help", "Good"], spNot: "Not scored",
    strTitle: "Strengths", strSub: "Skills the student already controls well.",
    focTitle: "Where to focus", focSub: "Ordered by priority: foundations first.",
    where: "Where we cover it", lessonWord: "Lesson",
    noStr: "Keep going: strengths will show up as the basics get stronger.",
    noFoc: "No weak areas in the sections taken. Next step: conversation and fluency.",
    planTitle: "Recommended plan", planSub: "What the next classes will look like.",
    plan: (f) => [
      ["Weeks 1–2", f[0] ? `Work on ${f.slice(0, 2).map(a => a.en).join(" and ")} with short drills in every class.` : "Start conversation classes with the student’s interests."],
      ["Weeks 3–6", "Lessons built around the student’s interests (F1, cars, anime, football) with speaking practice every class."],
      ["Week 8", "Retake this placement test to measure progress with the same questions."]
    ],
    revTitle: "Question review", revSub: "Every question, the student’s answer and the correct one.",
    onlyMistakes: "Only mistakes", all: "All",
    hNum: "#", hSec: "Level", hArea: "Skill", hQ: "Question", hAns: "Answer", hRes: "Result",
    ok: "Correct", no: "Wrong", skip: "I didn’t know",
    method: "How to read this report: each skill area has only 1 to 4 questions, so area results are indicators, not a final grade. The level comes from the highest section passed in a row.",
    copy: "Copy summary", copied: "Summary copied", copyFail: "Couldn’t copy", link: "Copy share link", linkDone: "Link copied", print: "Print or save as PDF",
    emptyT: "No test results yet", emptyP: "Take the placement test and the full report will appear here.", emptyB: "Take the test",
    oldT: "Detailed analysis not available for this result", oldP: "This test was saved before the detailed report existed. The section scores are below. Retake the test to see the full analysis.",
    retake: "Retake test",
    shareTxt: (d) => `Lingua · Placement report (${d.date})\nLevel: ${d.lvl} (${d.name})\nAccuracy: ${d.acc}% (${d.ok}/${d.n})\nSpeaking: ${d.sp}/8\nStrengths: ${d.str || "—"}\nFocus areas: ${d.foc || "—"}\nInstructor: ${G.maestro}`
  },
  es: {
    navHome: "Mi aprendizaje", navTest: "Examen de colocación",
    title: "Reporte de colocación", subtitle: "Lingua · Examen de colocación de inglés",
    instructor: "Instructor", date: "Fecha",
    summary: (p, lvl, name) => `Precisión general de ${p}% en las secciones escritas. Nivel actual: ${lvl} (${name}).`,
    kAcc: "Precisión general", kCorrect: "Respuestas correctas", kSections: "Secciones aprobadas", kSpeak: "Speaking",
    secTitle: "Precisión por sección", secSub: "Cada sección tiene 8 preguntas. La línea marca el mínimo para aprobar (5 de 8).",
    pass: "Aprobada", fail: "No aprobada", notTaken: "No presentada",
    areaTitle: "Precisión por área", areaSub: "Cada pregunta escrita está etiquetada con el tema de gramática o vocabulario que evalúa.",
    strong: "Dominado", developing: "En desarrollo", focus: "Prioridad",
    lgStrong: "Dominado · 80% o más", lgDev: "En desarrollo · 50–79%", lgFocus: "Prioridad · menos de 50%",
    qs: n => `${n} pregunta${n === 1 ? "" : "s"}`,
    spTitle: "Speaking (expresión oral)", spSub: "Cuatro preguntas contestadas en voz alta y calificadas por el maestro (0 = no pudo, 1 = con ayuda, 2 = bien).",
    spScores: ["No pudo", "Con ayuda", "Bien"], spNot: "Sin calificar",
    strTitle: "Fortalezas", strSub: "Lo que ya domina bien.",
    focTitle: "En qué enfocarnos", focSub: "En orden de prioridad: primero las bases.",
    where: "Dónde lo vemos", lessonWord: "Lección",
    noStr: "Vamos bien: las fortalezas aparecerán conforme se afiancen las bases.",
    noFoc: "Sin áreas débiles en las secciones presentadas. Siguiente paso: conversación y fluidez.",
    planTitle: "Plan recomendado", planSub: "Cómo serán las siguientes clases.",
    plan: (f) => [
      ["Semanas 1–2", f[0] ? `Reforzar ${f.slice(0, 2).map(a => a.es).join(" y ")} con ejercicios cortos en cada clase.` : "Arrancar con clases de conversación sobre sus intereses."],
      ["Semanas 3–6", "Lecciones con sus intereses (F1, coches, anime, fútbol) y práctica de speaking en cada clase."],
      ["Semana 8", "Repetir este examen de colocación para medir el avance con las mismas preguntas."]
    ],
    revTitle: "Revisión pregunta por pregunta", revSub: "Cada pregunta, lo que contestó y la respuesta correcta.",
    onlyMistakes: "Solo errores", all: "Todas",
    hNum: "#", hSec: "Nivel", hArea: "Área", hQ: "Pregunta", hAns: "Respuesta", hRes: "Resultado",
    ok: "Correcta", no: "Incorrecta", skip: "No lo sabía",
    method: "Cómo leer este reporte: cada área tiene de 1 a 4 preguntas, así que los resultados por área son indicadores, no una calificación final. El nivel sale de la sección más alta aprobada de forma consecutiva.",
    copy: "Copiar resumen", copied: "Resumen copiado", copyFail: "No se pudo copiar", link: "Copiar link para compartir", linkDone: "Link copiado", print: "Imprimir o guardar PDF",
    emptyT: "Aún no hay resultados", emptyP: "Haz el examen de colocación y aquí aparecerá el reporte completo.", emptyB: "Hacer examen",
    oldT: "Análisis detallado no disponible para este resultado", oldP: "Este examen se guardó antes de que existiera el reporte detallado. Abajo están los puntajes por sección. Repite el examen para ver el análisis completo.",
    retake: "Repetir examen",
    shareTxt: (d) => `Lingua · Reporte de colocación (${d.date})\nNivel: ${d.lvl} (${d.nameEs})\nPrecisión: ${d.acc}% (${d.ok}/${d.n})\nSpeaking: ${d.sp}/8\nFortalezas: ${d.str || "—"}\nEn qué enfocarnos: ${d.foc || "—"}\nInstructor: ${G.maestro}`
  }
};

// ── Data: from a shared link (?r=…) or from this browser ──
const qp = new URLSearchParams(location.search);
let lang = qp.get("lang") === "es" ? "es" : (G.store.get("reportLang", "en"));
const stored = G.store.get("placement", null);
const R = qp.get("r") || (stored && stored.r) || null;
const D = qp.get("d") || (stored && stored.fecha) || null;
const t = k => T[lang][k];
const COL = { good: "var(--ok)", dev: "var(--dev)", bad: "var(--bad)" };
const status = p => p >= 80 ? "good" : p >= 50 ? "dev" : "bad";
const stName = s => ({ good: t("strong"), dev: t("developing"), bad: t("focus") })[s];
const lvlOrder = ["A1", "A2", "B1", "B2"];

function analyze(code) {
  const [qs, sp] = code.split("-");
  const ans = [...qs].map(c => c === "x" ? null : c === "s" ? -1 : +c);
  const radio = [...(sp || "xxxx")].map(c => c === "x" ? null : +c);
  const segs = SEGMENTS.map((s, si) => {
    const items = s.qs.map(q => ({ q, a: ans[q.g] }));
    const taken = items.every(x => x.a !== null);
    return { s, si, taken, score: taken ? items.filter(x => x.a === x.q.correct).length : 0 };
  });
  let p = 0; for (const sg of segs) { if (sg.taken && sg.score >= PASS) p++; else break; }
  const takenQ = ALLQ.filter(q => ans[q.g] !== null);
  const ok = takenQ.filter(q => ans[q.g] === q.correct).length;
  const areas = {};
  takenQ.forEach(q => {
    const a = areas[q.ar] || (areas[q.ar] = { key: q.ar, ...AREAS[q.ar], n: 0, ok: 0, minLvl: 9 });
    a.n++; if (ans[q.g] === q.correct) a.ok++;
    a.minLvl = Math.min(a.minLvl, lvlOrder.indexOf(SEGMENTS.find(s => s.qs.includes(q)).lvl));
  });
  const list = Object.values(areas).map(a => ({ ...a, pct: Math.round(a.ok / a.n * 100) })).map(a => ({ ...a, st: status(a.pct) }));
  const strengths = list.filter(a => a.st === "good").sort((x, y) => y.pct - x.pct || y.n - x.n);
  const focus = list.filter(a => a.pct < 70).sort((x, y) => x.minLvl - y.minLvl || x.pct - y.pct).slice(0, 4);
  const spTotal = radio.reduce((s, v) => s + (v || 0), 0);
  return { ans, radio, segs, p, level: LEVELS[p], takenQ, ok, acc: takenQ.length ? Math.round(ok / takenQ.length * 100) : 0, list, strengths, focus, spTotal };
}

function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00").toLocaleDateString(lang === "es" ? "es-MX" : "en-US", { year: "numeric", month: "long", day: "numeric" });
}
function hrow(name, sub, pct, color, valTxt, valSub, tip, passLine) {
  return `<div class="hrow"><div class="nm">${name}${sub ? `<small>${sub}</small>` : ""}</div>
    <div class="track tip" tabindex="0" data-tip="${tip}" aria-label="${tip}"><span class="ticks"></span><span class="fill" style="width:${pct}%;background:${color}"></span>${passLine ? `<span class="pass" style="left:${passLine}%"></span>` : ""}</div>
    <div class="val">${valTxt}${valSub ? `<small>${valSub}</small>` : ""}</div></div>`;
}
const axis = () => `<div class="axis" aria-hidden="true"><span></span><div><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div><span></span></div>`;

let onlyMistakes = true;
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.getElementById("lEN").classList.toggle("on", lang === "en");
  document.getElementById("lES").classList.toggle("on", lang === "es");
  document.title = "Lingua · " + t("title");
  const app = document.getElementById("app");

  if (!R && !stored) {
    app.innerHTML = `<div class="panel empty"><h2>${t("emptyT")}</h2><p class="muted">${t("emptyP")}</p><a class="btn primary" href="examen.html">${t("emptyB")}</a></div>`;
    return;
  }
  if (!R) { // older result without per-question data
    const L0 = LEVELS.find(l => l.lvl === stored.nivel) || LEVELS[0];
    app.innerHTML = certHead(L0, null) + `<div class="panel"><h2>${t("oldT")}</h2><p class="sub">${t("oldP")}</p>
      <div class="hbars">${axis()}${SEGMENTS.map((s, i) => { const r = (stored.secciones || []).find(x => x.lvl === s.lvl);
        return r ? hrow(window.NAMES[i], s.lvl, r.score / 8 * 100, r.score >= PASS ? COL.good : COL.bad, r.score + "/8", r.score >= PASS ? t("pass") : t("fail"), `${s.lvl}: ${r.score}/8`, 62.5)
                 : hrow(window.NAMES[i], s.lvl, 0, "transparent", "—", t("notTaken"), t("notTaken"), 62.5); }).join("")}</div>
      <div class="actions" style="margin-top:18px"><a class="btn primary" href="examen.html">${t("retake")}</a></div></div>`;
    return;
  }

  const A = analyze(R), L0 = A.level;
  const passed = A.segs.filter(s => s.taken && s.score >= PASS).length, takenS = A.segs.filter(s => s.taken).length;

  app.innerHTML = certHead(L0, A) + `
  <div class="kpis">
    <div class="card kpi"><span class="v">${A.acc}%</span><span class="l">${t("kAcc")}</span></div>
    <div class="card kpi"><span class="v">${A.ok}<span class="muted" style="font-size:.55em"> / ${A.takenQ.length}</span></span><span class="l">${t("kCorrect")}</span></div>
    <div class="card kpi"><span class="v">${passed}<span class="muted" style="font-size:.55em"> / ${takenS}</span></span><span class="l">${t("kSections")}</span></div>
    <div class="card kpi"><span class="v">${A.spTotal}<span class="muted" style="font-size:.55em"> / 8</span></span><span class="l">${t("kSpeak")}</span></div>
  </div>

  <div class="panel">
    <h2>${t("secTitle")}</h2><p class="sub">${t("secSub")}</p>
    <div class="hbars">${axis()}${A.segs.map(sg => sg.taken
      ? hrow((lang === "es" ? LEVELS[sg.si].es : window.NAMES[sg.si]), sg.s.lvl, sg.score / 8 * 100, sg.score >= PASS ? COL.good : COL.bad, sg.score + "/8", sg.score >= PASS ? t("pass") : t("fail"), `${sg.s.lvl} · ${sg.score}/8 · ${Math.round(sg.score / 8 * 100)}%`, 62.5)
      : hrow((lang === "es" ? LEVELS[sg.si].es : window.NAMES[sg.si]), sg.s.lvl, 0, "transparent", "—", t("notTaken"), t("notTaken"), 62.5)).join("")}</div>
  </div>

  <div class="panel">
    <h2>${t("areaTitle")}</h2><p class="sub">${t("areaSub")}</p>
    <div class="hbars">${axis()}${[...A.list].sort((x, y) => y.pct - x.pct || x.minLvl - y.minLvl).map(a =>
      hrow(a[lang], `${t("qs")(a.n)} · <span class="st ${a.st}">${stName(a.st)}</span>`, a.pct, COL[a.st], a.pct + "%", `${a.ok}/${a.n}`, `${a[lang]}: ${a.ok}/${a.n}`)).join("")}</div>
    <div class="legend"><span><i style="background:var(--ok)"></i>${t("lgStrong")}</span><span><i style="background:var(--dev)"></i>${t("lgDev")}</span><span><i style="background:var(--bad)"></i>${t("lgFocus")}</span></div>
  </div>

  <div class="panel">
    <h2>${t("spTitle")}</h2><p class="sub">${t("spSub")}</p>
    <div class="hbars">${RADIO.map((r, i) => { const v = A.radio[i];
      return hrow(r.lvl, r.en, v == null ? 0 : v / 2 * 100, v == null ? "transparent" : v === 2 ? COL.good : v === 1 ? COL.dev : COL.bad, v == null ? "—" : v + "/2", v == null ? t("spNot") : t("spScores")[v], `${r.lvl}: ${v == null ? t("spNot") : v + "/2"}`); }).join("")}</div>
  </div>

  <div class="two">
    <div class="panel"><h2>${t("strTitle")}</h2><p class="sub">${t("strSub")}</p>
      <div class="list">${A.strengths.length ? A.strengths.slice(0, 5).map(a => `<div class="item"><span class="n" style="background:var(--ok-soft);color:var(--ok)">✓</span><div><b>${a[lang]}</b><p>${a.ok}/${a.n} · ${a.pct}%</p></div></div>`).join("") : `<p class="muted">${t("noStr")}</p>`}</div>
    </div>
    <div class="panel"><h2>${t("focTitle")}</h2><p class="sub">${t("focSub")}</p>
      <div class="list">${A.focus.length ? A.focus.map((a, i) => `<div class="item"><span class="n" style="background:var(--bad-soft);color:var(--bad)">${i + 1}</span><div><b>${a[lang]} <span class="muted" style="font-weight:600">· ${a.ok}/${a.n}</span></b><p>${lang === "es" ? a.tipEs : a.tipEn}</p><div class="where">${t("where")}: ${/^\d+$/.test(a.lesson) ? t("lessonWord") + " " + a.lesson : (lang === "es" ? ({ "Conversation": "Clases de conversación", "B1 grammar": "Gramática B1", "Every lesson": "Todas las lecciones" })[a.lesson] || a.lesson : a.lesson)}</div></div></div>`).join("") : `<p class="muted">${t("noFoc")}</p>`}</div>
    </div>
  </div>

  <div class="panel"><h2>${t("planTitle")}</h2><p class="sub">${t("planSub")}</p>
    <div class="plan">${t("plan")(A.focus).map(([w, p]) => `<div><span class="wk">${w}</span><p>${p}</p></div>`).join("")}</div>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <div><h2>${t("revTitle")}</h2><p class="sub">${t("revSub")}</p></div>
      <div class="seg noprint" role="group"><button id="fM" class="${onlyMistakes ? "on" : ""}">${t("onlyMistakes")}</button><button id="fA" class="${onlyMistakes ? "" : "on"}">${t("all")}</button></div>
    </div>
    <div class="tbl"><table>
      <thead><tr><th>${t("hNum")}</th><th>${t("hSec")}</th><th>${t("hArea")}</th><th>${t("hQ")}</th><th>${t("hAns")}</th><th>${t("hRes")}</th></tr></thead>
      <tbody>${A.takenQ.filter(q => !onlyMistakes || A.ans[q.g] !== q.correct).map(q => {
        const a = A.ans[q.g], good = a === q.correct, lv = SEGMENTS.find(s => s.qs.includes(q)).lvl;
        return `<tr><td class="num">${q.g + 1}</td><td>${lv}</td><td>${AREAS[q.ar][lang]}</td><td>${q.p}</td>
          <td>${good ? `<span class="y">${q.a}</span>` : `<span class="x">${a >= 0 ? q.opts[a] : t("skip")}</span><br><span class="y">${q.a}</span>`}</td>
          <td><span class="res ${good ? "ok" : "no"}">${good ? t("ok") : t("no")}</span></td></tr>`; }).join("")}</tbody>
    </table></div>
  </div>

  <p class="note">${t("method")}</p>
  <div class="actions noprint">
    <button class="btn primary" id="copy">${t("copy")}</button>
    ${location.protocol.startsWith("http") && !/claude\.ai|claudeusercontent/.test(location.hostname) ? `<button class="btn" id="share">${t("link")}</button><button class="btn ghost" id="print">${t("print")}</button>` : ""}
  </div>`;

  document.getElementById("fM").onclick = () => { onlyMistakes = true; render(); };
  document.getElementById("fA").onclick = () => { onlyMistakes = false; render(); };
  const sum = {
    date: fmtDate(D), lvl: L0.lvl, name: L0.name, nameEs: L0.es, acc: A.acc, ok: A.ok, n: A.takenQ.length, sp: A.spTotal,
    str: A.strengths.slice(0, 3).map(a => a[lang]).join(", "), foc: A.focus.slice(0, 3).map(a => a[lang]).join(", ")
  };
  document.getElementById("copy").onclick = () => copyText(t("shareTxt")(sum), t("copied"));
  const sh = document.getElementById("share");
  if (sh) sh.onclick = () => copyText(location.origin + location.pathname + "?r=" + encodeURIComponent(R) + (D ? "&d=" + D : "") + "&lang=" + lang, t("linkDone"));
  const pr = document.getElementById("print");
  if (pr) pr.onclick = () => window.print();
}

function certHead(L0, A) {
  const scale = ["A1", "A2", "B1", "B2", "C1", "C2"], idx = scale.indexOf(L0.lvl.replace("+", ""));
  return `<div class="panel cert">
    <div class="cert-top"><span style="display:flex;align-items:center;gap:10px">${G.mark(28)}<span><b>${t("title")}</b><br><span class="muted" style="font-size:.85em">${t("subtitle")}</span></span></span>
      <span class="muted" style="font-size:.88em;text-align:right">${t("date")}: ${fmtDate(D)}<br>${t("instructor")}: ${G.maestro}</span></div>
    <div class="hero"><div class="lvl">${L0.lvl}</div>
      <div style="display:grid;gap:6px"><span class="eyebrow">${lang === "es" ? L0.es : L0.name}</span>
        <h1>${A ? t("summary")(A.acc, L0.lvl, lang === "es" ? L0.es : L0.name) : (lang === "es" ? L0.es : L0.name)}</h1></div></div>
    <div class="cefr" aria-label="CEFR">${scale.map((x, i) => `<span class="${i === idx ? "on" : i < idx ? "past" : ""}">${x}</span>`).join("")}</div>
  </div>`;
}
function copyText(txt, okMsg) {
  const done = () => toast(okMsg);
  try { navigator.clipboard.writeText(txt).then(done, () => toast(t("copyFail"))); } catch (e) { toast(t("copyFail")); }
}
function toast(m) { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
document.getElementById("lEN").onclick = () => { lang = "en"; G.store.set("reportLang", lang); render(); };
document.getElementById("lES").onclick = () => { lang = "es"; G.store.set("reportLang", lang); render(); };
render();
if (new URLSearchParams(location.search).has("r") && !(G.cloudEnabled && G.user)) G.ready.then(u => { if (!u) document.getElementById("avWrap").hidden = true; });
</script>
</body>
</html>
