<style>
  .wrap { max-width: 860px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 20px; }
  .wrap > * { min-width: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 26px; display: grid; gap: 18px; }
  @media (max-width: 560px) { .panel { padding: 18px; } }
  .panel h2 { font-size: 1.15em; font-weight: 800; }
  .head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; position: relative; overflow: hidden; border-top: 4px solid var(--brand); }
  @media (max-width: 600px) { .head { grid-template-columns: auto minmax(0, 1fr); } .head .lvl { grid-column: 1 / -1; justify-self: start; } }
  .big-av { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; color: var(--on-fill); font-size: 2.2em; font-weight: 800; }
  .head h1 { font-size: 1.7em; font-weight: 800; }
  .lvl { text-align: center; padding: 10px 18px; border-radius: 14px; background: var(--brand-soft); color: var(--brand-dark); }
  .lvl b { display: block; font-size: 1.9em; line-height: 1; font-weight: 800; }
  .lvl span { font-size: .75em; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 700px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { padding: 16px; display: grid; gap: 2px; }
  .stat .v { font-size: 1.6em; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .stat .l { font-size: .82em; color: var(--mute); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: .9em; }
  .chips button[aria-pressed="true"] { background: var(--inverse); color: var(--on-inverse); border-color: var(--inverse); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line-2); }
  .swatches button[aria-pressed="true"] { border-color: var(--surface); box-shadow: 0 0 0 3px var(--ink); }
  .builder { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 700px) { .builder { grid-template-columns: 1fr; } }
  .preview { display: grid; gap: 12px; justify-items: center; position: sticky; top: calc(80px + env(safe-area-inset-top, 0px)); }
  @media (max-width: 700px) { .preview { position: static; } }
  .preview .stage { width: 200px; height: 200px; border-radius: 50%; box-shadow: 0 10px 30px rgba(27,31,42,.14); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 8px 14px; font-weight: 700; font-size: .85em; }
  .seg button[aria-pressed="true"] { background: var(--inverse); color: var(--on-inverse); }
  .opts-row { display: grid; gap: 14px; }
  .opt-group { display: grid; gap: 8px; }
  .opt-group > b { font-size: .88em; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .tiles button { border: 2px solid transparent; background: var(--bg); border-radius: 12px; padding: 6px 4px 4px; display: grid; justify-items: center; gap: 2px; font-size: .72em; font-weight: 700; color: var(--ink-2); }
  .tiles button[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); }
  .swatches.sm button { width: 30px; height: 30px; }
  .num { justify-self: start; display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; }
  .num button { border: 0; background: var(--bg); width: 40px; height: 40px; font-weight: 800; font-size: 1.1em; }
  .num input { width: 64px; height: 40px; border: 0; text-align: center; font: inherit; font-weight: 800; color: var(--ink); background: var(--surface); }
  .big-av svg { width: 84px; height: 84px; }
  .tiles button.locked, .swatches button.locked { position: relative; opacity: .55; }
  .tiles button.locked svg { filter: grayscale(1); }
  .tiles button.locked::after, .swatches button.locked::after { content: "🔒"; position: absolute; font-size: 12px; }
  .tiles button.locked::after { top: 4px; right: 4px; }
  .swatches button.locked::after { inset: 0; display: grid; place-items: center; }
  .tiles button { position: relative; }
  .tiles .lk { font-size: .9em; color: var(--mute); }
  .unlock-note { font-size: .85em; color: var(--mute); display: flex; gap: 8px; align-items: center; }
  .set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
  .set-row:first-of-type { border-top: 0; padding-top: 0; }
  .set-row b { display: block; }
  .set-row p { color: var(--mute); font-size: .88em; }
  @media (max-width: 560px) { .set-row { grid-template-columns: 1fr; } }
  .steps-i { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); font-size: .92em; }
  .sync { display: flex; align-items: center; gap: 8px; font-size: .85em; color: var(--mute); }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .sync.off i { background: var(--line-2); }
  .sync.err i { background: var(--bad); }
  /* Garage (racing style): cars unlocked by passing lessons */
  .gx-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
  .gx-count { font-size: .82em; font-weight: 800; padding: 5px 11px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .gx-show { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
  @media (max-width: 720px) { .gx-show { grid-template-columns: 1fr; } }
  .gx-stage { position: relative; min-height: 230px; display: grid; align-items: end; padding: 48px 18px 20px; color: #9aa1ab;
    background: radial-gradient(60% 55% at 50% 0%, rgba(255,255,255,.16), transparent 70%), linear-gradient(#2c3037 0 64%, #3a3f47 64% 65%, #24272d 65%); }
  .gx-stage::after { content: ""; position: absolute; left: 0; right: 0; top: 64%; height: 1px; background: rgba(255,255,255,.06); }
  .gx-stage .car-svg { width: 100%; height: auto; position: relative; z-index: 1; filter: drop-shadow(0 10px 14px rgba(0,0,0,.25)); }
  .gx-stage.locked .car-svg { filter: none; opacity: .55; }
  .gx-plate { position: absolute; top: 16px; left: 18px; display: flex; gap: 8px; align-items: center; color: #e7e9ec; font-size: .78em; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; z-index: 2; }
  .gx-plate i { width: 8px; height: 8px; border-radius: 50%; background: #f5c518; }
  .gx-stage.locked .gx-plate i { background: #6b717b; }
  .gx-info { padding: 22px; display: grid; gap: 14px; align-content: start; background: var(--surface); }
  .gx-info h3 { font-size: 1.45em; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; }
  .gx-info .kind { color: var(--mute); font-weight: 600; font-size: .9em; }
  .gx-specs { display: grid; gap: 10px; }
  .gx-spec { display: grid; grid-template-columns: 92px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: .85em; }
  .gx-spec span:first-child { color: var(--mute); font-weight: 700; }
  .gx-spec b { text-align: right; font-variant-numeric: tabular-nums; }
  .gx-bar { height: 6px; border-radius: 99px; background: var(--bg); overflow: hidden; }
  .gx-bar i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
  .gx-about { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 8px; }
  .gx-about p { font-size: .98em; line-height: 1.5; }
  .gx-about .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .gx-learn { font-size: .8em; color: var(--mute); font-weight: 600; }
  .gx-bays { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 720px) { .gx-bays { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
  @media (max-width: 420px) { .gx-bays { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gx-note { font-size: .85em; color: var(--mute); }
  .gx-bay { position: relative; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-m, 12px); padding: 10px 10px 8px; display: grid; gap: 4px; text-align: left; color: #9aa1ab; }
  .gx-bay .car-svg { width: 100%; height: auto; }
  .gx-bay.locked .car-svg { opacity: .5; }
  .gx-bay b { font-size: .8em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gx-bay small { font-size: .72em; color: var(--mute); font-weight: 700; }
  .gx-bay[aria-pressed="true"] { border-color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--ink); }
  .gx-spec.nobar { grid-template-columns: 92px minmax(0, 1fr); }
  .gx-art { display: grid; place-items: center; height: 58px; }
  .gx-art svg { width: 100%; height: 100%; }
  .gx-stage .col-svg { width: 100%; height: auto; max-height: 210px; position: relative; z-index: 1; filter: drop-shadow(0 10px 14px rgba(0,0,0,.25)); }
  .gx-stage.locked .col-svg { filter: none; opacity: .55; }
  .gx-stage .col-svg.poster { height: 200px; width: auto; margin: 0 auto; display: block; filter: drop-shadow(0 12px 18px rgba(0,0,0,.35)); }
  .gx-stage.st-stable { color: #8b7a66; background: radial-gradient(60% 55% at 50% 0%, rgba(255,236,200,.22), transparent 70%), repeating-linear-gradient(90deg, #4a3526 0 38px, #432f21 38px 40px) top / 100% 64% no-repeat, linear-gradient(#5a4a33, #4a3c29) bottom / 100% 36% no-repeat; }
  .gx-stage.st-studio { color: #7d838c; background: radial-gradient(60% 55% at 50% 0%, rgba(255,214,170,.14), transparent 70%), repeating-linear-gradient(45deg, #24272c 0 10px, #2a2d33 10px 20px) top / 100% 66% no-repeat, linear-gradient(#5b4330, #4a3627) bottom / 100% 34% no-repeat; }
  .gx-stage.st-posters { color: #b9b2a5; align-items: center; background: radial-gradient(70% 60% at 50% 0%, rgba(255,255,255,.5), transparent 70%), #d9d2c4; }
  .gx-stage.st-posters .gx-plate { color: #3a342b; }
  .gx-stage.st-posters::after { display: none; }
  .bays-posters .gx-art { height: 84px; }
  .gx-new { position: absolute; top: 7px; right: 7px; background: #f5c518; color: #1b1d22; font-size: .66em; font-weight: 800; padding: 2px 7px; border-radius: 99px; }
</style>

<body>
<header class="nav gutter">
  <div class="container nav-in">
    <a class="logo" href="index.html" id="logo"></a>
    <nav class="nav-links"><a href="index.html">My learning</a><a href="examen.html">Placement test</a></nav>
    <span class="spacer"></span>
    <a class="avatar" data-avatar href="perfil.html" aria-label="Your profile"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="6.5" r="3.2"/><path d="M2.8 16c.9-3 3.4-4.6 6.2-4.6s5.3 1.6 6.2 4.6" stroke-linecap="round"/></svg></a>
  </div>
</header>
<main class="gutter"><div class="wrap" id="app"></div></main>

<script>
const G = window.LINGUA, setup = new URLSearchParams(location.search).get("setup") === "1";
document.getElementById("logo").innerHTML = G.logo;
const INTERESTS = ["Formula 1", "JDM cars", "Anime", "Football", "Video games", "Music", "Guitar", "Movies & series", "Classic films", "Horse riding", "Going out with friends", "Work & career", "Basketball", "Travel", "Food"];
const COLORS = ["#2346d0", "#0f766e", "#b45309", "#6d3fd6", "#15803d", "#be123c", "#1b1f2a"];
const LV = { A1: "Beginner", A2: "Elementary", B1: "Intermediate", B2: "Upper intermediate", "B2+": "Upper intermediate +" };

const esc = window.LINGUA.esc;
function localProfile() { return G.store.get("profileLocal", {}); }
function stats() {
  const all = G.modulos.flatMap(m => m.lecciones), ready = all.filter(l => l.estado === "lista");
  const scores = ready.map(l => G.store.get("score." + l.id, null)).filter(Boolean);
  const avg = scores.length ? Math.round(scores.reduce((a, s) => a + s.ok / s.n, 0) / scores.length * 100) : null;
  const review = G.review.count();
  return { done: scores.length, total: ready.length, avg, review, place: G.store.get("placement", null), game: G.game.mine() };
}

// ── Collection (garage, stable, studio or poster wall): one item per lesson passed (80%+) ──
let gxSel = null;
function drawGarage() {
  const box = document.getElementById("garage"); if (!box) return;
  const CX = G.collection.current(); if (!CX) return;
  const items = CX.list(), seen = G.collection.seen(), got = items.filter(c => c.unlocked);
  if (!gxSel || !items.some(c => c.key === gxSel)) {
    const fresh = got.filter(c => !seen.includes(c.key));
    gxSel = (fresh[fresh.length - 1] || got[got.length - 1] || items.find(c => !c.unlocked) || items[0]).key;
  }
  const c = items.find(x => x.key === gxSel);
  if (c.unlocked) G.collection.markSeen(c.key);
  const spec = ([label, v, pct]) => `<div class="gx-spec ${pct == null ? "nobar" : ""}"><span>${esc(label)}</span>${pct == null ? "" : `<span class="gx-bar"><i style="width:${Math.max(6, Math.min(100, pct * 100))}%"></i></span>`}<b>${esc(v)}</b></div>`;
  const nextUp = items.find(x => !x.unlocked), isCar = CX.key === "garage";
  const lockText = x => isCar || x.need <= 1 ? (x.lesson ? `Pass Lesson ${esc(x.lesson.id)} · ${esc(x.lesson.titulo)} with 80% or more in the final quiz to unlock it.` : `Pass your next lesson with 80% or more to unlock it.`)
    : `Pass ${x.need} more lessons with 80% or more to unlock it.`;
  box.innerHTML = `
    <div class="gx-head"><div><h2 id="gxT">${esc(CX.title)}</h2><p class="muted" style="font-size:.9em">Pass a lesson with 80% or more in the final quiz to unlock ${isCar ? "its car" : "a new " + esc(CX.noun)}.</p></div>
      <span class="gx-count">${got.length} / ${items.length} ${esc(CX.nouns)}</span></div>
    <div class="gx-show">
      <div class="gx-stage st-${CX.stage} ${c.unlocked ? "" : "locked"}">
        <span class="gx-plate"><i></i>${c.unlocked ? esc(cap(CX.noun)) + " " + esc(c.num) : "Locked"}${c.lesson ? " · Lesson " + esc(c.lesson.id) : ""}</span>
        ${c.art(!c.unlocked)}
      </div>
      <div class="gx-info">${c.unlocked ? `
        <div><h3>${esc(c.name)}</h3><span class="kind">${esc(c.kind)} · unlocked with Lesson ${esc(c.lesson.id)} · ${esc(c.lesson.titulo)}</span></div>
        <div class="gx-specs">${c.specs.map(spec).join("")}</div>
        <div class="gx-about"><span class="eyebrow">About this ${esc(CX.noun)}</span><p>${esc(c.about)}</p>
          <div class="row">${G.canSpeak ? `<button type="button" class="btn sm" id="gxSay">🔊 Listen</button>` : ""}${c.learned ? `<span class="gx-learn">You learned: ${esc(c.learned)}</span>` : ""}</div></div>`
      : `
        <div><h3>${esc(CX.mystery)}</h3>${c.lesson && (isCar || c.need <= 1) ? `<span class="kind">Lesson ${esc(c.lesson.id)} · ${esc(c.lesson.titulo)}</span>` : ""}</div>
        <p class="muted">${lockText(c)}</p>
        ${c.lesson && (isCar || c.need <= 1) ? `<div><a class="btn primary" href="${c.lesson.archivo}">${G.store.get("score." + c.lesson.id, null) ? "Try the lesson again" : "Go to the lesson"}</a></div>` : ""}`}
      </div>
    </div>
    <div class="gx-bays bays-${CX.stage}" role="group" aria-label="${esc(cap(CX.nouns))}">${items.map(x => `<button type="button" class="gx-bay ${x.unlocked ? "" : "locked"}" data-car="${esc(x.key)}" aria-pressed="${x.key === gxSel}" aria-label="${x.unlocked ? esc(x.name) : "Locked " + esc(CX.noun)}">
      ${x.unlocked && !seen.includes(x.key) && x.key !== c.key ? `<span class="gx-new">New</span>` : ""}
      <span class="gx-art">${x.art(!x.unlocked)}</span><b>${x.unlocked ? esc(x.name) : "🔒 Locked"}</b><small>${x.unlocked || isCar ? (x.lesson ? "Lesson " + esc(x.lesson.id) : "") : esc(cap(CX.noun)) + " " + esc(x.num)}</small></button>`).join("")}</div>
    ${nextUp && got.length ? `<p class="gx-note">Next ${esc(CX.noun)}: pass ${nextUp.lesson ? `<b>Lesson ${esc(nextUp.lesson.id)} · ${esc(nextUp.lesson.titulo)}</b>` : "your next lesson"}.</p>` : ""}
    ${!nextUp ? `<p class="gx-note">You've collected every ${esc(CX.noun)}. New ones are on the way!</p>` : ""}`;
  box.querySelectorAll("[data-car]").forEach(b => b.onclick = () => { gxSel = b.dataset.car; drawGarage(); });
  const sy = document.getElementById("gxSay"); if (sy) sy.onclick = () => G.say(c.about);
  function cap(x) { return x[0].toUpperCase() + x.slice(1); }
}

function render() {
  const p = (G.cloudEnabled ? G.profile : localProfile()) || {};
  const name = p.display_name || "", color = p.avatar_color || COLORS[0], st = stats();
  const picked = new Set(p.interests || []);
  let av = G.avatar.has() ? G.avatar.get() : { ...G.avatar.DEFAULT, number: p.age && p.age < 100 ? p.age : 7 };
  const since = G.user && G.user.created_at ? new Date(G.user.created_at).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : null;
  const sync = !G.cloudEnabled ? `<span class="sync off"><i></i>Saved on this device only</span>`
    : G.lastSync && !G.lastSync.ok ? `<span class="sync err"><i></i>Not synced yet. We’ll keep trying.</span>`
    : `<span class="sync"><i></i>Progress saved to your account</span>`;

  document.getElementById("app").innerHTML = `
  ${setup ? `<div class="alert info"><b>Welcome to Lingua!</b> Set up your profile to start. It takes one minute.</div>` : ""}
  <div class="panel head">
    <div class="big-av" id="bigAv">${G.avatar.svg(av, 84, { initial: name[0] || "?", initialBg: color })}</div>
    <div style="display:grid;gap:4px;min-width:0">
      <span class="eyebrow">${setup ? "New student" : "Student"}</span>
      <h1 id="nameOut">${esc(name) || "Your profile"}</h1>
      <div class="muted" style="font-size:.9em">${since ? "Student since " + since : "Lingua student"}</div>
      ${sync}
    </div>
    <div class="lvl"><span>Level</span><b>${st.place ? esc(st.place.nivel) : "—"}</b><span>${st.place ? LV[st.place.nivel] || "" : "Not tested"}</span></div>
  </div>

  ${setup ? "" : `<div class="stats">
    <div class="card stat"><span class="v">${st.game.level}<span class="muted" style="font-size:.5em"> · ${st.game.xp} XP</span></span><span class="l">Level · ${st.game.title}</span></div>
    <div class="card stat"><span class="v">🔥 ${st.game.streak}</span><span class="l">Day streak · best ${st.game.best}</span></div>
    <div class="card stat"><span class="v">${st.done}<span class="muted" style="font-size:.55em"> / ${st.total}</span></span><span class="l">Lessons completed</span></div>
    <div class="card stat"><span class="v">${st.avg == null ? "—" : st.avg + "%"}</span><span class="l">Average final quiz</span></div>
  </div>`}

  ${setup || !G.collection || !G.collection.current() || !G.collection.current().list().length ? "" : `<section class="panel" id="garage" style="scroll-margin-top:80px" aria-labelledby="gxT"></section>`}

  ${setup ? "" : (() => { const bs = G.badges.earned(), got = bs.filter(b => b.at).length; return `<section class="panel" id="badges" style="scroll-margin-top:80px" aria-labelledby="bdT">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><h2 id="bdT">Badges</h2><p class="muted" style="font-size:.9em">${got} of ${bs.length} earned. Keep practicing to unlock the rest.</p></div></div>
    <div class="badge-grid">${bs.sort((x, y) => (y.at ? 1 : 0) - (x.at ? 1 : 0)).map(b => `<div class="bdg ${b.at ? "" : "off"}" title="${G.esc(b.d)}"><span class="e" aria-hidden="true">${b.e}</span><b>${G.esc(b.t)}</b><small>${b.at ? "Earned " + new Date(b.at).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : G.esc(b.d)}</small></div>`).join("")}</div>
  </section>`; })()}

  <section class="panel" aria-labelledby="avT">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <div><h2 id="avT">Your avatar</h2><p class="muted" style="font-size:.9em" id="avTxt"></p></div>
      <div class="seg" role="group" aria-label="Avatar style"><button type="button" data-style="helmet" id="avKind">Helmet</button><button type="button" data-style="initial">Initial</button></div>
    </div>
    <div class="builder" id="builder"></div>
  </section>

  <form class="panel" id="pform" novalidate>
    <div><h2>${setup ? "Tell us about you" : "Profile"}</h2><p class="muted" style="font-size:.9em">Your teacher uses this to make lessons about the things you like.</p></div>
    <div class="grid2">
      <div class="field"><label for="dn">Your name</label><input id="dn" maxlength="40" autocomplete="given-name" value="${esc(name)}"></div>
      <div class="field"><label for="age">Age</label><input id="age" type="number" min="5" max="99" inputmode="numeric" value="${p.age || ""}"></div>
    </div>
    <div class="field"><label>Things you love</label><span class="help">Choose as many as you want.</span>
      <div class="chips" id="chips">${INTERESTS.map(i => `<button type="button" aria-pressed="${picked.has(i)}">${i}</button>`).join("")}</div></div>
    <div id="pmsg" hidden></div>
    <div class="actions"><button class="btn primary" type="submit" id="psave">${setup ? "Save and start" : "Save profile and avatar"}</button></div>
  </form>

  ${setup ? "" : `<div class="panel" id="settings" style="scroll-margin-top:80px;gap:0">
    <h2 style="margin-bottom:14px">Settings</h2>
    <div class="set-row"><div><b>Appearance</b><p>System follows your phone or computer setting.</p></div>
      <div class="seg" role="group" aria-label="Theme">${["light", "dark", "system"].map(v => `<button type="button" data-theme-opt="${v}" aria-pressed="${G.theme.get() === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join("")}</div></div>
    <div class="set-row"><div><b>Text size</b><p>Makes the lessons easier to read.</p></div>
      <div class="seg" role="group" aria-label="Text size">${[[.9, "Small"], [1, "Normal"], [1.15, "Large"], [1.3, "Extra large"]].map(([v, t]) => `<button type="button" data-size="${v}" aria-pressed="${Math.abs(G.store.get("textSize", 1) - v) < .03}">${t}</button>`).join("")}</div></div>
    <div class="set-row"><div><b>Sounds</b><p>Little sounds for right and wrong answers.</p></div>
      <button type="button" class="toggle ${G.store.get("sounds", true) ? "on" : ""}" id="sndT" aria-pressed="${G.store.get("sounds", true)}"><span class="sw"></span><span id="sndL">${G.store.get("sounds", true) ? "On" : "Off"}</span></button></div>
    ${G.canSpeak ? `<div class="set-row"><div><b>Pronunciation voice</b><p>The voice you hear when you press 🔊.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <div class="seg" role="group" aria-label="Accent">${[["en-US", "🇺🇸 US"], ["en-GB", "🇬🇧 UK"]].map(([v, t]) => `<button type="button" data-voice="${v}" aria-pressed="${G.store.get("voice", "en-US") === v}">${t}</button>`).join("")}</div>
        <div class="seg" role="group" aria-label="Speed">${[[.75, "Slow"], [.92, "Normal"]].map(([v, t]) => `<button type="button" data-rate="${v}" aria-pressed="${G.store.get("voiceRate", .92) === v}">${t}</button>`).join("")}</div>
        <button type="button" class="btn sm" id="tryV">Try it</button></div></div>` : ""}
    <div class="set-row" id="install" style="scroll-margin-top:80px"><div><b>Install on your phone</b>
      ${G.install.standalone ? `<p>Lingua is installed on this device. 🎉</p>`
        : G.install.ios ? `<p>Open Lingua in Safari, then:</p><ol class="steps-i"><li>Tap the Share button <b style="display:inline">⎋</b> at the bottom.</li><li>Choose <b style="display:inline">Add to Home Screen</b>.</li><li>Tap <b style="display:inline">Add</b>. Lingua shows up like an app.</li></ol>`
        : `<p>Add Lingua to your home screen so it opens like an app.</p><p id="instHelp" ${G.install.prompt ? "hidden" : ""}>In Chrome, open the ⋮ menu and choose <b style="display:inline">Install app</b> or <b style="display:inline">Add to Home screen</b>.</p>`}</div>
      ${!G.install.standalone && !G.install.ios ? `<button class="btn" id="instB" ${G.install.prompt ? "" : "hidden"}>Install</button>` : ""}</div>
  </div>`}

  ${G.cloudEnabled && !setup ? `
  <form class="panel" id="wform" novalidate>
    <div><h2>Password</h2><p class="muted" style="font-size:.9em">Use at least 8 characters.</p></div>
    <div class="grid2">
      <div class="field"><label for="np">New password</label><input id="np" type="password" autocomplete="new-password" minlength="8"></div>
      <div class="field"><label for="np2">Repeat new password</label><input id="np2" type="password" autocomplete="new-password" minlength="8"></div>
    </div>
    <div id="wmsg" hidden></div>
    <div class="actions"><button class="btn" type="submit" id="wsave">Change password</button></div>
  </form>
  <div class="panel" style="grid-template-columns:minmax(0,1fr) auto;align-items:center">
    <div><h2>Sign out</h2><p class="muted" style="font-size:.9em">Your progress stays saved in your account.</p></div>
    <button class="btn" id="out">Sign out</button>
  </div>` : ""}`;

  let chosenColor = color;
  drawBuilder();
  drawGarage();
  document.querySelectorAll("#chips button").forEach(b => b.onclick = () => b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"));
  document.getElementById("dn").addEventListener("input", () => paintPreview());

  function paintPreview() {
    const n = document.getElementById("dn").value.trim() || name, o = { initial: n[0] || "?", initialBg: chosenColor };
    document.getElementById("bigAv").innerHTML = G.avatar.svg(av, 84, o);
    const st = document.getElementById("stage"); if (st) st.innerHTML = G.avatar.svg(av, 200, o);
  }
  function cap(x) { return x[0].toUpperCase() + x.slice(1); }
  function drawBuilder() {
    const ST = G.style;
    document.getElementById("avTxt").textContent = ST.editor;
    document.getElementById("avKind").textContent = cap(ST.part.split(" ").pop());
    const A = G.avatar, b = document.getElementById("builder");
    document.querySelectorAll("[data-style]").forEach(x => x.setAttribute("aria-pressed", x.dataset.style === av.style));
    const need = (key, k) => key === "bg" ? 0 : G.game.needs(key, k) && av[key] !== k ? G.game.needs(key, k) : 0;
    const sw = (obj, key) => `<div class="swatches sm">${Object.entries(obj).map(([k, c]) => { const n = need(key, k); return `<button type="button" class="${n ? "locked" : ""}" aria-label="${k}${n ? ", unlocks at level " + n : ""}" title="${n ? "Unlocks at Level " + n : k}" aria-pressed="${av[key] === k}" ${n ? `data-lock="${n}"` : `data-k="${key}" data-v="${k}"`} style="background:${c}"></button>`; }).join("")}</div>`;
    const tiles = (obj, key, labelOf) => `<div class="tiles">${Object.keys(obj).sort((a, b) => need(key, a) - need(key, b)).map(k => { const n = need(key, k); return `<button type="button" class="${n ? "locked" : ""}" aria-pressed="${av[key] === k}" ${n ? `data-lock="${n}" title="Unlocks at Level ${n}"` : `data-k="${key}" data-v="${k}"`}>${A.svg({ ...av, style: "helmet", [key]: k }, 48)}${n ? `<span class="lk">Level ${n}</span>` : labelOf(k)}</button>`; }).join("")}</div>`;
    const helmet = `
      <div class="opt-group"><b>Design</b>${tiles(A.DESIGNS, "design", k => A.DESIGNS[k])}</div>
      <div class="opt-group"><b>${cap(ST.part)} color</b>${sw(A.SHELLS, "shell")}</div>
      <div class="opt-group"><b>Accent color</b>${sw(A.SHELLS, "accent")}</div>
      ${ST.visor ? `<div class="opt-group"><b>${ST.visor}</b>${tiles(A.VISORS, "visor", k => A.VISORS[k].label)}</div>` : ""}
      ${ST.number ? `<div class="opt-group"><b>${ST.number}</b><div class="num"><button type="button" id="nDn" aria-label="Lower number">−</button><input id="nIn" type="number" min="0" max="99" inputmode="numeric" value="${av.number}" aria-label="${ST.number}"><button type="button" id="nUp" aria-label="Higher number">+</button></div></div>` : ""}
      <div class="opt-group"><b>Background</b>${sw(A.BGS, "bg")}</div>`;
    const initial = `<div class="opt-group"><b>Color</b><div class="swatches" id="sw">${COLORS.map(c => `<button type="button" aria-label="Color ${c}" aria-pressed="${c === chosenColor}" data-c="${c}" style="background:${c}"></button>`).join("")}</div></div>`;
    b.innerHTML = `<div class="preview"><div class="stage" id="stage"></div>${av.style === "helmet" ? `<button type="button" class="btn sm" id="rand">Surprise me</button>` : ""}</div>
      <div class="opts-row">${av.style === "helmet" ? helmet : initial}</div>`;
    paintPreview();
    b.querySelectorAll("[data-k]").forEach(x => x.onclick = () => { av[x.dataset.k] = x.dataset.v; drawBuilder(); });
    b.querySelectorAll("[data-lock]").forEach(x => x.onclick = () => G.toast(`<b>🔒 Unlocks at Level ${x.dataset.lock}</b><span>You're Level ${G.game.mine().level}. Practice to earn XP!</span>`));
    b.querySelectorAll("[data-c]").forEach(x => x.onclick = () => { chosenColor = x.dataset.c; drawBuilder(); });
    const r = document.getElementById("rand"); if (r) r.onclick = () => { av = { ...A.random(), number: av.number }; drawBuilder(); };
    const ni = document.getElementById("nIn");
    if (ni) {
      const setN = v => { av.number = Math.max(0, Math.min(99, isNaN(v) ? 0 : v)); ni.value = av.number; paintPreview(); };
      ni.oninput = () => setN(parseInt(ni.value, 10));
      document.getElementById("nUp").onclick = () => setN(av.number + 1);
      document.getElementById("nDn").onclick = () => setN(av.number - 1);
    }
  }
  document.querySelectorAll("[data-theme-opt]").forEach(x => x.onclick = () => {
    G.theme.set(x.dataset.themeOpt);
    document.querySelectorAll("[data-theme-opt]").forEach(y => y.setAttribute("aria-pressed", y === x));
  });
  document.querySelectorAll("[data-style]").forEach(x => x.onclick = () => { av.style = x.dataset.style; drawBuilder(); });
  const pressOnly = (sel, x) => document.querySelectorAll(sel).forEach(y => y.setAttribute("aria-pressed", y === x));
  document.querySelectorAll("[data-size]").forEach(x => x.onclick = () => { const v = +x.dataset.size; G.store.set("textSize", v); document.documentElement.style.setProperty("--scale", v); pressOnly("[data-size]", x); });
  document.querySelectorAll("[data-voice]").forEach(x => x.onclick = () => { G.store.set("voice", x.dataset.voice); pressOnly("[data-voice]", x); G.say("Hi! This is how I sound."); });
  document.querySelectorAll("[data-rate]").forEach(x => x.onclick = () => { G.store.set("voiceRate", +x.dataset.rate); pressOnly("[data-rate]", x); G.say("Hi! This is how I sound."); });
  const tv = document.getElementById("tryV"); if (tv) tv.onclick = () => G.say("Hi! My dream car is a Nissan Skyline.");
  const snd = document.getElementById("sndT");
  if (snd) snd.onclick = () => { const on = !G.store.get("sounds", true); G.store.set("sounds", on); snd.classList.toggle("on", on); snd.setAttribute("aria-pressed", on); document.getElementById("sndL").textContent = on ? "On" : "Off"; if (on) G.sfx("ok"); };
  const ib = document.getElementById("instB");
  if (ib) ib.onclick = async () => { if (!G.install.prompt) return; G.install.prompt.prompt(); try { await G.install.prompt.userChoice; } catch (e) {} G.install.prompt = null; ib.hidden = true; };

  const say = (id, cls, t) => { const m = document.getElementById(id); m.className = "alert " + cls; m.textContent = t; m.hidden = false; };
  document.getElementById("pform").addEventListener("submit", async e => {
    e.preventDefault();
    const dn = document.getElementById("dn").value.trim(), ageRaw = document.getElementById("age").value, age = ageRaw ? +ageRaw : null;
    if (!dn) { say("pmsg", "bad", "Write your name."); return; }
    if (age != null && (age < 5 || age > 99)) { say("pmsg", "bad", "Age must be between 5 and 99."); return; }
    const interests = [...document.querySelectorAll('#chips button[aria-pressed="true"]')].map(b => b.textContent);
    const fields = { display_name: dn, age, interests, avatar_color: chosenColor };
    G.store.set("avatar", av);
    const btn = document.getElementById("psave"); btn.disabled = true;
    try {
      if (G.cloudEnabled) await G.saveProfile(fields); else { G.store.set("profileLocal", fields); G.profile = fields; G.decorate && G.decorate(); }
      if (setup) { location.replace("index.html"); return; }
      say("pmsg", "ok", "Profile saved."); document.getElementById("nameOut").textContent = dn; G.decorate && G.decorate();
    } catch (err) { say("pmsg", "bad", "We couldn’t save your profile: " + (err.message || err)); }
    btn.disabled = false;
  });

  const w = document.getElementById("wform");
  if (w) w.addEventListener("submit", async e => {
    e.preventDefault();
    const a = document.getElementById("np").value, b = document.getElementById("np2").value;
    if (a.length < 8) { say("wmsg", "bad", "Use at least 8 characters."); return; }
    if (a !== b) { say("wmsg", "bad", "The two passwords don’t match."); return; }
    const btn = document.getElementById("wsave"); btn.disabled = true;
    const { error } = await G.sb.auth.updateUser({ password: a });
    btn.disabled = false;
    if (error) say("wmsg", "bad", "We couldn’t change your password: " + error.message);
    else { say("wmsg", "ok", "Password changed."); w.reset(); }
  });
  const out = document.getElementById("out");
  if (out) out.onclick = () => G.signOut();
}
G.ready.then(() => { render(); if (location.hash) { const t = document.querySelector(location.hash); if (t) setTimeout(() => t.scrollIntoView({ behavior: "smooth", block: "start" }), 80); } });
document.addEventListener("lingua:installable", () => { const b = document.getElementById("instB"), h = document.getElementById("instHelp"); if (b) b.hidden = false; if (h) h.hidden = true; });
document.addEventListener("lingua:sync", () => {
  const s = document.querySelector(".sync"); if (!s) return;
  const ok = G.lastSync && G.lastSync.ok;
  s.className = "sync" + (ok ? "" : " err"); s.innerHTML = ok ? "<i></i>Progress saved to your account" : "<i></i>Not synced yet. We’ll keep trying.";
});
</script>
</body>
</html>
