<!doctype html>
<html lang="en" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua · Teacher panel</title>
<meta name="description" content="English classes made for you: lessons about F1, JDM cars, anime, football and games, with pronunciation, quizzes and diplomas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lingua">
<meta property="og:title" content="Lingua · Teacher panel">
<meta property="og:description" content="English classes made for you: lessons about F1, JDM cars, anime, football and games, with pronunciation, quizzes and diplomas.">
<meta property="og:image" content="https://lingua-english-class.netlify.app/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Lingua">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<script src="assets/game.js"></script>
<script src="assets/avatar.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/menu.js"></script>
<style>
  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 32px 64px; display: grid; gap: 20px; }
  .wrap > * { min-width: 0; }
  .page-head h1 { font-size: 2em; font-weight: 800; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 24px; display: grid; gap: 16px; align-content: start; }
  @media (max-width: 560px) { .panel { padding: 16px; } }
  .panel h2 { font-size: 1.1em; font-weight: 800; }
  .layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .roster { display: grid; gap: 6px; }
  .stu { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
  .stu:hover { background: var(--bg); }
  .stu[aria-pressed="true"] { background: var(--brand-soft); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
  .stu .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; overflow: hidden; }
  .stu b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stu small { color: var(--mute); font-weight: 600; font-size: .8em; }
  .pill { font-size: .75em; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); white-space: nowrap; }
  .pill.warn { background: var(--dev-soft); color: var(--dev); }
  .pill.good { background: var(--ok-soft); color: var(--ok-ink); }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kpi { padding: 14px 16px; display: grid; gap: 2px; border-radius: 12px; background: var(--bg); }
  .kpi .v { font-size: 1.5em; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: .8em; color: var(--mute); font-weight: 600; }
  .dhead { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; }
  .dhead .av { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 1.5em; }
  .dhead h2 { font-size: 1.5em; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .92em; min-width: 560px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-size: .72em; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
  td.r, th.r { text-align: right; }
  .miss { display: grid; gap: 6px; }
  .miss div { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg); font-size: .9em; }
  .miss div span:first-child { font-weight: 800; color: var(--mute); font-size: .85em; }
  .hw { display: grid; gap: 8px; }
  .hw-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
  .hw-item p { color: var(--ink-2); font-size: .88em; }
  .hw-item small { color: var(--mute); font-weight: 600; font-size: .8em; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr !important; } }
  .field textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 11px 12px; width: 100%; min-height: 80px; resize: vertical; }
  .field select { appearance: auto; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick button { border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82em; font-weight: 700; color: var(--ink-2); }
  .quick button:hover { border-color: var(--brand); color: var(--brand-dark); }
  .quick button.on { border-style: solid; border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: .9em; cursor: pointer; }
  .seg label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); }
  .lsmod { display: grid; gap: 8px; } .lsmod > b { font-size: .85em; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
  .lsgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .lsrow { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: .92em; }
  .lsrow:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
  .lsdot { width: 10px; height: 10px; border-radius: 3px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; font-size: .85em; white-space: pre-wrap; word-break: break-all; }
  .empty { color: var(--mute); text-align: center; padding: 18px; }
</style>
</head>
<body>
<header class="nav gutter">
  <div class="container nav-in">
    <a class="logo" href="index.html" id="logo"></a>
    <nav class="nav-links"><a href="index.html">My learning</a><a class="on" href="teacher.html">Teacher panel</a></nav>
    <span class="spacer"></span>
    <a class="avatar" data-avatar href="perfil.html" aria-label="Your profile"></a>
  </div>
</header>
<main class="gutter"><div class="wrap" id="app"></div></main>
<script>
const G = window.LINGUA, app = document.getElementById("app"), esc = G.esc;
document.getElementById("logo").innerHTML = G.logo;
const lessons = G.modulos.flatMap(m => m.lecciones), ready = lessons.filter(l => l.estado === "lista");
const fmt = d => d ? new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
const ago = d => {
  if (!d) return "never";
  const s = (Date.now() - new Date(d)) / 1000;
  return s < 3600 ? "just now" : s < 86400 ? Math.round(s / 3600) + " h ago" : s < 86400 * 2 ? "yesterday" : Math.round(s / 86400) + " days ago";
};
let DATA = null, SEL = null, ACC = null, ACCERR = null, OPEN = null;
const day = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const b64 = obj => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = ""; bytes.forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

function studentOf(p) {
  const row = DATA.progress.find(x => x.user_id === p.id) || { data: {} }, d = row.data || {};
  const get = (k, def) => d[k] && "v" in d[k] ? d[k].v : def;
  const theme0 = DATA.settings ? ((DATA.settings.find(x => x.student_id === p.id) || {}).theme || "racing") : "racing";
  const game = G.game.stats(get, theme0);
  const best = l => { let t = get("attempts." + l.id, []); const s = get("score." + l.id, null); if (!t.length && s) t = [s]; return t.length ? t.reduce((a, b) => b.ok / b.n > a.ok / a.n ? b : a) : null; };
  const set = DATA.settings ? (DATA.settings.find(x => x.student_id === p.id) || { student_id: p.id, lessons: [], theme: "racing" }) : null;
  const mine = set && Array.isArray(set.lessons) ? ready.filter(l => set.lessons.includes(l.id)) : ready;
  const rows = mine.map(l => { const t = get("attempts." + l.id, []), b = best(l), s = get("score." + l.id, null); return { l, done: get("done." + l.id, []).length, tries: t.length || (s ? 1 : 0), best: b, last: t[t.length - 1] || s }; });
  const scored = rows.filter(r => r.best), avg = scored.length ? Math.round(scored.reduce((a, r) => a + r.best.ok / r.best.n, 0) / scored.length * 100) : null;
  const passed = rows.filter(r => r.best && r.best.ok / r.best.n >= .8).length;
  const review = Object.values(get("review", {}) || {});
  const hw = DATA.homework.filter(h => h.student_id === p.id), pending = hw.filter(h => !h.done_at).length;
  return { p, get, game, rows, mine, settings: set, theme: theme0, avg, passed, review, hw, pending, placement: get("placement", null), avatar: get("avatar", null), updated: row.updated_at };
}
function avatarOf(s, size) {
  const name = (s.p.display_name || "?").trim();
  return s.avatar && s.avatar.style !== "initial" ? G.avatar.svg(s.avatar, size, { label: name, kind: G.themeOf(s.theme).avatar }) : `<span style="background:${s.p.avatar_color || "#2346d0"};width:100%;height:100%;display:grid;place-items:center">${esc(name[0] || "?").toUpperCase()}</span>`;
}

function notTeacher() {
  const email = (G.user && G.user.email) || "your-username@student.lingua.app";
  app.innerHTML = `<div class="page-head" style="display:grid;gap:4px"><span class="eyebrow">Teacher</span><h1>Teacher panel</h1></div>
    <div class="panel">
      <h2>This account isn’t a teacher yet</h2>
      <p class="muted">Turn on the teacher panel for <b style="color:var(--ink)">${esc(email)}</b> once: in Supabase, open <b>SQL Editor → New query</b>, paste this and press <b>Run</b>. Then reload this page.</p>
      <pre id="sql">insert into public.teachers (user_id)
select id from auth.users where email = '${esc(email)}'
on conflict do nothing;</pre>
      <div class="actions"><button class="btn" id="copy">Copy SQL</button><a class="btn ghost" href="index.html">Back to My learning</a></div>
      <p class="muted" style="font-size:.85em">If the query says the table doesn’t exist, run the latest <b>supabase/setup.sql</b> first.</p>
    </div>`;
  document.getElementById("copy").onclick = () => navigator.clipboard.writeText(document.getElementById("sql").textContent).then(() => G.toast("SQL copied"));
}

function render() {
  const list = DATA.profiles.filter(p => p.id !== (G.user && G.user.id)).map(studentOf)
    .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  if (!SEL && list.length) SEL = list[0].p.id;
  const cur = list.find(s => s.p.id === SEL);
  app.innerHTML = `
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
      <div style="display:grid;gap:4px"><span class="eyebrow">Teacher</span><h1>Teacher panel</h1><p class="muted">${list.length} student${list.length === 1 ? "" : "s"} · Progress, grades, mistakes and homework.</p></div>
      <div class="actions"><a class="btn ghost" href="builder.html">Lesson builder</a><button class="btn" id="reload">Refresh</button></div>
    </div>
    ${list.length ? `<div class="layout">
      <div class="panel" style="padding:12px"><div class="roster">${list.map(s => `
        <button class="stu" data-id="${s.p.id}" aria-pressed="${s.p.id === SEL}">
          <span class="av">${avatarOf(s, 44)}</span>
          <span style="min-width:0"><b>${esc(s.p.display_name || "New student")}</b><small>Active ${ago(s.updated)} · 🔥 ${s.game.streak}</small></span>
          ${s.pending ? `<span class="pill warn">${s.pending} to do</span>` : `<span class="pill">Lv ${s.game.level}</span>`}
        </button>`).join("")}</div></div>
      <div style="display:grid;gap:20px;min-width:0">${cur ? detail(cur) : ""}</div>
    </div>` : `<div class="panel"><p class="empty">No students yet. Create one below in Student accounts.</p></div>`}
    ${accounts()}`;
  document.getElementById("reload").onclick = load;
  wireAccounts();
  app.querySelectorAll(".stu").forEach(b => b.onclick = () => { SEL = b.dataset.id; render(); });
  if (cur) wireDetail(cur);
}

function detail(s) {
  const g = s.game, pl = s.placement;
  const status = r => !r.best ? `<span class="pill">Not started</span>` : r.best.ok / r.best.n >= .8 ? `<span class="pill good">Passed</span>` : `<span class="pill warn">Practicing</span>`;
  const byLesson = {}; s.review.forEach(q => byLesson[q.l] = (byLesson[q.l] || 0) + 1);
  return `
  <div class="panel">
    <div class="dhead"><span class="av">${avatarOf(s, 64)}</span>
      <div style="min-width:0"><h2>${esc(s.p.display_name || "New student")}</h2>
        <p class="muted" style="font-size:.9em">${s.p.age ? s.p.age + " years old · " : ""}${(s.p.interests || []).map(esc).join(", ") || "No interests yet"}</p></div>
      <span class="pill" style="font-size:.85em">Level ${pl ? pl.nivel : "—"}</span></div>
    <div class="kpis">
      <div class="kpi"><span class="v">🔥 ${g.streak}</span><span class="l">Day streak · best ${g.best}</span></div>
      <div class="kpi"><span class="v">${g.weekDays}/${g.goal}</span><span class="l">Days practiced this week</span></div>
      <div class="kpi"><span class="v">${s.passed}/${s.rows.length}</span><span class="l">Lessons passed</span></div>
      <div class="kpi"><span class="v">${s.avg == null ? "—" : s.avg + "%"}</span><span class="l">Average best score</span></div>
      <div class="kpi"><span class="v">${g.xp}</span><span class="l">XP · Level ${g.level} ${g.title}</span></div>
      <div class="kpi"><span class="v">${s.review.length}</span><span class="l">Questions to review</span></div>
      <div class="kpi"><span class="v">${pl ? pl.nivel : "—"}</span><span class="l">Placement ${pl ? "· " + fmt(pl.fecha + "T12:00") : "not taken"}</span></div>
      <div class="kpi"><span class="v" style="font-size:1.1em;padding-top:6px">${ago(s.updated)}</span><span class="l">Last activity</span></div>
    </div>
  </div>

  ${lessonsPanel(s)}

  <div class="panel">
    <h2>Homework</h2>
    <div class="hw">${s.hw.length ? s.hw.map(h => `<div class="hw-item">
      <div style="min-width:0"><b>${h.done_at ? "✅ " : ""}${esc(h.title)}</b>${h.details ? `<p>${esc(h.details)}</p>` : ""}
        <small>${h.done_at ? "Done " + fmt(h.done_at) : h.due ? "Due " + fmt(h.due + "T12:00") : "No due date"}${h.lesson_id ? " · Lesson " + esc(h.lesson_id) : ""}</small></div>
      <button class="btn ghost sm" data-del="${h.id}" aria-label="Delete homework">Delete</button></div>`).join("") : `<p class="empty">No homework yet.</p>`}</div>
    <form id="hwForm" style="display:grid;gap:12px;border-top:1px solid var(--line);padding-top:16px" novalidate>
      <b>Add homework</b>
      <div class="quick" id="quick">
        ${s.mine.slice(0, 6).map(l => `<button type="button" data-t="Final quiz · Lesson ${l.id} ${l.titulo}" data-d="Do the final quiz again. Goal: 18 out of 20 or more." data-l="${l.id}">Quiz L${l.id}</button>`).join("")}
        <button type="button" data-t="Practice your mistakes" data-d="Open Review and practice until the list is empty.">Review mistakes</button>
        <button type="button" data-t="10 minutes of LyricsTraining" data-d="Pick a song you like on Beginner mode.">LyricsTraining</button>
        <button type="button" data-t="Listen and repeat: My words" data-d="Open My words, listen to each word and say it out loud.">My words</button>
      </div>
      <div class="field"><label for="hwT">Title</label><input id="hwT" maxlength="140" required></div>
      <div class="field"><label for="hwD">Details <span class="muted" style="font-weight:500">(optional)</span></label><textarea id="hwD" maxlength="1000"></textarea></div>
      <div class="grid2">
        <div class="field"><label for="hwL">Lesson <span class="muted" style="font-weight:500">(optional)</span></label><select id="hwL"><option value="">None</option>${s.mine.map(l => `<option value="${l.id}">Lesson ${l.id} · ${l.titulo}</option>`).join("")}</select></div>
        <div class="field"><label for="hwDue">Due date</label><input id="hwDue" type="date"></div>
      </div>
      <div id="hwMsg" hidden></div>
      <div class="actions"><button class="btn primary" type="submit" id="hwSave">Add homework</button></div>
    </form>
  </div>

  ${classesPanel(s)}
  ${reportPanel(s)}
  ${planPanel(s)}

  <div class="panel">
    <h2>Lessons</h2>
    <div class="tbl"><table><thead><tr><th>Lesson</th><th>Sections</th><th class="r">Attempts</th><th class="r">Last</th><th class="r">Best</th><th class="r">To review</th><th>Status</th></tr></thead>
      <tbody>${s.rows.map(r => `<tr><td><b>${r.l.id}</b> · ${r.l.titulo}</td><td>${r.done}/5</td><td class="r">${r.tries}</td>
        <td class="r">${r.last ? r.last.ok + "/" + r.last.n : "—"}</td><td class="r"><b>${r.best ? Math.round(r.best.ok / r.best.n * 100) + "%" : "—"}</b></td>
        <td class="r">${byLesson[r.l.id] || 0}</td><td>${status(r)}</td></tr>`).join("")}</tbody></table></div>
  </div>

  <div class="panel">
    <h2>Questions to review <span class="muted" style="font-weight:600;font-size:.8em">· mistakes and saved questions</span></h2>
    ${s.review.length ? `<div class="miss">${s.review.slice(0, 30).map(q => `<div><span>L${esc(q.l.split(".")[0])}${q.src === "saved" ? " ★" : ""}</span><span>${esc(q.p).replace("___", `<b>${esc(q.a)}</b>`)}${/___/.test(q.p) ? "" : ` → <b>${esc(q.a)}</b>`}</span></div>`).join("")}</div>` : `<p class="empty">Nothing to review. 🎉</p>`}
  </div>`;
}

function lessonsPanel(s) {
  if (DATA.settings === null) return `<div class="panel"><h2>Lessons for this student</h2><p class="muted">To choose which lessons each student sees, run <b>supabase/student_settings.sql</b> in Supabase (SQL Editor → New query → paste → Run). Until then, every student sees every lesson.</p></div>`;
  const all = s.settings.lessons === null, on = new Set(s.settings.lessons || []);
  return `<div class="panel" id="lsPanel">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:end"><div><h2>Lessons and style</h2>
      <p class="muted" style="font-size:.9em">${all ? "Sees every lesson." : on.size ? `Sees ${on.size} lesson${on.size === 1 ? "" : "s"}.` : "<b>No lessons yet.</b> Choose what this student will see."}</p></div></div>
    <div class="field" style="max-width:360px"><label for="thSel">Style <span class="muted" style="font-weight:500">(avatar, level names and wording)</span></label>
      <select id="thSel">${Object.entries(G.THEMES).map(([k, t]) => `<option value="${k}" ${k === (s.settings.theme || "racing") ? "selected" : ""}>${esc(t.label)} · ${esc(t.titles[0])} → ${esc(t.titles[9])}</option>`).join("")}</select></div>
    <div class="seg" role="radiogroup" aria-label="Lessons this student sees">
      <label><input type="radio" name="lsMode" value="all" ${all ? "checked" : ""}> Every lesson</label>
      <label><input type="radio" name="lsMode" value="some" ${all ? "" : "checked"}> Only the ones I choose</label></div>
    <div id="lsPick" ${all ? "hidden" : ""} style="display:grid;gap:14px">
      ${G.modulos.map(m => { const ls = m.lecciones.filter(l => l.estado === "lista"); return ls.length ? `<div class="lsmod"><b>${esc(m.titulo)}</b>
        <div class="lsgrid">${ls.map(l => `<label class="lsrow"><input type="checkbox" value="${l.id}" ${on.has(l.id) ? "checked" : ""}><span class="lsdot" style="background:${l.color}"></span><span><b>${esc(l.id)}</b> · ${esc(l.titulo)}</span><span class="muted">${esc(l.nivel || "")}</span></label>`).join("")}</div></div>` : ""; }).join("")}
    </div>
    <div class="actions"><button class="btn primary" id="lsSave">Save lessons and style</button></div>
  </div>`;
}

function classesPanel(s) {
  if (DATA.classes === null) return `<div class="panel"><h2>Classes</h2><p class="muted">To schedule classes and write class notes, run the latest <b>supabase/setup.sql</b> (the “Classes” part) in Supabase.</p></div>`;
  const list = DATA.classes.filter(c => c.student_id === s.p.id).sort((a, b) => b.starts_at.localeCompare(a.starts_at));
  const ST = { scheduled: ["Scheduled", ""], attended: ["Attended", "good"], missed: ["Missed", "warn"], cancelled: ["Cancelled", ""] };
  const when = c => new Date(c.starts_at).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const d0 = new Date(); d0.setDate(d0.getDate() + 1);
  return `<div class="panel">
    <h2>Classes <span class="muted" style="font-weight:600;font-size:.8em">· schedule, attendance and notes</span></h2>
    <form id="clsForm" class="grid2" style="grid-template-columns:repeat(4,minmax(0,1fr));align-items:end" novalidate>
      <div class="field"><label for="cD">Date</label><input id="cD" type="date" value="${day(d0)}"></div>
      <div class="field"><label for="cT">Time</label><input id="cT" type="time" value="17:00"></div>
      <div class="field"><label for="cL">Lesson</label><select id="cL"><option value="">—</option>${s.mine.map(l => `<option value="${l.id}">${l.id} · ${esc(l.titulo)}</option>`).join("")}</select></div>
      <button class="btn primary" type="submit" id="cSave">Schedule class</button>
    </form>
    <div class="hw">${list.length ? list.map(c => `<div class="hw-item" style="grid-template-columns:minmax(0,1fr)">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">
        <div style="min-width:0"><b>${when(c)}</b> <span class="pill ${ST[c.status][1]}">${ST[c.status][0]}</span><br><small>${c.lesson_id ? "Lesson " + esc(c.lesson_id) : "No lesson set"}${c.notes || c.words ? " · has notes" : ""}</small></div>
        <div class="actions">${c.status !== "attended" ? `<button class="btn sm" data-st="attended" data-c="${c.id}">✓ Attended</button>` : ""}${c.status === "scheduled" ? `<button class="btn ghost sm" data-st="missed" data-c="${c.id}">Missed</button><button class="btn ghost sm" data-st="cancelled" data-c="${c.id}">Cancel</button>` : ""}
          <button class="btn ghost sm" data-open="${c.id}">${OPEN === c.id ? "Close" : "Notes"}</button><button class="btn ghost sm" data-cdel="${c.id}" aria-label="Delete class">Delete</button></div></div>
      ${OPEN === c.id ? `<div style="display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px">
        <div class="field"><label for="nN">What we did · notes for the student</label><textarea id="nN" maxlength="3000">${esc(c.notes || "")}</textarea></div>
        <div class="field"><label for="nW">New words <span class="muted" style="font-weight:500">(separate with commas)</span></label><input id="nW" maxlength="1000" value="${esc(c.words || "")}"></div>
        <div class="actions"><button class="btn primary sm" data-savenote="${c.id}">Save notes</button></div></div>` : ""}
    </div>`).join("") : `<p class="empty">No classes yet. Schedule the next one above.</p>`}</div>
  </div>`;
}
function reportPanel(s) {
  const months = [0, 1, 2].map(k => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); return day(d).slice(0, 7); });
  return `<div class="panel">
    <h2>Monthly report for parents</h2>
    <p class="muted" style="font-size:.9em">A one-page summary in Spanish (with an English button) that opens without signing in: classes, practice days, lessons, homework and your class notes.</p>
    <div class="grid2">
      <div class="field"><label for="rM">Month</label><select id="rM">${months.map(m => `<option value="${m}">${new Date(m + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</option>`).join("")}</select></div>
      <div class="field"><label for="rL">Language</label><select id="rL"><option value="es">Spanish</option><option value="en">English</option></select></div>
    </div>
    <div class="field"><label for="rC">Your comment <span class="muted" style="font-weight:500">(optional)</span></label><textarea id="rC" maxlength="600"></textarea></div>
    <div class="actions"><button class="btn primary" id="rOpen">Open report</button><button class="btn" id="rCopy">Copy link for WhatsApp</button></div>
  </div>`;
}
function planPanel(s) {
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const tops = [["pron", "Pronunciation"], ["verbs", "Verbs and tenses"], ["phr", "Phrasal verbs"], ["vocab", "Vocabulary"], ["conv", "Conversation"], ["listen", "Listening"]];
  return `<div class="panel">
    <h2>Learning plan for parents</h2>
    <p class="muted" style="font-size:.9em">A formal plan for the family, in Spanish (with an English button), that opens without signing in. It is organized by topics, with no deadlines or level promises: starting point from the placement test, what you will work on, how classes work and how progress is measured. ${s.placement ? "" : "<b>Tip:</b> generate it after the placement test so it shows his starting point."}</p>
    <div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="field"><label for="pS">Start date</label><input id="pS" type="date" value="${day(new Date())}"></div>
      <div class="field"><label for="pF">Classes per week</label><select id="pF">${[1, 2, 3, 4, 5].map(n => `<option ${n === 2 ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label for="pM">Class length</label><select id="pM">${[45, 60, 90, 120].map(n => `<option value="${n}" ${n === 60 ? "selected" : ""}>${n} minutes</option>`).join("")}</select></div>
    </div>
    <div class="field"><span style="font-weight:700;font-size:.9em">Topics to include</span>
      <div class="quick" id="pTp">${tops.map(x => `<button type="button" data-tp="${x[0]}" aria-pressed="true" class="on">${x[1]}</button>`).join("")}</div></div>
    <div class="grid2" style="align-items:end">
      <div class="field"><span style="font-weight:700;font-size:.9em">Class days <span class="muted" style="font-weight:500">(optional)</span></span>
        <div class="quick" id="pD">${days.map((d, i) => `<button type="button" data-day="${i}" aria-pressed="false">${d}</button>`).join("")}</div></div>
      <div class="field"><label for="pT">Class time</label><input id="pT" type="time" value="17:00"></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="pL">Language</label><select id="pL"><option value="es">Spanish</option><option value="en">English</option></select></div>
    </div>
    <div class="field"><label for="pC">Message for the family <span class="muted" style="font-weight:500">(optional)</span></label><textarea id="pC" maxlength="800"></textarea></div>
    <div class="actions"><button class="btn primary" id="pOpen">Open plan</button><button class="btn" id="pCopy">Copy link for WhatsApp</button></div>
  </div>`;
}
function planLink(s) {
  const v = id => document.getElementById(id).value, pl = s.placement;
  const dy = [...document.querySelectorAll("#pD [data-day]")].filter(b => b.getAttribute("aria-pressed") === "true").map(b => +b.dataset.day);
  const data = {
    v: 1, n: s.p.display_name || "Student", g: new Date().toISOString(),
    lv: pl ? pl.nivel : null, pd: pl ? pl.fecha : null, pp: pl && pl.partial ? 1 : 0, sc: pl ? (pl.secciones || []).map(x => [x.lvl, x.score]) : [],
    av: s.avatar && s.avatar.style !== "initial" ? s.avatar : undefined, ak: G.themeOf(s.theme).avatar, it: (s.p.interests || []).slice(0, 5), st: v("pS") || day(new Date()), f: +v("pF"), mn: +v("pM"), tp: [...document.querySelectorAll("#pTp [data-tp]")].filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.dataset.tp),
    dy, tm: dy.length ? v("pT") : "", ls: s.rows.map(r => [r.l.id, r.l.titulo, r.best && r.best.ok / r.best.n >= .8 ? 1 : 0]),
    c: v("pC").trim() || undefined
  };
  return location.origin + location.pathname.replace(/teacher\.html$/, "") + "plan.html?d=" + b64(data) + "&lang=" + v("pL");
}
function reportLink(s) {
  const m = document.getElementById("rM").value, lang = document.getElementById("rL").value, c = document.getElementById("rC").value.trim();
  const inM = d => d && day(d).slice(0, 7) === m;
  const g = s.get("game", null) || {}, days = Object.keys(g.days || {}).filter(k => k.slice(0, 7) === m && g.days[k] > 0).map(k => +k.slice(8, 10));
  const cls = (DATA.classes || []).filter(x => x.student_id === s.p.id && inM(x.starts_at));
  const hw = s.hw.filter(h => inM(h.created_at) || inM(h.done_at));
  const data = {
    v: 1, n: s.p.display_name || "Student", m, g: new Date().toISOString(), lv: s.placement ? s.placement.nivel : null,
    xp: s.game.xp, gl: s.game.level, st: s.game.best, bd: G.badges.earned(s.get).filter(b => b.at).length, rv: s.review.length,
    dp: days, hw: hw.length ? [hw.filter(h => h.done_at).length, hw.length] : null,
    cl: DATA.classes ? [cls.filter(x => x.status === "attended").length, cls.filter(x => x.status === "missed").length] : null,
    cd: cls.filter(x => x.status === "attended" || x.status === "scheduled").map(x => new Date(x.starts_at).getDate()),
    nt: cls.filter(x => x.status === "attended" && (x.notes || x.words)).sort((a, b) => a.starts_at.localeCompare(b.starts_at)).slice(-8)
      .map(x => [day(x.starts_at), (x.notes || "").slice(0, 280), (x.words || "").slice(0, 140)]),
    ls: s.rows.map(r => [r.l.id, r.l.titulo, r.done, r.best ? Math.round(r.best.ok / r.best.n * 100) : null, r.tries, r.best && r.best.ok / r.best.n >= .8 ? 1 : 0]),
    c: c || undefined
  };
  return location.origin + location.pathname.replace(/teacher\.html$/, "") + "progress.html?d=" + b64(data) + "&lang=" + lang;
}

function accounts() {
  const dom = (G.cloud && G.cloud.usernameDomain) || "student.lingua.app";
  const setup = `<div class="alert info" style="display:grid;gap:6px"><b>One-time setup needed</b><span>To create accounts and change passwords from here, install the small “admin-users” helper in Supabase. The steps are in the README (Teacher panel setup → Accounts helper). Until then, you can keep using Supabase → Authentication → Users.</span></div>`;
  return `<div class="panel" id="acc" style="margin-top:20px">
    <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><h2>Student accounts</h2><p class="muted" style="font-size:.9em">Create a student and change passwords. Students sign in with the username.</p></div>
      ${ACC ? `<button class="btn ghost sm" id="accReload">Refresh list</button>` : ""}</div>
    ${ACCERR && ACCERR.missing ? setup : ACCERR ? `<div class="alert bad">${esc(ACCERR.message)}</div>` : ""}
    <form id="accForm" class="grid2" style="grid-template-columns:repeat(4,minmax(0,1fr));align-items:end" novalidate>
      <div class="field"><label for="aN">Name</label><input id="aN" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="aU">Username</label><input id="aU" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="aP">Password</label><input id="aP" type="text" minlength="8" maxlength="72" autocomplete="new-password"></div>
      <button class="btn primary" type="submit" id="aSave">Create account</button>
    </form>
    <div id="aMsg" hidden></div>
    ${ACC ? `<div class="hw">${ACC.filter(u => u.id !== (G.user && G.user.id)).map(u => `<div class="hw-item">
      <div style="min-width:0"><b>${esc((u.email || "").replace("@" + dom, ""))}</b><br><small>${u.last_sign_in_at ? "Last sign-in " + ago(u.last_sign_in_at) : "Never signed in"} · created ${fmt(u.created_at)}</small></div>
      <div class="actions"><input class="pw" data-pwfor="${u.id}" type="text" placeholder="New password" aria-label="New password" style="font:inherit;padding:7px 10px;border:1px solid var(--line-2);border-radius:var(--r-s);width:150px;background:var(--surface);color:var(--ink)"><button class="btn sm" data-pw="${u.id}">Change password</button></div></div>`).join("")}</div>` : ""}
  </div>`;
}
async function loadAccounts() {
  try { ACC = (await G.admin("list")).users || []; ACCERR = null; } catch (e) { ACCERR = e; ACC = null; }
}
function wireAccounts() {
  const msg = (cls, t) => { const m = document.getElementById("aMsg"); m.className = "alert " + cls; m.textContent = t; m.hidden = false; };
  document.getElementById("accForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("aN").value.trim(), user = document.getElementById("aU").value.trim().toLowerCase(), pw = document.getElementById("aP").value;
    if (!/^[a-z0-9._-]{3,40}$/.test(user)) return msg("bad", "Username: 3–40 letters, numbers, dots or dashes (like emiliano.sanchez).");
    if (pw.length < 8) return msg("bad", "Password: at least 8 characters.");
    const b = document.getElementById("aSave"); b.disabled = true;
    try { await G.admin("create", { username: user, password: pw, display_name: name }); G.toast(`<b>Account created</b><span>Username: ${esc(user)}</span>`); await loadAccounts(); await load(); }
    catch (err) { msg("bad", err.missing ? "Install the accounts helper first (see the note above)." : "We couldn’t create it: " + err.message); if (err.missing) { ACCERR = err; } b.disabled = false; }
  });
  document.querySelectorAll("[data-pw]").forEach(b => b.onclick = async () => {
    const inp = document.querySelector(`[data-pwfor="${b.dataset.pw}"]`), pw = inp.value;
    if (pw.length < 8) { G.toast("Password: at least 8 characters"); inp.focus(); return; }
    b.disabled = true;
    try { await G.admin("password", { user_id: b.dataset.pw, password: pw }); inp.value = ""; G.toast("<b>Password changed</b><span>Share it with your student.</span>"); }
    catch (err) { G.toast("Couldn’t change it: " + esc(err.message)); }
    b.disabled = false;
  });
  const r = document.getElementById("accReload"); if (r) r.onclick = async () => { await loadAccounts(); render(); };
}

function wireDetail(s) {
  const cf = document.getElementById("clsForm");
  if (cf) cf.addEventListener("submit", async e => {
    e.preventDefault();
    const d = document.getElementById("cD").value, t = document.getElementById("cT").value || "17:00";
    if (!d) { G.toast("Choose a date"); return; }
    const b = document.getElementById("cSave"); b.disabled = true;
    try { await G.teacher.saveClass({ student_id: s.p.id, starts_at: new Date(d + "T" + t).toISOString(), lesson_id: document.getElementById("cL").value || null }); G.toast("Class scheduled"); await load(); }
    catch (err) { G.toast("Couldn’t save: " + esc(err.message)); b.disabled = false; }
  });
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await G.teacher.saveClass({ id: b.dataset.c, status: b.dataset.st }); if (b.dataset.st === "attended") OPEN = b.dataset.c; await load(); } catch (err) { G.toast("Couldn’t save: " + esc(err.message)); b.disabled = false; }
  });
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { OPEN = OPEN === b.dataset.open ? null : b.dataset.open; render(); });
  document.querySelectorAll("[data-savenote]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await G.teacher.saveClass({ id: b.dataset.savenote, notes: document.getElementById("nN").value.trim() || null, words: document.getElementById("nW").value.trim() || null }); OPEN = null; G.toast("Notes saved"); await load(); }
    catch (err) { G.toast("Couldn’t save: " + esc(err.message)); b.disabled = false; }
  });
  document.querySelectorAll("[data-cdel]").forEach(b => b.onclick = async () => {
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tap again"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "Delete"; } }, 3000); return; }
    try { await G.teacher.deleteClass(b.dataset.cdel); await load(); } catch (err) { G.toast("Couldn’t delete: " + esc(err.message)); }
  });
  document.querySelectorAll("#pD [data-day], #pTp [data-tp]").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); b.classList.toggle("on", on); });
  const po = document.getElementById("pOpen"); if (po) po.onclick = () => window.open(planLink(s), "_blank", "noopener");
  const pc = document.getElementById("pCopy"); if (pc) pc.onclick = () => {
    const url = planLink(s), msg = (document.getElementById("pL").value === "es" ? "Plan de aprendizaje de inglés de " : "English learning plan for ") + (s.p.display_name || "") + ": " + url;
    navigator.clipboard.writeText(msg).then(() => G.toast("<b>Link copied</b><span>Paste it in WhatsApp.</span>"), () => window.prompt("Copy this link:", url));
  };
  document.querySelectorAll('[name="lsMode"]').forEach(r => r.onchange = () => { document.getElementById("lsPick").hidden = document.querySelector('[name="lsMode"]:checked').value === "all"; });
  const lsS = document.getElementById("lsSave"); if (lsS) lsS.onclick = async () => {
    const all = document.querySelector('[name="lsMode"]:checked').value === "all";
    const ids = [...document.querySelectorAll("#lsPick input:checked")].map(i => i.value);
    lsS.disabled = true;
    try { await G.teacher.saveSettings({ student_id: s.p.id, lessons: all ? null : ids, theme: document.getElementById("thSel").value }); G.toast("<b>Saved</b><span>" + esc(s.p.display_name || "The student") + " will see them next time they open Lingua.</span>"); await load(); }
    catch (err) { G.toast("Couldn’t save: " + esc(err.message)); lsS.disabled = false; }
  };
  const ro = document.getElementById("rOpen"); if (ro) ro.onclick = () => window.open(reportLink(s), "_blank", "noopener");
  const rc = document.getElementById("rCopy"); if (rc) rc.onclick = () => {
    const url = reportLink(s), msg = (document.getElementById("rL").value === "es" ? "Reporte de inglés de " : "English report for ") + (s.p.display_name || "") + ": " + url;
    navigator.clipboard.writeText(msg).then(() => G.toast("<b>Link copied</b><span>Paste it in WhatsApp.</span>"), () => window.prompt("Copy this link:", url));
  };

  const f = document.getElementById("hwForm");
  document.querySelectorAll("#quick button").forEach(b => b.onclick = () => {
    document.getElementById("hwT").value = b.dataset.t; document.getElementById("hwD").value = b.dataset.d || "";
    document.getElementById("hwL").value = b.dataset.l || "";
  });
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const t = document.getElementById("hwT").value.trim(), msg = document.getElementById("hwMsg");
    if (!t) { msg.className = "alert bad"; msg.textContent = "Write a title."; msg.hidden = false; return; }
    const row = { student_id: s.p.id, title: t, details: document.getElementById("hwD").value.trim() || null, lesson_id: document.getElementById("hwL").value || null, due: document.getElementById("hwDue").value || null };
    const btn = document.getElementById("hwSave"); btn.disabled = true;
    try { await G.teacher.addHomework(row); G.toast("Homework added"); await load(); }
    catch (err) { msg.className = "alert bad"; msg.textContent = "We couldn’t add it: " + (err.message || err); msg.hidden = false; btn.disabled = false; }
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await G.teacher.deleteHomework(b.dataset.del); G.toast("Homework deleted"); await load(); } catch (err) { G.toast("Couldn’t delete: " + esc(err.message || err)); b.disabled = false; }
  });
}

async function load() {
  try { DATA = await G.teacher.load(); if (ACC === null && !ACCERR) await loadAccounts(); render(); }
  catch (e) { app.innerHTML = `<div class="panel"><h2>We couldn’t load your students</h2><p class="muted">${esc(e.message || e)}</p></div>`; }
}
G.ready.then(() => {
  if (!G.cloudEnabled) { app.innerHTML = `<div class="panel"><h2>Teacher panel</h2><p class="muted">The teacher panel needs student accounts (Supabase) to be turned on.</p></div>`; return; }
  if (!G.isTeacher) notTeacher(); else load();
});
</script>
</body>
</html>
