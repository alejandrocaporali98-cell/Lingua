const lessons = G.modulos.flatMap(m => m.lecciones), ready = lessons.filter(l => l.estado === "lista");
const fmt = d => d ? new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "—";
const ago = d => {
  if (!d) return "never";
  const s = (Date.now() - new Date(d)) / 1000;
  return s < 3600 ? "just now" : s < 86400 ? Math.round(s / 3600) + " h ago" : s < 86400 * 2 ? "yesterday" : Math.round(s / 86400) + " days ago";
};
let DATA = null, SEL = null, ACC = null, ACCERR = null, OPEN = null;
const day = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const b64 = obj => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = ""; bytes.forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

function studentOf(p) {
  const row = DATA.progress.find(x => x.user_id === p.id) || { data: {} }, d = row.data || {};
  const get = (k, def) => d[k] && "v" in d[k] ? d[k].v : def;
  const theme0 = DATA.settings ? ((DATA.settings.find(x => x.student_id === p.id) || {}).theme || "racing") : "racing";
  const game = G.game.stats(get, theme0);
  const best = l => { let t = get("attempts." + l.id, []); const s = get("score." + l.id, null); if (!t.length && s) t = [s]; return t.length ? t.reduce((a, b) => b.ok / b.n > a.ok / a.n ? b : a) : null; };
  const set = DATA.settings ? (DATA.settings.find(x => x.student_id === p.id) || { student_id: p.id, lessons: [], theme: "racing" }) : null;
  const mine = set && Array.isArray(set.lessons) ? ready.filter(l => set.lessons.includes(l.id)) : ready;
  const rows = mine.map(l => { const t = get("attempts." + l.id, []), b = best(l), s = get("score." + l.id, null); return { l, done: get("done." + l.id, []).length, tries: t.length || (s ? 1 : 0), best: b, last: t[t.length - 1] || s }; });
  const scored = rows.filter(r => r.best), avg = scored.length ? Math.round(scored.reduce((a, r) => a + r.best.ok / r.best.n, 0) / scored.length * 100) : null;
  const passed = rows.filter(r => r.best && r.best.ok / r.best.n >= .8).length;
  const review = Object.values(get("review", {}) || {});
  const hw = DATA.homework.filter(h => h.student_id === p.id), pending = hw.filter(h => !h.done_at).length, toReview = hw.filter(h => h.submitted_at && !h.reviewed_at).length;
  return { p, get, game, rows, mine, settings: set, theme: theme0, toReview, nextIdx: Math.max(0, rows.findIndex(r => !(r.best && r.best.ok / r.best.n >= .8))), avg, passed, review, hw, pending, placement: get("placement", null), avatar: get("avatar", null), updated: row.updated_at };
}
function avatarOf(s, size) {
  const name = (s.p.display_name || "?").trim();
  return s.avatar && s.avatar.style !== "initial" ? G.avatar.svg(s.avatar, size, { label: name, kind: G.themeOf(s.theme).avatar }) : `<span style="background:${s.p.avatar_color || "#2346d0"};width:100%;height:100%;display:grid;place-items:center">${esc(name[0] || "?").toUpperCase()}</span>`;
}

function notTeacher() {
  const email = (G.user && G.user.email) || "your-username@student.lingua.app";
  app.innerHTML = `<div class="page-head" style="display:grid;gap:4px"><span class="eyebrow">Teacher</span><h1>Teacher panel</h1></div>
    <div class="panel">
      <h2>This account isn’t a teacher yet</h2>
      <p class="muted">Turn on the teacher panel for <b style="color:var(--ink)">${esc(email)}</b> once: in Supabase, open <b>SQL Editor → New query</b>, paste this and press <b>Run</b>. Then reload this page.</p>
      <pre id="sql">insert into public.teachers (user_id)
select id from auth.users where email = '${esc(email)}'
on conflict do nothing;</pre>
      <div class="actions"><button class="btn" id="copy">Copy SQL</button><a class="btn ghost" href="index.html?preview=1">Preview lessons</a></div>
      <p class="muted" style="font-size:.85em">If the query says the table doesn’t exist, run the latest <b>supabase/setup.sql</b> first.</p>
    </div>`;
  document.getElementById("copy").onclick = () => navigator.clipboard.writeText(document.getElementById("sql").textContent).then(() => G.toast("SQL copied"));
}

// ── Views: #today, #students, #s/<id>/<tab>, #schedule, #billing, #accounts ──
const STYLE_ICON = k => G.avatar.svg({ style: "helmet", shell: "blue", accent: "yellow", design: "stripes", visor: "smoke", number: 7, bg: "fog" }, 26, { kind: G.themeOf(k).avatar, label: G.themeOf(k).label });
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONEY = (n, cur) => (cur || "MXN") + " " + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const monthKey = d => day(d).slice(0, 7);
const monthName = m => new Date(m + "-15").toLocaleDateString("en-US", { month: "long", year: "numeric" });
function students() {
  const staff = new Set((DATA.staff || []).map(x => x.user_id));
  return DATA.profiles.filter(p => p.id !== (G.user && G.user.id) && !staff.has(p.id)).map(studentOf).sort((a, b) => (a.p.display_name || "").localeCompare(b.p.display_name || ""));
}
function nextClass(id) {
  const now = Date.now() - 3600e3;
  return (DATA.classes || []).filter(c => c.student_id === id && c.status === "scheduled" && new Date(c.starts_at) >= now).sort((a, b) => a.starts_at.localeCompare(b.starts_at))[0] || null;
}
const when = c => new Date(c.starts_at).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
const hhmm = d => new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const adminOf = id => (DATA.admin || []).find(a => a.student_id === id) || { student_id: id, notes: "", billing: "per_class", rate: 0, currency: "MXN", phone: null, parent_phone: null };
let Q = "";

// Start a class: mark the scheduled class as attended (if there is one) and open the student's lesson
async function startClass(s, c, opt) {
  opt = opt || {};
  const near = c || (DATA.classes || []).find(x => x.student_id === s.p.id && x.status === "scheduled" && Math.abs(new Date(x.starts_at) - Date.now()) < 3 * 3600e3);
  if (near) { try { await G.teacher.saveClass({ id: near.id, status: "attended" }); } catch (e) {} }
  const l = near && near.lesson_id ? lessons.find(x => x.id === near.lesson_id) : opt.lesson || null;
  let go = (l && l.archivo) || (document.getElementById("scL") && document.getElementById("scL").value) || (s.mine[s.nextIdx] || {}).archivo || "index.html";
  if (opt.present && /^clases\//.test(go)) go += "?present=1";
  G.actAs({ id: s.p.id, name: s.p.display_name || "Student" }, go);
}

// Recurring classes: keep the next 14 days filled in
async function fillFromRules() {
  if (!DATA.rules || !DATA.classes) return false;
  const want = [], now = new Date();
  DATA.rules.filter(r => r.active).forEach(r => {
    for (let k = 0; k < 14; k++) {
      const d = new Date(now); d.setDate(now.getDate() + k);
      if (d.getDay() !== r.weekday) continue;
      const [hh, mm] = r.time.split(":").map(Number); d.setHours(hh, mm, 0, 0);
      if (d < now) continue;
      const exists = DATA.classes.some(c => c.student_id === r.student_id && Math.abs(new Date(c.starts_at) - d) < 60e3);
      if (!exists) want.push({ student_id: r.student_id, starts_at: d.toISOString(), rule_id: r.id });
    }
  });
  if (!want.length) return false;
  try { await G.teacher.insert("classes", want); return true; } catch (e) { console.warn(e); return false; }
}

// ── Ghost of the page while the data loads ──
function skeleton(view) {
  const b = (w, h, extra) => `<i class="sk ${extra || ""}" style="width:${w};height:${h}px"></i>`;
  const row = (i) => `<div class="sk-row">${b("40px", 40, "sk-c")}<div class="grow">${b(["46%", "58%", "38%", "52%", "44%"][i % 5], 12)}${b(["70%", "62%", "80%", "66%", "74%"][i % 5], 10)}</div>${b("72px", 32)}</div>`;
  const head = `<div class="adm-top"><div style="display:grid;gap:10px">${b("170px", 26)}${b("230px", 12)}</div>${b("84px", 32)}</div>`;
  const card = (inner, t) => `<div class="card">${b(t || "38%", 16)}${inner}</div>`;
  const rows = n => Array.from({ length: n }, (_, i) => row(i)).join("");
  let body;
  if (view === "today") body = `<div class="kpis">${[0, 1, 2, 3].map(() => `<div class="card">${b("55%", 11)}${b("40%", 28)}${b("100%", 26)}</div>`).join("")}</div>
    <div class="dgrid">${card(rows(3), "42%")}${card(`<div class="sk-bars">${[60, 35, 80, 50, 95, 30, 45].map(h => b("auto", h)).join("")}</div>`, "30%")}
      ${card([78, 64, 90, 55, 70].map(w => `<div class="sk-row">${b("64px", 12)}${b(w + "%", 10)}</div>`).join(""), "50%")}${card(rows(2), "28%")}</div>`;
  else if (view === "students") body = `<div class="sk-row">${["56px", "88px", "96px", "86px", "70px"].map(w => b(w, 32)).join("")}</div>${card(rows(5), "26%")}`;
  else if (view === "schedule") body = card(`<div class="sk-bars" style="height:240px">${[0, 1, 2, 3, 4, 5, 6].map(() => b("auto", 240)).join("")}</div>`, "24%");
  else if (view === "reports") body = `<div class="kpis">${[0, 1, 2, 3].map(() => `<div class="card">${b("55%", 11)}${b("40%", 28)}</div>`).join("")}</div>${card(`<div class="sk-bars" style="height:150px">${[70, 110, 50, 130, 90].map(h => b("auto", h)).join("")}</div>`, "30%")}${card(rows(4), "34%")}`;
  else body = card(rows(4), "30%") + card(rows(3), "40%");
  return `<div class="skl" aria-busy="true" aria-label="Loading">${head}${body}</div>`;
}
function viewOfHash() { const h = (location.hash || "#today").slice(1).split("/")[0]; return h === "s" ? "student" : (["today", "students", "schedule", "reports", "billing", "accounts"].includes(h) ? h : "today"); }
{ const v = viewOfHash(); app.innerHTML = skeleton(v); document.getElementById("mtitle").textContent = v[0].toUpperCase() + v.slice(1);
  document.querySelectorAll("#admNav [data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === v)); }

function render() {
  const h = (location.hash || "#today").slice(1).split("/");
  const v = h[0] === "s" ? "students" : (["today", "students", "schedule", "reports", "billing", "accounts"].includes(h[0]) ? h[0] : "today");
  document.querySelectorAll("#admNav [data-v]").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  document.getElementById("mtitle").textContent = h[0] === "s" ? "Student" : v[0].toUpperCase() + v.slice(1);
  const me = G.profile || {}; document.getElementById("me").innerHTML = `<b>${esc(me.display_name || G.maestroNombre || "Teacher")}</b><small>Teacher</small>`;
  if (h[0] === "s" && h[1]) { const s = students().find(x => x.p.id === h[1]); if (s) { SEL = s.p.id; return studentView(s, h[2] || "overview"); } }
  if (v === "students") return listView();
  if (v === "schedule") return scheduleView();
  if (v === "billing") return billingView(h[1], h[2], h[3]);
  if (v === "reports") return reportsView(h[1], h[2]);
  if (v === "accounts") return accountsView();
  return todayView();
}
function topBar(title, sub, actions) {

}

// ── Alerts and activity ──
function alertsOf(s) {
  const out = [], today = day(new Date()), d = s.updated ? Math.floor((Date.now() - new Date(s.updated)) / 864e5) : null;
  if (!s.mine.length) out.push(["warn", "No lessons assigned", "lessons"]);
  if (s.mine.length && (d === null || d >= 7)) out.push(["warn", d === null ? "Hasn’t signed in yet" : `No activity in ${d} days`, "overview"]);
  s.hw.filter(h => !h.done_at && h.due && h.due < today).forEach(h => out.push(["bad", `Homework overdue: ${h.title}`, "homework"]));
  s.hw.filter(h => h.submitted_at && !h.reviewed_at).forEach(h => out.push(["warn", `Homework to review: ${h.title}`, "homework"]));
  s.rows.filter(r => r.last && r.last.ok / r.last.n < .8 && !(r.best && r.best.ok / r.best.n >= .8)).forEach(r => out.push(["bad", `Lesson ${r.l.id}: last quiz ${Math.round(r.last.ok / r.last.n * 100)}%`, "overview"]));
  if (s.review.length >= 10) out.push(["warn", `${s.review.length} questions to review`, "overview"]);
  const m = monthKey(new Date()), missed = (DATA.classes || []).filter(c => c.student_id === s.p.id && c.status === "missed" && monthKey(c.starts_at) === m).length;
  if (missed >= 2) out.push(["warn", `Missed ${missed} classes this month`, "classes"]);
  if (!s.placement && s.mine.length) out.push(["info", "Placement test not taken", "overview"]);
  return out;
}
function activityOf(s) {
  const ev = [], get = s.get, name = (s.p.display_name || "").split(" ")[0];
  s.rows.forEach(r => (get("attempts." + r.l.id, []) || []).forEach(a => a.at && ev.push([a.at, `${a.ok / a.n >= .8 ? "passed" : "took"} the final quiz of <b>${esc(r.l.titulo)}</b> · ${Math.round(a.ok / a.n * 100)}%`, a.ok / a.n >= .8 ? "good" : ""])));
  s.hw.filter(h => h.done_at).forEach(h => ev.push([h.done_at, `finished homework <b>${esc(h.title)}</b>`, "good"]));
  const pl = s.placement; if (pl && pl.fecha) ev.push([pl.fecha + "T12:00:00", `took the placement test · ${esc(pl.nivel)}`, ""]);
  (G.badges ? G.badges.earned(get, s.theme) : []).filter(b => b.at).forEach(b => ev.push([b.at, `earned the badge <b>${esc(b.t)}</b>`, ""]));
  (DATA.classes || []).filter(c => c.student_id === s.p.id && c.status === "attended").forEach(c => ev.push([c.starts_at, `had a class with you`, ""]));
  return ev.map(e => ({ at: e[0], html: `<b>${esc(name)}</b> ${e[1]}`, cls: e[2], s }));
}
const agoShort = d => { const m = (Date.now() - new Date(d)) / 6e4; return m < 60 ? Math.max(1, Math.round(m)) + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d"; };

function todayView() {
  const list = students(), byId = Object.fromEntries(list.map(s => [s.p.id, s])), now = Date.now(), t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const t1 = new Date(t0); t1.setDate(t1.getDate() + 1);
  const cls = (DATA.classes || []).filter(c => byId[c.student_id] && c.status !== "cancelled");
  const today = cls.filter(c => new Date(c.starts_at) >= t0 && new Date(c.starts_at) < t1).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const upcoming = cls.filter(c => c.status === "scheduled" && new Date(c.starts_at) >= now - 3600e3).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
  const ST = { scheduled: ["Scheduled", ""], attended: ["Done", "good"], missed: ["Missed", "warn"] };

// ── Billing ──
function billOf(s, m) {
  const a = adminOf(s.p.id), cls = (DATA.classes || []).filter(c => c.student_id === s.p.id && monthKey(c.starts_at) === m);
  const attended = cls.filter(c => c.status === "attended").length, scheduled = cls.filter(c => c.status === "scheduled").length;
  const due = a.billing === "free" ? 0 : a.billing === "monthly" ? Number(a.rate) : attended * Number(a.rate);
  const paid = (DATA.payments || []).filter(p => p.student_id === s.p.id && p.month === m).reduce((t, p) => t + Number(p.amount), 0);
  const status = a.billing === "free" ? ["Free", ""] : due === 0 && paid === 0 ? ["—", ""] : paid >= due ? ["Paid", "good"] : paid > 0 ? ["Partial", "warn"] : ["Pending", "bad"];
  return { a, attended, scheduled, due, paid, status };
}
// ── Billing: overview, payments with transfer screenshots, payment slips, bank details ──
// (the same things the office panel does; documents for families stay in Spanish)
const METHOD = { transfer: "Transfer", cash: "Cash", deposit: "Deposit", card: "Card", other: "Other" };

const esMonth = (m, o) => new Date(m + "-15T12:00").toLocaleDateString("es-MX", o || { month: "long", year: "numeric" });
const esMoney = (n, cur) => "$" + Number(n || 0).toLocaleString("es-MX", { maximumFractionDigits: 2 }) + ((cur || "MXN") === "MXN" ? "" : " " + cur);
const esDate = d => new Date(String(d).length === 10 ? d + "T12:00" : d).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
const ICO = (d, sz) => `<svg width="${sz || 15}" height="${sz || 15}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const fullMonths = (n, from) => Array.from({ length: n }, (_, k) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (from || 0) - k); return monthKey(d); });
const monthOpts = (m, n) => fullMonths(n || 8, 1).map(k => `<option value="${k}" ${k === m ? "selected" : ""}>${monthName(k)}</option>`).join("");

// What to charge: monthly fee, or every class of the month (taken + still scheduled) for per-class plans
function suggestedPay(s, m) {
  const b = billOf(s, m), a = b.a;
  if (a.billing === "free") return { amount: 0, k: 0, how: "Free plan" };
  if (a.billing === "monthly") return { amount: Math.max(0, Number(a.rate) - b.paid), k: b.attended + b.scheduled, how: "Monthly fee " + MONEY(a.rate, a.currency) + (b.paid ? " − paid " + MONEY(b.paid, a.currency) : "") };
  const k = b.attended + b.scheduled; return { amount: Math.max(0, k * Number(a.rate) - b.paid), k, how: `${k} class${k === 1 ? "" : "es"} × ${MONEY(a.rate, a.currency)}` + (b.paid ? " − paid " + MONEY(b.paid, a.currency) : "") };
}

async function loadAccounts() {
  try { ACC = (await G.admin("list")).users || []; ACCERR = null; } catch (e) { ACCERR = e; ACC = null; }
}
function wireAccounts() {
  const msg = (cls, t) => { const m = document.getElementById("aMsg"); m.className = "alert " + cls; m.textContent = t; m.hidden = false; };
  document.getElementById("accForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = document.getElementById("aN").value.trim(), user = document.getElementById("aU").value.trim().toLowerCase(), pw = document.getElementById("aP").value;
    if (!/^[a-z0-9._-]{3,40}$/.test(user)) return msg("bad", "Username: 3–40 letters, numbers, dots or dashes (like emiliano.sanchez).");
    if (pw.length < 8) return msg("bad", "Password: at least 8 characters.");
    const b = document.getElementById("aSave"); b.disabled = true;
    const office = document.getElementById("aR").value === "admin";
    if (office && DATA.staff === null) { b.disabled = false; return msg("bad", "First run supabase/v4.sql in Supabase (SQL Editor), then create the office account."); }
    try {
      const res = await G.admin("create", { username: user, password: pw, display_name: name, theme: document.getElementById("aT").value });
      if (office) {
        const id = res && res.user && res.user.id;
        try { await G.teacher.insert("staff", [{ user_id: id, role: "admin" }]); await G.teacher.removeBy("student_settings", "student_id", id); }
        catch (e2) { msg("bad", "The account was created but couldn’t be made an office account: " + e2.message); await loadAccounts(); await load(); return; }
        G.toast(`<b>Office account created</b><span>Username: ${esc(user)} · opens the office panel in Spanish</span>`);
      } else G.toast(`<b>Account created</b><span>Username: ${esc(user)} · now assign their lessons</span>`);
      await loadAccounts(); await load();
    }
    catch (err) { msg("bad", err.missing ? "Install the accounts helper first (see the note above)." : "We couldn’t create it: " + err.message); if (err.missing) { ACCERR = err; } b.disabled = false; }
  });
  const ar = document.getElementById("aR"); if (ar) ar.onchange = () => { document.getElementById("aTBox").hidden = ar.value === "admin"; };
  const gen = document.getElementById("aGen"); if (gen) gen.onclick = () => { const w = ["river", "piano", "rocket", "tiger", "camera", "garden", "planet", "guitar", "saddle", "summit"], n = () => w[Math.floor(Math.random() * w.length)]; document.getElementById("aP").value = n() + "-" + n() + "-" + (10 + Math.floor(Math.random() * 90)); };
  document.querySelectorAll("[data-pw]").forEach(b => b.onclick = async () => {
    const inp = document.querySelector(`[data-pwfor="${b.dataset.pw}"]`), pw = inp.value;
    if (pw.length < 8) { G.toast("Password: at least 8 characters"); inp.focus(); return; }
    b.disabled = true;
    try { await G.admin("password", { user_id: b.dataset.pw, password: pw }); inp.value = ""; G.toast("<b>Password changed</b><span>Share it with your student.</span>"); }
    catch (err) { G.toast("Couldn’t change it: " + esc(err.message)); }
    b.disabled = false;
  });
  const r = document.getElementById("accReload"); if (r) r.onclick = async () => { await loadAccounts(); render(); };
}

    catch (err) { msg.className = "alert bad"; msg.textContent = "We couldn’t add it: " + (err.message || err); msg.hidden = false; btn.disabled = false; }
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await G.teacher.deleteHomework(b.dataset.del); G.toast("Homework deleted"); await load(); } catch (err) { G.toast("Couldn’t delete: " + esc(err.message || err)); b.disabled = false; }
  });
}

async function load() {
  try {
    DATA = await G.teacher.load();
    if (await fillFromRules()) DATA = await G.teacher.load();
    if (ACC === null && !ACCERR) await loadAccounts();
    const firstPaint = !!app.querySelector(".skl"); render();
    if (firstPaint) { app.classList.add("fade-in"); setTimeout(() => app.classList.remove("fade-in"), 600); }
  }
  catch (e) { app.innerHTML = `<div class="panel"><h2>We couldn’t load your students</h2><p class="muted">${esc(e.message || e)}</p></div>`; }
}
G.ready.then(() => {
  if (!G.cloudEnabled) { app.innerHTML = `<div class="panel"><h2>Teacher panel</h2><p class="muted">The teacher panel needs student accounts (Supabase) to be turned on.</p></div>`; return; }
  if (!G.isTeacher) notTeacher(); else load();
});
</script>
</body>
</html>
