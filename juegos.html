<script>
(function () {

  const id = new URLSearchParams(location.search).get("l") || "";
  const lessonMeta = G.modulos.flatMap(m => m.lecciones).find(l => l.id === id);
  let C = null;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const me = () => (G.actingAs && G.actingAs.name) || (G.profile && G.profile.display_name) || ((G.store.get("profileLocal", {}) || {}).display_name) || "Student";
  const first = s => String(s || "").split(/\s+/)[0];
  const teacher = () => first(G.maestro || "Teacher");
  const ICON = { helmet: '<path d="M4 15a8 8 0 0 1 16 0v3H4z"/><path d="M12 11h8"/>', guitar: '<circle cx="9" cy="15" r="5"/><path d="M12.5 11.5L20 4M18 3l3 3"/>', clapper: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 9l1.5-5h15L21 9M9 4L7.5 9M15 4l-1.5 5"/>', riding: '<path d="M7 20v-8a5 5 0 0 1 10 0v8"/><path d="M5 20h4M15 20h4"/>', briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/>' };
  const myIcon = () => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[(G.style && G.style.avatar) || "helmet"] || ICON.helmet}</svg>`;
  const xp = (n, label) => { if (n > 0 && G.game) G.game.award(n, { label }); };
  const win = () => { G.confetti && G.confetti(); G.sfx && G.sfx("win"); };

  // ── Questions built from the lesson ──
  const gapQ = p => esc(p).replace("___", '<span class="gap">___</span>');

    say: () => ((C.translate && C.translate.items) || []).map(t => ({ cat: "Say it", q: t.cue ? esc(t.cue) : `<span lang="es">${esc(t.es)}</span>`, a: t.en })),

    const svg = box.querySelector("svg"), arc = box.querySelector(".arc"), tx = box.querySelector("text");
    const draw = () => { const m = Math.floor(left / 60), s = String(left % 60).padStart(2, "0"); arc.style.strokeDasharray = `${(CIRC * left / secs).toFixed(1)}px ${CIRC.toFixed(1)}px`; tx.textContent = `${m}:${s}`; svg.setAttribute("aria-label", `${left} seconds left`); box.classList.toggle("hurry", !!t && left > 0 && left <= 10); };

  // ── Jeopardy ──
  function jeopardy() {
    const cats = categories(); let score = 0, open = null, just = null, shown = 0, panel = "", firstDraw = true; const used = {};
    const total = cats.reduce((t, c) => t + c.items.length, 0);
    function draw() {
      const left = total - Object.keys(used).length;
      bar("Jeopardy", `<span class="sc"><i style="background:var(--jeo)">${esc(first(me())[0] || "Y")}</i>${esc(first(me()))} <b style="color:var(--gold)" id="jScore">${shown}</b></span><span style="font-size:.85em;color:#8b95a9;font-weight:700">${left} left</span>`);

  // ── Spin the wheel ──
  function wheel() {
    bar("Spin the wheel", "");
    const all = shuffle(prompts()), qs = all.slice(0, Math.min(6, all.length)), n = qs.length;
    if (n < 2) { app.innerHTML = `<p class="empty2">This lesson doesn’t have conversation questions yet.</p>`; return; }
    const cols = n % 2 ? ["#6d28d9", "#f5c518", "#ffffff"] : ["#6d28d9", "#f5c518", "#7c3aed", "#ffffff", "#5b21b6", "#c4b5fd"], dark = c => /^#(6d|7c|5b)/.test(c);
    const seg = 360 / n, R = 228, short = s => { const w = s.replace(/[?.!]$/, "").split(" "); let o = ""; for (const x of w) { if ((o + " " + x).trim().length > 20) break; o = (o + " " + x).trim(); } return o + (o.length < s.length - 1 ? "…" : ""); };

    app.innerHTML = `<div class="two" style="--side:minmax(320px,520px)">
      <div class="wheelbox" id="wBox"><svg class="wh" viewBox="0 0 480 480" role="img" aria-label="Question wheel"><g class="rot" id="rot">${paths}</g><circle cx="240" cy="240" r="62" fill="#0b0f19"/></svg>
        <svg class="ptr" viewBox="0 0 44 50" aria-hidden="true"><path d="M22 48 L4 8 Q22 -2 40 8 Z" fill="#f5c518" stroke="#0b0f19" stroke-width="4"/></svg>
        <button type="button" class="spin" id="spin">SPIN</button></div>
      <section class="blk" style="background:var(--whl)" id="wPanel"><span class="eb" style="color:var(--gold)">Warm-up</span><p class="bigq">Spin the wheel to get your question.</p><p class="sub2">Talk for one minute. Your teacher helps with words as you go.</p></section></div>`;
    enter(true); setTimeout(() => enter(false), 1200);
    const sp = document.getElementById("spin"), g = document.getElementById("rot"), box = document.getElementById("wBox");
    sp.onclick = () => {
      if (timer) timer.pause();
      let i; do { i = Math.floor(Math.random() * n); } while (n > 1 && i === chosen); chosen = i;
      const target = -(i * seg + seg / 2), delta = ((target - rot) % 360 + 360) % 360; rot += 360 * 5 + delta;
      g.style.transform = `rotate(${rot}deg)`; sp.disabled = true; box.classList.add("spinning"); setTimeout(() => box.classList.remove("spinning"), 3400); G.sfx && G.sfx("ok");

        <div class="tring"><span id="wT"></span><div class="chips2">${helpers().map(h => `<span class="chip2">${esc(h)}</span>`).join("")}</div></div>
        <div class="acts"><button type="button" class="pill" id="wP">Pause</button><button type="button" class="pill w" id="wD">Done · spin again</button></div>`;
      timer = countdown(document.getElementById("wT"), 60, "#f5c518"); timer.start(); stopAll = () => timer && timer.pause();
      document.getElementById("wP").onclick = e => { if (timer.running) { timer.pause(); e.target.textContent = "Resume"; } else { timer.start(); e.target.textContent = "Pause"; } };
      document.getElementById("wD").onclick = () => { timer.pause(); done++; xp(5, "Spin the wheel"); sp.focus(); sp.click(); };
    }
  }

  // ── Just a Minute ──
  function minute() {
    const topics = shuffle(prompts()); let ti = 0, calls = { h: 0, r: 0, d: 0 }, runStart = null, best = 0, timer = null;

          <div class="acts"><button type="button" class="pill w" id="mGo">Start</button><button type="button" class="pill" id="mNew">New topic</button><button type="button" class="pill" id="mFin">Finish round</button></div></section>
        <aside style="display:flex;flex-direction:column;gap:12px"><span class="eb" style="color:#8b95a9;padding:4px 4px 0">Call it</span>
          ${[["h", "Hesitation", "Long pause or “ehh…”"], ["r", "Repetition", "Same word twice"], ["d", "Deviation", "Wandered off topic"]].map(([k, t, d], j) => `<button type="button" class="call" style="--d:${j + 2}" data-c="${k}"><span><b>${t}</b><small>${d}</small></span><span class="n" id="n${k}">${calls[k]}</span></button>`).join("")}
          <div class="pnl2" style="margin-top:auto;padding:18px 20px;display:grid;gap:2px;--d:5"><span style="font-size:.85em;color:#8b95a9;font-weight:700">Longest run this round</span><b style="font-size:2.1em" id="mBest">${best} s</b></div></aside></div>`;
      enter(true); const te = setTimeout(() => enter(false), 1000);
      timer = countdown(document.getElementById("mT"), 60, "#fff", finish); stopAll = () => { timer.pause(); clearTimeout(te); };
      const goBtn = document.getElementById("mGo");
      goBtn.onclick = () => { if (timer.running) { timer.pause(); goBtn.textContent = "Resume"; document.getElementById("mMsg").textContent = "Paused"; } else { if (runStart == null) runStart = 60 - timer.left; timer.start(); goBtn.textContent = "Pause"; document.getElementById("mMsg").textContent = "Keep talking!"; replay(document.getElementById("mMsg"), "n"); replay(document.getElementById("mMsg"), "bump"); } };
      document.getElementById("mNew").onclick = () => { timer.pause(); ti++; calls = { h: 0, r: 0, d: 0 }; runStart = null; best = 0; draw(); };
      document.getElementById("mFin").onclick = finish;
      app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
        if (runStart == null) return;
        best = Math.max(best, runNow()); runStart = 60 - timer.left; calls[b.dataset.c]++;
        const nn = document.getElementById("n" + b.dataset.c); nn.textContent = calls[b.dataset.c]; replay(nn, "bump"); document.getElementById("mBest").textContent = best + " s";
        replay(b, "hit"); setTimeout(() => b.classList.remove("hit"), 900); G.sfx && G.sfx("bad");
      });
      goBtn.focus();
    }
    function finish() {
      timer.pause(); enter(false); best = Math.max(best, runNow());
      const rec = best > record; if (rec) G.store.set("jam.best", best);
      const gain = Math.round(best / 2) + 5; xp(gain, "Just a Minute"); if (best >= 30) win();
      app.innerHTML = `<div class="over pnl2"><span class="eb" style="color:#fecdd3">Longest run</span><h2><span id="fin">0</span> seconds${rec ? " · new record!" : ""}</h2><p class="sub2">Hesitations ${calls.h} · Repetitions ${calls.r} · Deviations ${calls.d} · +${gain} XP</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="pill w" id="again">Next topic</button><button type="button" class="pill" id="back">Other games</button></div></div>`;
      tickTo(document.getElementById("fin"), best, 0);
      document.getElementById("again").onclick = () => { ti++; calls = { h: 0, r: 0, d: 0 }; runStart = null; best = 0; draw(); };
      document.getElementById("back").onclick = () => go("");
    }
    if (!topics.length) { app.innerHTML = `<p class="empty2">This lesson doesn’t have topics yet.</p>`; return; }
    draw();
  }

  // ── Tic-tac-toe ──
  function ttt() {
    const pool = shuffle(POOL.fix().concat(POOL.phrases(), POOL.words(), POOL.say(), POOL.quiz()));
    if (pool.length < 9) { app.innerHTML = `<p class="empty2">This lesson doesn’t have enough questions for Tic-tac-toe yet.</p>`; return; }
    let board, qs, open, reveal, just = null, firstDraw = true, panel = "", wins = { s: 0, t: 0 }, used = 0;
    const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    function reset() { board = Array(9).fill(null); qs = []; for (let i = 0; i < 9; i++) qs.push(pool[(used + i) % pool.length]); used += 9; open = null; reveal = false; just = null; firstDraw = true; draw(); }
    const winner = () => { for (const l of LINES) if (board[l[0]] && board[l[0]] === board[l[1]] && board[l[1]] === board[l[2]]) return { p: board[l[0]], l }; return board.every(Boolean) ? { p: "draw", l: [] } : null; };
    function draw() {
      const S = esc(first(me())), T = esc(teacher()), w = winner();
      bar("Tic-tac-toe", `<span class="sc"><i style="background:var(--ttt)">${S[0] || "Y"}</i>${S} <b>${wins.s}</b></span><span class="sc"><i style="background:var(--gold);color:#0b0f19">${T[0]}</i>${T} <b>${wins.t}</b></span>`);
      const q = open != null ? qs[open] : null;
      app.innerHTML = `<div class="two" style="--side:minmax(320px,440px)">
        <div class="tgrid">${board.map((b, i) => { const x = `${w && w.l.includes(i) ? "win" : just === i ? "just" : ""}" style="--d:${i}"`; return b === "s" ? `<div class="cell s ${x} aria-label="${S}">${myIcon()}</div>` : b === "t" ? `<div class="cell t ${x} aria-label="${T}">${T[0]}</div>` : `<button type="button" class="cell o ${open === i ? "on" : ""}" style="--d:${i}" data-c="${i}" ${w ? "disabled" : ""}>${esc(qs[i].cat)}</button>`; }).join("")}</div>
        <section class="blk" id="tPanel" style="background:var(--ttt)">${w ? `<span class="eb" style="color:#99f6e4">Game over</span><p class="bigq">${w.p === "draw" ? "It’s a draw!" : (w.p === "s" ? S : T) + " wins!"}</p><div class="acts"><button type="button" class="pill w" id="tNew">New game</button><button type="button" class="pill" id="tBack">Other games</button></div>`
          : q ? `<span class="eb" style="color:#99f6e4">${S}’s turn · ${esc(q.cat)}</span><p class="bigq">${q.q}</p><p class="sub2">Right: ${S} takes the square. Wrong: it goes to ${T}.</p>
            <div class="ans ${reveal ? "show" : "hid"}">${reveal ? esc(q.a) : "Answer hidden until they try"}</div>
            <div class="acts"><button type="button" class="pill" id="tRev" ${reveal ? "disabled" : ""}>Reveal</button><button type="button" class="pill w" id="tS">✓ Right</button><button type="button" class="pill y" id="tT">✗ Wrong</button></div>`
          : `<span class="eb" style="color:#99f6e4">Your turn</span><p class="bigq">Pick a square.</p><p class="sub2">Each square hides a question from this lesson.</p>`}</section></div>`;
      enter(firstDraw); firstDraw = false;
      const pk = w ? "over" : open != null ? "q" + open : "idle"; if (pk !== panel) { panel = pk; replay(document.getElementById("tPanel"), "fresh"); }
      app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { open = +b.dataset.c; reveal = false; just = null; G.sfx && G.sfx("pop"); draw(); });
      const rv = document.getElementById("tRev"); if (rv) rv.onclick = () => { reveal = true; draw(); };
      const take = who => { board[open] = who; just = open; open = null; reveal = false; G.sfx && G.sfx(who === "s" ? "ok" : "bad"); const r = winner(); if (r && r.p !== "draw") { wins[r.p]++; if (r.p === "s") { xp(20, "Tic-tac-toe win"); win(); } } draw(); };
      const s = document.getElementById("tS"); if (s) s.onclick = () => take("s");
      const t = document.getElementById("tT"); if (t) t.onclick = () => take("t");
      const nw = document.getElementById("tNew"); if (nw) nw.onclick = reset;
      const bk = document.getElementById("tBack"); if (bk) bk.onclick = () => go("");
    }
    reset();
  }

  // ── Race track ──
  function race() {
    const qs = mcq(); if (qs.length < 4) { app.innerHTML = `<p class="empty2">This lesson doesn’t have enough quiz questions for the race yet.</p>`; return; }
    const GOAL = 13; let pos = { s: 1, t: 1 }, streak = 0, qi = 0, answered = null, right = 0, moved = null, boost = false, newDot = -1, firstDraw = true;
    const S = esc(first(me())), T = esc(teacher());
    const lane = (k, name, color, icon) => `<div class="lane"><span class="who"><i style="background:${color}"></i>${name}</span><div class="road ${boost && k === "s" ? "boost" : ""}">${Array.from({ length: GOAL }, (_, j) => { const n = j + 1, d = `--d:${j}`; if (n === GOAL) return pos[k] >= GOAL ? `<div class="sq flag car" style="box-shadow:0 0 0 4px ${color};${d}"></div>` : `<div class="sq flag" style="${d}" aria-label="Finish"></div>`; return n === pos[k] ? `<div class="sq car ${moved === k ? "moved" : ""}" style="background:${color};${d}" aria-label="${name} at square ${n}">${icon}</div>` : `<div class="sq" style="${d};${n < pos[k] ? `background:${color};opacity:.35` : ""}">${n}</div>`; }).join("")}</div></div>`;
    function draw() {
      bar("Race track", `<span style="font-size:.88em;color:#8b95a9;font-weight:700">Right = +1 · 3 in a row = <b style="color:var(--gold)">boost +2</b></span>`);
      const q = qs[qi % qs.length], over = pos.s >= GOAL || pos.t >= GOAL;
      app.innerHTML = `<div style="display:grid;gap:20px">
        <div style="display:grid;gap:10px">${lane("s", S, "#2346d0", myIcon())}${lane("t", T, "#c2410c", `<b style="font-size:1.3em">${T[0]}</b>`)}</div>
        ${over ? `<div class="over pnl2"><span class="eb" style="color:var(--gold)">Finish!</span><h2>${pos.s >= GOAL ? S + " wins the race!" : T + " wins this time"}</h2><p class="sub2">${right} right answers · +${right * 5 + (pos.s >= GOAL ? 30 : 0)} XP</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" class="pill w" id="rAgain">Race again</button><button type="button" class="pill" id="rBack">Other games</button></div></div>`
        : `<div class="two" style="--side:minmax(240px,300px)">
          <section class="blk ${answered == null ? "fresh" : ""}" style="background:var(--race)"><span class="eb" style="color:#fed7aa">Question ${qi + 1}</span><p class="bigq" style="font-size:clamp(1.3em,2.4vw,2em)">${q.q}</p>
            <div class="opts2">${q.opts.map((o, k) => `<button type="button" class="opt ${answered != null ? (o === q.a ? "ok" : k === answered ? "bad" : "") : ""}" data-o="${k}" ${answered != null ? "disabled" : ""}><i>${k + 1}</i>${esc(o)}</button>`).join("")}</div>
            ${answered != null ? `<div class="acts"><button type="button" class="pill w" id="rNext">Next question</button></div>` : ""}</section>
          <aside class="pnl2" style="padding:22px;display:flex;flex-direction:column;gap:12px"><span class="eb" style="color:#8b95a9">Streak</span><div class="streak">${[0, 1, 2].map(k => `<i class="${k < streak ? "on" : ""} ${k === newDot ? "new" : ""}"></i>`).join("")}</div><p class="sub2">${streak >= 2 ? "One more for a boost!" : "Three right in a row = +2 squares."}</p><div style="margin-top:auto"><span style="font-size:.85em;color:#8b95a9;font-weight:700">Prize</span><b style="display:block;font-size:1.4em;color:var(--gold)">+30 XP for the win</b></div></aside></div>`}</div>`;
      enter(firstDraw); firstDraw = false;
      app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => answer(+b.dataset.o));
      const nx = document.getElementById("rNext"); if (nx) { nx.onclick = () => { qi++; answered = null; moved = null; boost = false; newDot = -1; draw(); }; nx.focus(); }
      const ag = document.getElementById("rAgain"); if (ag) ag.onclick = race;
      const bk = document.getElementById("rBack"); if (bk) bk.onclick = () => go("");
    }
    function answer(k) {
      const q = qs[qi % qs.length]; answered = k;
      if (q.opts[k] === q.a) { right++; streak++; newDot = streak - 1; let step = 1; if (streak >= 3) { step = 2; streak = 0; newDot = -1; boost = true; G.toast && G.toast("<b>Boost!</b> +2 squares"); } pos.s = Math.min(GOAL, pos.s + step); moved = "s"; G.sfx && G.sfx("ok"); xp(5, "Right answer"); }
      else { streak = 0; newDot = -1; pos.t = Math.min(GOAL, pos.t + 1); moved = "t"; G.sfx && G.sfx("bad"); }
      if (pos.s >= GOAL) { xp(30, "Race win"); win(); }
      draw();
    }
    window.onkeydown = e => { if (location.hash !== "#race" || answered != null || /INPUT|TEXTAREA/.test(e.target.tagName)) return; const n = "1234".indexOf(e.key); if (n >= 0 && document.querySelector(`[data-o="${n}"]`)) answer(n); };
    draw();
  }

  function route() {
    stopAll(); stopAll = () => {}; window.onkeydown = null; enter(false);
    const h = location.hash.slice(1);
    if (!C) return;
    ({ jeopardy, wheel, minute, ttt, race }[h] || pick)();
    window.scrollTo(0, 0);
  }

  (G.ready || Promise.resolve()).then(() => G.lessonData(id)).then(d => {
    C = d;
    if (!C) { bar("", ""); app.innerHTML = `<p class="empty2">We couldn’t find that lesson. <a href="index.html" style="color:#fff">Go to My learning</a></p>`; return; }
    route();
  });
})();
</script>
</body>
