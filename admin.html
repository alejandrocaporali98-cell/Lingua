<body>
<div class="adm">
  <header class="adm-mbar">
    <button type="button" class="adm-burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="admSide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <span id="mmark"></span><b id="mtitle">Inicio</b>
  </header>
  <div class="adm-scrim" id="scrim" hidden></div>
  <aside class="adm-side" id="admSide" aria-label="Menú de administración">
    <a class="adm-brand" href="admin.html#inicio"><span id="mark"></span><span><b>Lingua</b><small>Administración</small></span></a>
    <nav class="adm-nav" id="admNav">
      <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Inicio</a>
      <a href="#alumnos" data-v="alumnos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Alumnos</a>
      <a href="#agenda" data-v="agenda"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Agenda<span class="cnt" id="cntAg" hidden></span></a>
      <a href="#pagos" data-v="pagos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Pagos</a>
      <a href="#fichas" data-v="fichas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Fichas de pago</a>
      <a href="#banco" data-v="banco"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M4 10h16M12 3l9 5H3z"/><path d="M6 10v8M10 10v8M14 10v8M18 10v8"/></svg>Datos bancarios</a>
      <span class="adm-sep" id="tSep" hidden></span>
      <a href="teacher.html" id="tLink" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Teacher panel</a>
    </nav>
    <div class="adm-foot">
      <span class="adm-me" id="me"></span>
      <button type="button" class="adm-ico" id="themeBtn" aria-label="Modo oscuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button type="button" class="adm-ico" id="outBtn" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <main class="adm-main"><div class="adm-wrap" id="app"></div></main>
</div>
<script>
const G = window.LINGUA, app = document.getElementById("app"), esc = G.esc;
const $ = id => document.getElementById(id);
$("mark").innerHTML = G.mark(30); $("mmark").innerHTML = G.mark(26);
const navOpen = on => { document.body.classList.toggle("nav-open", on); $("scrim").hidden = !on; $("burger").setAttribute("aria-expanded", on); };
$("burger").onclick = () => navOpen(!document.body.classList.contains("nav-open"));
$("scrim").onclick = () => navOpen(false);
document.querySelectorAll("#admNav a").forEach(a => a.addEventListener("click", () => navOpen(false)));
$("themeBtn").onclick = () => G.theme && G.theme.toggle();
$("outBtn").onclick = () => G.signOut && G.signOut();

// ── Formats ──
const day = d => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const monthKey = d => day(d).slice(0, 7);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const monthName = m => cap(new Date(m + "-15T12:00").toLocaleDateString("es-MX", { month: "long", year: "numeric" }));
const monthShort = m => cap(new Date(m + "-15T12:00").toLocaleDateString("es-MX", { month: "long" }));
const MONEY = (n, cur) => "$" + Number(n || 0).toLocaleString("es-MX", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ((cur || "MXN") === "MXN" ? "" : " " + cur);
const dShort = d => new Date(String(d).length === 10 ? d + "T12:00" : d).toLocaleDateString("es-MX", { day: "numeric", month: "short" });
const dLong = d => new Date(String(d).length === 10 ? d + "T12:00" : d).toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
const hhmm = d => new Date(d).toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" });
const DAYS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const METHOD = { transfer: "Transferencia", cash: "Efectivo", deposit: "Depósito", card: "Tarjeta", other: "Otro" };
const STATUS = { scheduled: ["Programada", ""], attended: ["Tomada", "good"], missed: ["Faltó", "bad"], cancelled: ["Cancelada", "warn"] };
const b64 = obj => { const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = ""; bytes.forEach(c => bin += String.fromCharCode(c)); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const site = () => location.origin + location.pathname.replace(/admin\.html$/, "");
const waLink = (phone, text) => { let d = String(phone || "").replace(/\D/g, ""); if (d.length === 10) d = "52" + d; return "https://wa.me/" + d + "?text=" + encodeURIComponent(text); };
const COLORS = ["#2346d0", "#0f766e", "#be123c", "#7c3aed", "#c2410c", "#0369a1", "#15803d"];
const ini = s => { const n = (s.p.display_name || "?").trim().split(/\s+/); const k = [...(s.p.id || "")].reduce((t, c) => t + c.charCodeAt(0), 0); return `<span class="ini" style="background:${COLORS[k % COLORS.length]}">${esc((n[0][0] || "?") + (n[1] ? n[1][0] : "")).toUpperCase()}</span>`; };
const I = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const months = (n, from) => Array.from({ length: n }, (_, k) => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + (from || 0) - k); return monthKey(d); });

// ── Data ──
let DATA = null;
const students = () => {
  const me = G.user && G.user.id, staff = new Set((DATA.staff || []).map(x => x.user_id)), tch = new Set((DATA.teachers || []).map(x => x.user_id));
  return DATA.profiles.filter(p => p.id !== me && !staff.has(p.id) && !tch.has(p.id)).map(p => ({ p })).sort((a, b) => (a.p.display_name || "").localeCompare(b.p.display_name || ""));
};
const byId = id => students().find(s => s.p.id === id);
const PLAN = { per_class: "Por clase", weekly: "Por semana", monthly: "Mensualidad", free: "Sin costo" };
const ST = { free: ["Sin costo", ""], none: ["—", ""], paid: ["Pagado", "good"], partial: ["Parcial", "warn"], pending: ["Pendiente", "bad"] };
const adminOf = id => G.billing.plan(DATA, id);
const clsOf = (id, m) => (DATA.classes || []).filter(c => c.student_id === id && (!m || monthKey(c.starts_at) === m));
// Families (siblings who pay together): one plan, one payment, one receipt
const famIds = id => { const ids = G.billing.members(DATA, id).filter(i => byId(i)); return ids.length ? ids : [id]; };
const nameOf = id => { const s = byId(id); return s ? s.p.display_name || "" : ""; };
const famName = id => G.billing.names(famIds(id).map(nameOf));
const famFirst = id => G.billing.names(famIds(id).map(i => nameOf(i).split(" ")[0]));
const withWho = id => { const o = famIds(id).filter(i => i !== id).map(i => nameOf(i).split(" ")[0]); return o.length ? "con " + G.billing.names(o) : ""; };
const units = () => G.billing.units(DATA, students());
function billOf(id, m) { const b = G.billing.bill(DATA, id, m); b.status = ST[b.code]; return b; }
const own = (id, m) => { const c = clsOf(id, m), n = st => c.filter(x => x.status === st).length; return { attended: n("attended"), scheduled: n("scheduled"), missed: n("missed"), cancelled: n("cancelled") }; };
const planText = a => a.billing === "free" ? "Sin costo" : !Number(a.rate) ? "Sin plan" : MONEY(a.rate, a.currency) + (a.billing === "weekly" ? " por semana" : a.billing === "monthly" ? " al mes" : " por clase");
// Weeks (weekly plans): named by their pay day
const wkRange = (id, key) => G.billing.weekRange(key, adminOf(id).pay_day);
function wkLabel(id, key, year) {
  const [a, b] = wkRange(id, key).map(x => new Date(x + "T12:00")), mo = d => d.toLocaleDateString("es-MX", { month: "long" });
  return (a.getMonth() === b.getMonth() ? `${a.getDate()} al ${b.getDate()} de ${mo(b)}` : `${a.getDate()} de ${mo(a)} al ${b.getDate()} de ${mo(b)}`) + (year ? " de " + b.getFullYear() : "");
}
const byLine = (id, w) => famIds(id).map(i => `${nameOf(i).split(" ")[0]} ${w.by[i] || 0} clase${(w.by[i] || 0) === 1 ? "" : "s"}`).join(" · ");
const wkTag = w => tag(ST[w.code === "none" ? "none" : w.code]);
const weekOpts = (id, sel) => { const pd = adminOf(id).pay_day, keys = G.billing.weekKeys(pd, 8, 2); if (sel && !keys.includes(sel)) keys.push(sel); return keys.map(k => `<option value="${k}" ${k === sel ? "selected" : ""}>${cap(dShort(k).replace(".", ""))} · ${wkLabel(id, k)}</option>`).join(""); };
const nextUnpaidWeek = (id, m) => { const b = billOf(id, m); const w = (b.weeks || []).find(x => x.due > 0 && x.paid < x.due); return w ? w.key : G.billing.weekKey(new Date(), adminOf(id).pay_day); };
// What to charge: weekly → one week; monthly fee; or every class of the month (taken + still scheduled)
function suggestedWeek(id, key) { const w = G.billing.week(DATA, id, key), a = adminOf(id); return { amount: w.bal, k: w.k, w, how: `${byLine(id, w)} · ${MONEY(a.rate, a.currency)} por semana` + (w.paid ? " − pagado " + MONEY(w.paid, a.currency) : "") }; }
function suggested(id, m) {
  const b = billOf(id, m), a = b.a;
  if (a.billing === "free") return { amount: 0, k: 0, how: "Sin costo" };
  if (a.billing === "weekly") { const n = (b.weeks || []).filter(w => w.due > 0).length; return { amount: b.bal, k: b.attended + b.scheduled, how: `${n} semana${n === 1 ? "" : "s"} × ${MONEY(a.rate, a.currency)}` + (b.paid ? " − pagado " + MONEY(b.paid, a.currency) : "") }; }
  if (a.billing === "monthly") return { amount: Math.max(0, Number(a.rate) - b.paid), k: b.attended + b.scheduled, how: "Mensualidad " + MONEY(a.rate, a.currency) + (b.paid ? " − pagado " + MONEY(b.paid, a.currency) : "") };
  const k = b.attended + b.scheduled; return { amount: Math.max(0, k * Number(a.rate) - b.paid), k, how: `${k} clase${k === 1 ? "" : "s"} × ${MONEY(a.rate, a.currency)}` + (b.paid ? " − pagado " + MONEY(b.paid, a.currency) : "") };
}
const periodOf = x => x.week ? "Semana del " + wkLabel(x.student_id, x.week) : monthShort(x.month);
const unitOptions = sel => { return units().map(u => `<option value="${u[0].p.id}" ${u.some(s => s.p.id === sel) ? "selected" : ""}>${esc(G.billing.names(u.map(s => s.p.display_name)))}</option>`).join(""); };
const unmarked = () => (DATA.classes || []).filter(c => c.status === "scheduled" && new Date(c.starts_at) < Date.now() - 3600e3 && byId(c.student_id));

async function fillFromRules() {
  if (!DATA.rules || !DATA.classes) return false;
  const want = [], now = new Date();
  DATA.rules.filter(r => r.active).forEach(r => {
    for (let k = 0; k < 14; k++) {
      const d = new Date(now); d.setDate(now.getDate() + k);
      if (d.getDay() !== r.weekday) continue;
      const [hh, mm] = r.time.split(":").map(Number); d.setHours(hh, mm, 0, 0);
      if (d < now) continue;
      if (!DATA.classes.some(c => c.student_id === r.student_id && Math.abs(new Date(c.starts_at) - d) < 60e3)) want.push({ student_id: r.student_id, starts_at: d.toISOString(), rule_id: r.id });
    }
  });
  if (!want.length) return false;
  try { await G.office.insert("classes", want); return true; } catch (e) { console.warn(e); return false; }
}
async function load() {
  try {
    DATA = await G.office.load();
    if (await fillFromRules()) DATA = await G.office.load();
    const first = !!app.querySelector(".skl"); render();
    if (first) { app.classList.add("fade-in"); setTimeout(() => app.classList.remove("fade-in"), 600); }
  } catch (e) { app.innerHTML = `<div class="card"><h2>No pudimos cargar la información</h2><p class="muted">${esc(e.message || e)}</p><div class="actions"><button class="btn" onclick="location.reload()">Intentar de nuevo</button></div></div>`; }
}

// ── Layout helpers ──
const topBar = (title, sub, actions) => `<div class="adm-top"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="actions">${actions || ""}</div></div>`;
const monthSel = (id, m, n) => `<select id="${id}" aria-label="Mes">${months(n || 12, 1).map(k => `<option value="${k}" ${k === m ? "selected" : ""}>${monthName(k)}</option>`).join("")}</select>`;
const tag = st => `<span class="tag ${st[1]}">${st[0]}</span>`;
const clsActs = c => `<span class="acts">${c.status !== "attended" ? `<button class="btn sm" data-cs="attended" data-c="${c.id}">Tomada</button>` : ""}${c.status !== "missed" ? `<button class="btn sm ghost" data-cs="missed" data-c="${c.id}">Faltó</button>` : ""}${c.status !== "cancelled" ? `<button class="btn sm ghost" data-cs="cancelled" data-c="${c.id}">Cancelar</button>` : `<button class="btn sm ghost" data-cs="scheduled" data-c="${c.id}">Reactivar</button>`}<button class="btn sm ghost" data-mv="${c.id}">Reagendar</button></span>`;
const clsRow = (c, showName) => { const s = byId(c.student_id); return `<div class="li">${showName && s ? ini(s) : ""}<div class="m"><b>${showName && s ? esc(s.p.display_name) : cap(dLong(c.starts_at))}</b><small>${showName ? cap(dLong(c.starts_at)) + " · " : ""}${hhmm(c.starts_at)}${c.rule_id ? " · horario fijo" : ""}</small></div>${tag(STATUS[c.status] || ["", ""])}${clsActs(c)}</div>`; };
function wireClassActs() {
  app.querySelectorAll("[data-cs]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await G.office.update("classes", b.dataset.c, { status: b.dataset.cs }); G.toast(`<b>Clase ${STATUS[b.dataset.cs][0].toLowerCase()}</b>`); await load(); } catch (e) { G.toast("No se pudo guardar: " + esc(e.message)); b.disabled = false; }
  });
  app.querySelectorAll("[data-mv]").forEach(b => b.onclick = () => moveSheet((DATA.classes || []).find(c => c.id === b.dataset.mv)));
}
const setupNote = () => `<div class="alert info">Falta un paso de instalación: Alejandro tiene que correr <b>supabase/v4.sql</b> en Supabase.</div>`;

// ── Sheets (pop-ups) ──
function closeSheet() { const w = $("sheet"); if (w) w.remove(); document.body.classList.remove("sheet-open"); if (window.__shKey) { document.removeEventListener("keydown", window.__shKey); window.__shKey = null; } }
window.addEventListener("hashchange", closeSheet);
function sheet(title, sub, body) {
  closeSheet();
  const w = document.createElement("div"); w.id = "sheet";
  w.innerHTML = `<div class="sh-scrim" data-x></div><div class="asheet" role="dialog" aria-modal="true" aria-labelledby="shT"><i class="sh-grab" aria-hidden="true"></i>
    <div class="sh-head"><div style="flex:1;min-width:0"><b id="shT">${title}</b>${sub ? `<small>${sub}</small>` : ""}</div><button type="button" class="sh-x" data-x aria-label="Cerrar">${I('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>
    <div class="sh-body">${body}</div></div>`;
  document.body.appendChild(w); document.body.classList.add("sheet-open");
  w.querySelectorAll("[data-x]").forEach(x => x.onclick = closeSheet);
  window.__shKey = e => { if (e.key === "Escape") closeSheet(); }; document.addEventListener("keydown", window.__shKey);
  requestAnimationFrame(() => w.classList.add("in"));
  setTimeout(() => { const f = w.querySelector("input:not([type=file]), select, button.btn"); f && f.focus(); }, 60);
  return w;
}
function moveSheet(c) {
  if (!c) return; const s = byId(c.student_id), d = new Date(c.starts_at);
  const w = sheet("Reagendar clase", esc(s ? s.p.display_name : ""), `
    <div class="grid2"><div class="field"><label for="mvD">Fecha</label><input id="mvD" type="date" value="${day(d)}"></div><div class="field"><label for="mvT">Hora</label><input id="mvT" type="time" value="${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}"></div></div>
    <button class="btn primary" id="mvSave">Guardar</button>`);
  w.querySelector("#mvSave").onclick = async () => {
    const v = $("mvD").value, t = $("mvT").value; if (!v || !t) return G.toast("Escoge fecha y hora");
    try { await G.office.update("classes", c.id, { starts_at: new Date(v + "T" + t).toISOString(), status: "scheduled" }); closeSheet(); G.toast("<b>Clase reagendada</b>"); await load(); } catch (e) { G.toast("No se pudo guardar: " + esc(e.message)); }
  };
}

// ── Receipts, slips and proofs ──
function receiptLink(p) {
  const a = adminOf(p.student_id), wk = p.week ? G.billing.week(DATA, p.student_id, p.week) : null, b = wk ? null : billOf(p.student_id, p.month);
  const D = { t: p.token || "", no: "R-" + (p.week || p.month).replace(/-/g, "") + "-" + String(p.id).replace(/-/g, "").slice(0, 4).toUpperCase(), n: famName(p.student_id),
    m: wk ? "semana del " + wkLabel(p.student_id, p.week, true) : new Date(p.month + "-15T12:00").toLocaleDateString("es-MX", { month: "long", year: "numeric" }),
    d: p.paid_on, a: Number(p.amount), cur: a.currency || "MXN", pl: wk ? "weekly" : a.billing, k: wk ? wk.attended || wk.k : b.attended, r: Number(a.rate) || 0, by: wk && famIds(p.student_id).length > 1 ? byLine(p.student_id, wk) : "",
    nt: p.note || "", ow: G.maestroNombre || G.maestro, du: wk ? wk.rate : b.due, pt: wk ? wk.paid : b.paid, mt: p.method || "", rf: p.reference || "" };
  return site() + "recibo.html?d=" + b64(D);
}
function slipLink(ch) {
  const a = adminOf(ch.student_id), bk = DATA.bank || {}, wk = ch.week ? G.billing.week(DATA, ch.student_id, ch.week) : null, sg = wk ? null : suggested(ch.student_id, ch.month);
  const D = { t: ch.token || "", f: ch.folio, n: famName(ch.student_id), c: ch.concept || "", m: wk ? "semana del " + wkLabel(ch.student_id, ch.week, true) : new Date(ch.month + "-15T12:00").toLocaleDateString("es-MX", { month: "long", year: "numeric" }), a: Number(ch.amount), cur: a.currency || "MXN",
    du: "", e: day(ch.created_at || new Date()), pl: wk ? "weekly" : a.billing, r: Number(a.rate) || 0, k: wk ? wk.k : sg.k, by: wk && famIds(ch.student_id).length > 1 ? byLine(ch.student_id, wk) : "", nt: ch.note || "", ow: G.maestroNombre || G.maestro };
  return site() + "ficha.html?d=" + b64(D);
}
const firstName = s => (s && s.p.display_name || "").split(" ")[0];
const periodText = x => x.week ? "semana del " + wkLabel(x.student_id, x.week) : monthShort(x.month).toLowerCase();
function slipText(ch) { const a = adminOf(ch.student_id); return `Hola, le comparto la ficha de pago de las clases de inglés de ${famFirst(ch.student_id)} (${periodText(ch)}): ${MONEY(ch.amount, a.currency)}. Ahí vienen los datos para la transferencia: ${slipLink(ch)}`; }
function receiptText(p) { const a = adminOf(p.student_id); return `Hola, recibimos su pago de ${MONEY(p.amount, a.currency)} por las clases de inglés de ${famFirst(p.student_id)} (${periodText(p)}). ¡Gracias! Aquí está su recibo: ${receiptLink(p)}`; }
const phoneOf = id => { const ph = famIds(id).map(i => adminOf(i)).find(a => a.parent_phone || a.phone); return ph ? ph.parent_phone || ph.phone : ""; };
async function showProof(path) {
  const w = sheet("Comprobante", "", `<p class="hint">Cargando…</p>`);
  try {
    const url = await G.office.proofUrl(path), pdf = /\.pdf$/i.test(path);
    w.querySelector(".sh-body").innerHTML = (pdf ? `<p>Es un archivo PDF.</p>` : `<img class="proofimg" src="${esc(url)}" alt="Captura del comprobante de pago">`) + `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">${pdf ? "Abrir PDF" : "Abrir en tamaño completo"}</a>`;

  let lastId = null;
  const weekly = () => adminOf($("pyS").value).billing === "weekly";

    else { const mm = $("pyM").value, b = billOf(id, mm), sg = suggested(id, mm); $("pyA").value = usePre ? pre.amount : sg.amount || ""; $("pyHint").textContent = a.billing === "free" ? "Este alumno no paga." : `${sg.how} · Pagado en ${monthShort(mm).toLowerCase()}: ${MONEY(b.paid, a.currency)}`; }
  };

function addProof(p) {

}

function wirePays() {
  app.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => showProof(b.dataset.pf));

  if (!G.cloudEnabled) { app.innerHTML = `<div class="card"><h2>Administración</h2><p class="muted">Este panel necesita las cuentas en línea (Supabase).</p></div>`; return; }
  if (!G.isAdmin && !G.isTeacher) { app.innerHTML = `<div class="card"><h2>Esta sección es solo para administración</h2><p class="muted">Tu cuenta no tiene acceso. <a href="index.html">Ir a Lingua</a></p></div>`; return; }
  if (G.isTeacher) { $("tLink").hidden = false; $("tSep").hidden = false; }
  load();
});
</script>
