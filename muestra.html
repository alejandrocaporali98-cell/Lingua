<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingua · Tu clase muestra</title>
<meta name="robots" content="noindex">
<meta name="description" content="Cuéntame tres cosas y armo tu clase muestra de inglés pensando en ti.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/lingua.css">
<style>
  body { background: var(--bg); }
  .wrap { max-width: 460px; margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 22px; }
  .brandrow { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .hero { background: #1b1f2a; color: #fff; border-radius: 16px; padding: 18px; display: grid; gap: 10px; }
  .hero .k { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: #f5c518; }
  .hero h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; color: #fff; }
  .hero .who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #c9cee0; }
  .hero .who i { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #1b1f2a; font-style: normal; font-weight: 800; display: grid; place-items: center; font-size: 13px; flex: none; }
  .q { display: grid; gap: 10px; }
  .q > b { display: flex; gap: 10px; align-items: center; font-size: 16px; }
  .q > b span { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .q .sub { font-size: 12.5px; color: var(--mute); margin-top: -4px; }
  .in { width: 100%; box-sizing: border-box; background: var(--surface); border: 1.5px solid var(--line-2, #cfd4dd); border-radius: 12px; padding: 13px 14px; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink); }
  .in:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--line); border-radius: 12px; padding: 4px; }
  .seg button { font: inherit; border: 0; background: transparent; border-radius: 9px; padding: 10px 6px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); cursor: pointer; min-height: 44px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 800; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip-t { font: inherit; padding: 9px 13px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1.5px solid var(--line-2, #d5d9e2); background: var(--surface); color: var(--ink); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 40px; }
  .chip-t[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .chip-t svg { display: none; } .chip-t[aria-pressed="true"] svg { display: block; }
  .opt-r { font: inherit; text-align: left; display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; width: 100%; }
  .opt-r i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2, #cfd4dd); box-sizing: border-box; display: grid; place-items: center; margin-top: 1px; }
  .opt-r[aria-checked="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .opt-r[aria-checked="true"] i { border-color: var(--brand); } .opt-r[aria-checked="true"] i::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  .opt-r b { display: block; font-size: 14.5px; } .opt-r small { font-size: 12.5px; color: var(--mute); }
  .go { width: 100%; justify-content: center; padding: 15px; font-size: 15.5px; border-radius: 12px; }
  .foot { font-size: 12px; color: var(--mute); text-align: center; margin-top: -10px; }
  .msg { font-size: 14px; } .err { color: var(--bad-ink, #9f1239); font-size: 13.5px; font-weight: 600; }
  .done { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; display: grid; gap: 12px; }
  .done h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .done .ok { width: 44px; height: 44px; border-radius: 50%; background: #15803d; display: grid; place-items: center; }
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"><p class="muted">Cargando…</p></div>
<script src="assets/config.js"></script>
<script src="assets/muestra-data.js"></script>
<script src="assets/verify.js"></script>
<script>
(async function () {
  const G = window.LINGUA, M = window.MUESTRA, app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const token = new URLSearchParams(location.search).get("t") || "";
  const teacher = G.maestroNombre || G.maestro;
  const when = d => { if (!d) return ""; const x = new Date(d); return x.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" }).replace(".", "") + ", " + x.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }).replace(/\s?a\.\s?m\./, " am").replace(/\s?p\.\s?m\./, " pm"); };
  const whenLong = d => { if (!d) return ""; const x = new Date(d); return x.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }) + " a las " + x.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }).replace(/\s?a\.\s?m\./, " am").replace(/\s?p\.\s?m\./, " pm"); };
  const brand = `<div class="brandrow">${G.mark(28)}Lingua</div>`;
  const CHECK = c => `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c || "currentColor"}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const bad = (t, p) => { app.innerHTML = brand + `<div class="done"><h2>${t}</h2><p class="muted">${p}</p></div>`; };

  if (!window.linguaUuid(token)) return bad("Este enlace no está completo", "Pídele a tu profesor que te lo vuelva a mandar.");
  const r = await window.linguaRpc("trial_get", { t: token });
  if (r.state === "error") return bad("No pudimos cargar tu clase", "Revisa tu conexión e intenta de nuevo en un momento.");
  if (r.state === "off") return bad("Página de prueba", "Esta copia del sitio no está conectada.");
  const T = r.data;
  if (!T) return bad("Este enlace ya no es válido", "Pídele a tu profesor que te lo vuelva a mandar.");
  if (T.closed) {
    app.innerHTML = brand + `<div class="done"><span class="ok">${CHECK("#fff")}</span><h2>Tu clase muestra ya pasó</h2><p class="muted">Gracias por venir. Aquí está tu reporte con tu nivel y tu plan.</p><a class="btn primary go" href="reporte-muestra.html?t=${esc(token)}">Ver mi reporte</a></div>`;
    return;
  }
  const S = { name: T.name || "", adult: T.adult == null ? null : !!T.adult, interests: new Set(T.interests || []), other: T.other || "", goal: T.goal || "" };

  function thanks() {
    app.innerHTML = brand + `<div class="done"><span class="ok">${CHECK("#fff")}</span><h2>¡Listo, ${esc(S.name.split(" ")[0])}!</h2>
      <p>Ya tengo lo que necesito para preparar tu clase${T.starts_at ? ". Nos vemos el <b>" + esc(whenLong(T.starts_at)) + "</b>" : ""}.</p>
      <p class="muted" style="font-size:13.5px">Si quieres cambiar algo, puedes hacerlo antes de la clase.</p>
      <button class="btn" id="edit">Cambiar mis respuestas</button></div>`;
    document.getElementById("edit").onclick = form;
  }
  function form() {
    app.innerHTML = brand + `
      <div class="hero"><span class="k">TU CLASE MUESTRA</span><h1>Cuéntame tres cosas y armo la clase pensando en ti</h1>
        <div class="who"><i>${esc(teacher[0])}</i>Con ${esc(teacher)}${T.starts_at ? " · " + esc(when(T.starts_at)) : ""}</div></div>
      <div class="q"><b><span>1</span><label for="fName">¿Cómo te llamas?</label></b>
        <input class="in" id="fName" maxlength="80" autocomplete="name" placeholder="Tu nombre" value="${esc(S.name)}">
        <div class="seg" role="group" aria-label="Edad"><button type="button" data-a="0" aria-pressed="${S.adult === false}">Tengo menos de 18</button><button type="button" data-a="1" aria-pressed="${S.adult === true}">Tengo 18 o más</button></div></div>
      <div class="q"><b><span>2</span>¿Qué te late?</b><span class="sub">Escoge los que quieras. La lectura de la clase será de esto.</span>
        <div class="chips">${M.INTERESTS.map(i => `<button type="button" class="chip-t" data-k="${i.k}" aria-pressed="${S.interests.has(i.k)}">${CHECK()}${esc(i.es)}</button>`).join("")}</div>
        <input class="in" id="fOther" maxlength="120" placeholder="+ Otro: escribe lo que quieras…" style="font-weight:500;border-style:dashed" value="${esc(S.other)}"></div>
      <div class="q"><b><span>3</span>¿Para qué quieres el inglés?</b>
        <div role="radiogroup" aria-label="Para qué quieres el inglés" style="display:grid;gap:8px">${M.GOALS.map(g => `<button type="button" role="radio" class="opt-r" data-g="${g.k}" aria-checked="${S.goal === g.k}"><i></i><span><b>${esc(g.es)}</b><small>${esc(g.sub)}</small></span></button>`).join("")}</div></div>
      <p class="err" id="fErr" hidden></p>
      <button class="btn primary go" id="fGo">${T.starts_at ? "Listo, nos vemos el " + esc(new Date(T.starts_at).toLocaleDateString("es-MX", { weekday: "long" })) : "Listo"}</button>
      <p class="foot">No necesitas crear cuenta. Toma 1 minuto.</p>`;
    app.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.adult = b.dataset.a === "1"; app.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    app.querySelectorAll(".chip-t").forEach(b => b.onclick = () => { const k = b.dataset.k, on = !S.interests.has(k); on ? S.interests.add(k) : S.interests.delete(k); b.setAttribute("aria-pressed", on); });
    app.querySelectorAll(".opt-r").forEach(b => b.onclick = () => { S.goal = b.dataset.g; app.querySelectorAll(".opt-r").forEach(x => x.setAttribute("aria-checked", x === b)); });
    app.addEventListener("input", () => { const e = document.getElementById("fErr"); if (e) e.hidden = true; });
    app.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { const e = document.getElementById("fErr"); if (e && b.id !== "fGo") e.hidden = true; }));
    const err = t => { const e = document.getElementById("fErr"); e.textContent = t; e.hidden = !t; if (t) e.scrollIntoView({ block: "center", behavior: "smooth" }); };
    document.getElementById("fGo").onclick = async () => {
      S.name = document.getElementById("fName").value.trim(); S.other = document.getElementById("fOther").value.trim();
      if (!S.name) { document.getElementById("fName").focus(); return err("Escribe tu nombre."); }
      if (S.adult === null) return err("Dinos si tienes menos de 18 o 18 o más.");
      if (!S.interests.size && !S.other) return err("Escoge al menos un tema que te guste.");
      if (!S.goal) return err("Escoge para qué quieres el inglés.");
      err("");
      const btn = document.getElementById("fGo"); btn.disabled = true; btn.textContent = "Enviando…";
      const res = await window.linguaRpc("trial_intake", { t: token, p_name: S.name, p_adult: S.adult, p_interests: [...S.interests], p_other: S.other, p_goal: S.goal });
      if (res.state === "ok" && res.data === true) return thanks();
      btn.disabled = false; btn.textContent = "Intentar de nuevo";
      err(res.state === "ok" ? "Este enlace ya no acepta cambios." : "No se pudo enviar. Revisa tu conexión e intenta de nuevo.");
    };
  }
  T.sent ? thanks() : form();
})();
</script>
</body>
</html>
